<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ionic Doc Pro - Live Preview</title>
    <!-- Cargando React y dependencias desde CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* Contenedor tipo papel A4 */
        .preview-paper {
            min-height: 297mm;
            width: 210mm; 
            background: white;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            position: relative;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        @media (max-width: 1024px) {
            .preview-paper {
                width: 100%; 
                min-height: auto;
            }
        }

        .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const App = () => {
            const [hoveredVariantId, setHoveredVariantId] = useState(null);
            const [showImportModal, setShowImportModal] = useState(false);
            const [showEditor, setShowEditor] = useState(true);
            const [importText, setImportText] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [activeDragId, setActiveDragId] = useState(null);
            const fileInputRef = useRef(null);

            const [formData, setFormData] = useState({
                name: '',
                subtitle: '',
                description: '',
                status: 'Estable',
                historyCommits: [],
                globalParameters: [
                    { id: '1', name: 'color', type: 'string', description: '[Input] Color del tema' }
                ],
                methods: [],
                variants: [
                    {
                        id: Date.now(),
                        name: 'Variante Principal',
                        description: '',
                        image: null,
                        selectedProperties: [{ parameterId: '1', value: 'primary' }]
                    }
                ]
            });

            // Escuchar pegado de imágenes global
            useEffect(() => {
                const handleGlobalPaste = (event) => {
                    if (hoveredVariantId) {
                        const items = event.clipboardData.items;
                        for (let i = 0; i < items.length; i++) {
                            if (items[i].type.indexOf("image") !== -1) {
                                const blob = items[i].getAsFile();
                                processImage(hoveredVariantId, blob);
                            }
                        }
                    }
                };
                window.addEventListener('paste', handleGlobalPaste);
                return () => window.removeEventListener('paste', handleGlobalPaste);
            }, [hoveredVariantId]);

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const processImage = (id, file) => {
                if (file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setFormData(prev => ({
                            ...prev,
                            variants: prev.variants.map(v => v.id === id ? { ...v, image: reader.result } : v)
                        }));
                    };
                    reader.readAsDataURL(file);
                }
            };

            // --- FUNCIONES DE PERSISTENCIA (JSON) ---
            const saveProject = () => {
                const dataStr = JSON.stringify(formData, null, 2);
                const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);
                const exportFileDefaultName = `${formData.name || 'proyecto'}-doc.json`;
                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataUri);
                linkElement.setAttribute('download', exportFileDefaultName);
                linkElement.click();
            };

            const loadProject = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const json = JSON.parse(event.target.result);
                        setFormData(json);
                        // Resetear input para poder cargar el mismo archivo si es necesario
                        e.target.value = '';
                    } catch (err) {
                        alert("Error al cargar el archivo JSON.");
                    }
                };
                reader.readAsText(file);
            };

            const processImport = () => {
                const lines = importText.split('\n');
                const newParams = [];
                const regex = /@(Input|Output)\(\)\s+(\w+)\s*:\s*([^=;]+)/;
                lines.forEach(line => {
                    const match = line.match(regex);
                    if (match) {
                        const [_, decorator, name, type] = match;
                        newParams.push({
                            id: (Date.now() + Math.random()).toString(),
                            name: name.trim(),
                            type: type.trim(),
                            description: `[${decorator}] Detectado automáticamente`
                        });
                    }
                });
                if (newParams.length > 0) {
                    setFormData(prev => ({ ...prev, globalParameters: [...prev.globalParameters, ...newParams] }));
                    setImportText('');
                    setShowImportModal(false);
                }
            };

            const generatePDF = () => {
                setIsGenerating(true);
                setTimeout(() => {
                    try {
                        const { jsPDF } = window.jspdf;
                        const doc = new jsPDF();
                        const margin = 15;
                        let currentY = 20;

                        const checkPageBreak = (neededHeight) => {
                            if (currentY + neededHeight > 275) {
                                doc.addPage();
                                currentY = 20;
                            }
                        };

                        // --- HEADER ---
                        doc.setDrawColor(56, 128, 255);
                        doc.setLineWidth(1.5);
                        doc.line(margin, 25, 195, 25);

                        doc.setFontSize(26);
                        doc.setFont("helvetica", "bold");
                        doc.setTextColor(56, 128, 255);
                        doc.text((formData.name || 'Componente Ionic').toUpperCase(), margin, 20);

                        currentY = 32;
                        if (formData.subtitle) {
                            doc.setFontSize(14);
                            doc.setFont("courier", "italic");
                            doc.setTextColor(100, 116, 139);
                            doc.text(formData.subtitle.toLowerCase(), margin, currentY);
                            currentY += 8;
                        }

                        // STATUS BADGE
                        const statusText = (formData.status || 'ESTABLE').toUpperCase();
                        doc.setFontSize(9);
                        doc.setFont("helvetica", "bold");
                        const statusWidth = doc.getTextWidth(statusText);
                        doc.setFillColor(30, 41, 59);
                        doc.roundedRect(195 - statusWidth - 8, 14, statusWidth + 8, 6, 3, 3, 'F');
                        doc.setTextColor(255, 255, 255);
                        doc.text(statusText, 195 - statusWidth - 4, 18.5);

                        // GLOBAL DESCRIPTION
                        currentY += 5;
                        doc.setFontSize(10);
                        doc.setFont("helvetica", "bold");
                        doc.setTextColor(148, 163, 184);
                        doc.text("DESCRIPCIÓN DEL COMPONENTE", margin, currentY);
                        
                        currentY += 6;
                        doc.setFont("helvetica", "normal");
                        doc.setTextColor(71, 85, 105);
                        const splitDesc = doc.splitTextToSize(formData.description || 'Sin descripción.', 175);
                        doc.text(splitDesc, margin + 6, currentY);
                        currentY += (splitDesc.length * 5) + 12;

                        // API TABLE
                        doc.setFontSize(11);
                        doc.setFont("helvetica", "bold");
                        doc.setTextColor(56, 128, 255);
                        doc.text("API: PARÁMETROS", margin, currentY);
                        
                        doc.autoTable({
                            startY: currentY + 4,
                            head: [['Nombre', 'Tipo', 'Descripción']],
                            body: formData.globalParameters.map(p => [p.name || '-', p.type || 'any', p.description || '-']),
                            theme: 'grid',
                            headStyles: { fillColor: [56, 128, 255], fontSize: 10 },
                            styles: { lineWidth: 0.1, lineColor: [226, 232, 240], cellPadding: 3 }
                        });
                        currentY = doc.lastAutoTable.finalY + 15;

                        // MÉTODOS
                        if (formData.methods.length > 0) {
                            checkPageBreak(30);
                            doc.setFontSize(11);
                            doc.setFont("helvetica", "bold");
                            doc.setTextColor(244, 180, 0);
                            doc.text("LÓGICA INTERNA", margin, currentY);
                            
                            doc.autoTable({
                                startY: currentY + 4,
                                head: [['Método', 'Firma', 'Descripción']],
                                body: formData.methods.map(m => [m.name || '-', m.details || 'void', m.description || '-']),
                                theme: 'grid',
                                headStyles: { fillColor: [244, 180, 0], fontSize: 10 },
                                styles: { lineWidth: 0.1, lineColor: [226, 232, 240], cellPadding: 3 }
                            });
                            currentY = doc.lastAutoTable.finalY + 15;
                        }

                        // VARIANTES
                        checkPageBreak(40);
                        doc.setFontSize(11);
                        doc.setFont("helvetica", "bold");
                        doc.setTextColor(148, 163, 184);
                        doc.text("GALERÍA DE VARIANTES", margin, currentY);
                        currentY += 10;

                        formData.variants.forEach((v, idx) => {
                            checkPageBreak(60);
                            doc.setDrawColor(30, 41, 59);
                            doc.setLineWidth(2);
                            doc.line(margin, currentY - 4, margin, currentY + 4);
                            doc.setFontSize(13);
                            doc.setFont("helvetica", "bold");
                            doc.setTextColor(30, 41, 59);
                            doc.text(`${idx + 1}. ${v.name || 'Variante'}`.toUpperCase(), margin + 5, currentY);
                            currentY += 8;
                            
                            if (v.description) {
                                doc.setFontSize(9);
                                doc.setFont("helvetica", "italic");
                                doc.setTextColor(100, 116, 139);
                                const vDesc = doc.splitTextToSize(v.description, 175);
                                doc.text(vDesc, margin + 5, currentY);
                                currentY += (vDesc.length * 5) + 6;
                            } else {
                                currentY += 2;
                            }

                            const blockY = currentY;
                            const imgW = 75;
                            const imgH = 45;

                            // Imagen a la izquierda tal cual viene
                            if (v.image) {
                                try {
                                    doc.addImage(v.image, 'JPEG', margin + 5, blockY, imgW, imgH);
                                } catch(e) { console.error(e); }
                            } else {
                                doc.setFillColor(250, 250, 250);
                                doc.rect(margin + 5, blockY, imgW, imgH, 'F');
                            }

                            const vProps = v.selectedProperties.map(sp => {
                                const p = formData.globalParameters.find(g => g.id === sp.parameterId);
                                return [p ? p.name : '-', sp.value || '-'];
                            });

                            doc.autoTable({
                                startY: blockY,
                                margin: { left: margin + 85 },
                                head: [['Atributo', 'Valor']],
                                body: vProps,
                                theme: 'grid',
                                headStyles: { fillColor: [71, 85, 105], fontSize: 8 },
                                bodyStyles: { fontSize: 8 },
                                styles: { lineWidth: 0.1, lineColor: [226, 232, 240], cellPadding: 2 }
                            });

                            const endT = doc.lastAutoTable.finalY;
                            currentY = Math.max(endT, blockY + imgH) + 15;
                        });

                        // GIT HISTORY
                        if (formData.historyCommits.length > 0) {
                            checkPageBreak(40);
                            doc.setFontSize(11);
                            doc.setFont("helvetica", "bold");
                            doc.setTextColor(30, 41, 59);
                            doc.text("TRAZABILIDAD GIT", margin, currentY);
                            doc.autoTable({
                                startY: currentY + 4,
                                head: [['Mensaje', 'Hash']],
                                body: formData.historyCommits.map(c => [c.title || '-', (c.hash || 'N/A').toUpperCase()]),
                                theme: 'grid',
                                headStyles: { fillColor: [30, 41, 59], fontSize: 9 },
                                bodyStyles: { fontSize: 8, textColor: [255, 255, 255], fillColor: [30, 41, 59] },
                                columnStyles: { 1: { fontStyle: 'bold', textColor: [96, 165, 250], font: 'courier' } }
                            });
                        }

                        doc.save(`${formData.name || 'documento'}.pdf`);
                    } catch (err) {
                        console.error(err);
                        alert("Error al exportar.");
                    } finally {
                        setIsGenerating(false);
                    }
                }, 500);
            };

            return (
                <div className="flex flex-col lg:flex-row min-h-screen">
                    {/* INPUT OCULTO CARGA JSON */}
                    <input type="file" ref={fileInputRef} className="hidden" accept=".json" onChange={loadProject}/>

                    {/* BOTÓN FLOTANTE PARA CAMBIAR VISTA (VISIBLE SIEMPRE) */}
                    <div className="fixed top-6 right-8 z-[100] flex gap-3">
                        <button onClick={() => setShowEditor(!showEditor)} className={`p-3 rounded-2xl shadow-2xl transition-all border-2 ${showEditor ? 'bg-white text-slate-600 border-slate-100 hover:bg-slate-50' : 'bg-blue-600 text-white border-blue-500 hover:bg-blue-700'}`} title={showEditor ? "Ver Hojas (Pantalla Completa)" : "Volver al Editor"}>
                            <Icon name={showEditor ? "expand" : "edit-3"} size={24}/>
                        </button>
                    </div>

                    {/* MODAL IMPORTAR CÓDIGO */}
                    {showImportModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-lg rounded-3xl shadow-2xl p-6 animate-in zoom-in duration-200">
                                <div className="flex justify-between items-center mb-4 text-blue-600">
                                    <h3 className="font-bold flex items-center gap-2 tracking-tight"><Icon name="wand-2"/> Importar Angular</h3>
                                    <button onClick={() => setShowImportModal(false)}><Icon name="x"/></button>
                                </div>
                                <textarea value={importText} onChange={e => setImportText(e.target.value)} placeholder="@Input() value: string;" className="w-full h-44 p-4 bg-slate-50 rounded-2xl outline-none font-mono text-xs border border-slate-200 focus:ring-2 focus:ring-blue-100 transition-all mb-4"/>
                                <button onClick={processImport} className="w-full py-3 bg-blue-600 text-white font-bold rounded-xl shadow-lg hover:bg-blue-700">Procesar Código</button>
                            </div>
                        </div>
                    )}

                    {/* EDITOR */}
                    {showEditor && (
                        <div className={`w-full lg:w-1/2 p-4 md:p-8 overflow-y-auto h-screen custom-scrollbar bg-slate-50 border-r border-slate-200 animate-in slide-in-from-left duration-300`}>
                            <header className="flex justify-between items-center mb-8 gap-4 text-slate-800">
                                <div className="flex items-center gap-4">
                                    <div className="bg-blue-600 p-3 rounded-2xl text-white shadow-lg"><Icon name="layers" size={24}/></div>
                                    <div><h1 className="text-xl font-black tracking-tight">Ionic Doc Maker</h1><p className="text-[10px] text-slate-400 uppercase font-black tracking-widest italic">Modo Edición</p></div>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => fileInputRef.current.click()} className="p-2.5 bg-slate-200 text-slate-600 rounded-xl hover:bg-slate-300 transition-all shadow-sm" title="Abrir Proyecto (.json)">
                                        <Icon name="folder-open" size={20}/>
                                    </button>
                                    <button onClick={saveProject} className="p-2.5 bg-slate-200 text-slate-600 rounded-xl hover:bg-slate-300 transition-all shadow-sm" title="Guardar Proyecto (.json)">
                                        <Icon name="save" size={20}/>
                                    </button>
                                    <button onClick={generatePDF} disabled={isGenerating} className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl font-bold shadow-lg transition-all flex items-center gap-2 text-sm active:scale-95 disabled:opacity-50 mr-12">
                                        {isGenerating ? <Icon name="loader-2" className="animate-spin"/> : <Icon name="download"/>} PDF
                                    </button>
                                </div>
                            </header>

                            <div className="space-y-6 pb-20">
                                {/* General */}
                                <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                                    <div className="flex items-center gap-2 mb-4 text-blue-600 font-bold uppercase text-[10px] tracking-widest"><Icon name="info" size={16}/><span>Información</span></div>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div className="md:col-span-2 space-y-3">
                                            <input name="name" value={formData.name} onChange={handleInputChange} placeholder="Nombre Principal" className="w-full p-2.5 bg-slate-50 rounded-xl font-bold text-lg outline-none focus:ring-2 focus:ring-blue-100 transition-all"/>
                                            <input name="subtitle" value={formData.subtitle} onChange={handleInputChange} placeholder="Subtítulo técnico" className="w-full p-2.5 bg-slate-50 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-100"/>
                                        </div>
                                        <select name="status" value={formData.status} onChange={handleInputChange} className="p-2.5 bg-slate-50 rounded-xl font-bold text-sm h-fit outline-none border border-transparent hover:border-slate-200 transition-all cursor-pointer">
                                            <option>🟢 Estable</option><option>🟡 Beta</option><option>🔴 Obsoleto</option>
                                        </select>
                                        <textarea name="description" value={formData.description} onChange={handleInputChange} placeholder="Descripción global..." className="md:col-span-3 w-full p-3 bg-slate-50 rounded-xl outline-none text-sm min-h-[80px]"/>
                                    </div>
                                </div>

                                {/* Parámetros */}
                                <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                                    <div className="flex justify-between items-center mb-4 text-blue-600 uppercase text-[10px] font-bold tracking-widest">
                                        <div className="flex items-center gap-2"><Icon name="settings" size={16}/><span>API: Parámetros</span></div>
                                        <div className="flex gap-2">
                                            <button onClick={() => setShowImportModal(true)} className="px-3 py-1 bg-indigo-50 text-indigo-600 rounded-lg font-bold hover:bg-indigo-100 italic tracking-tighter text-[10px]">@ Importar</button>
                                            <button onClick={() => setFormData(p => ({...p, globalParameters: [...p.globalParameters, {id: Date.now().toString(), name: '', type: '', description: ''}]}))} className="p-1.5 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100"><Icon name="plus" size={16}/></button>
                                        </div>
                                    </div>
                                    <div className="space-y-2">
                                        {formData.globalParameters.map(p => (
                                            <div key={p.id} className="flex gap-2 bg-slate-50 p-2 rounded-xl group transition-all border border-transparent hover:border-slate-200">
                                                <input placeholder="Nombre" value={p.name} onChange={e => setFormData(f => ({...f, globalParameters: f.globalParameters.map(x => x.id === p.id ? {...x, name: e.target.value} : x)}))} className="flex-1 p-2 bg-white rounded-lg text-[11px] font-bold outline-none"/>
                                                <input placeholder="Tipo" value={p.type} onChange={e => setFormData(f => ({...f, globalParameters: f.globalParameters.map(x => x.id === p.id ? {...x, type: e.target.value} : x)}))} className="w-20 p-2 bg-white rounded-lg text-[11px] outline-none italic"/>
                                                <input placeholder="Descripción" value={p.description} onChange={e => setFormData(f => ({...f, globalParameters: f.globalParameters.map(x => x.id === p.id ? {...x, description: e.target.value} : x)}))} className="flex-[2] p-2 bg-white rounded-lg text-[11px] outline-none"/>
                                                <button onClick={() => setFormData(f => ({...f, globalParameters: f.globalParameters.filter(x => x.id !== p.id)}))} className="text-slate-300 hover:text-red-500 px-1"><Icon name="trash-2" size={14}/></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Métodos */}
                                <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                                    <div className="flex justify-between items-center mb-4 text-amber-600 font-bold uppercase text-[10px] tracking-widest">
                                        <div className="flex items-center gap-2"><Icon name="zap" size={16}/><span>Lógica Interna</span></div>
                                        <button onClick={() => setFormData(p => ({...p, methods: [...p.methods, {id: Date.now().toString(), name: '', details: '', description: ''}]}))} className="p-1.5 bg-amber-50 text-amber-600 rounded-lg hover:bg-amber-100"><Icon name="plus" size={16}/></button>
                                    </div>
                                    <div className="space-y-3">
                                        {formData.methods.map(m => (
                                            <div key={m.id} className="bg-slate-50 p-3 rounded-2xl flex gap-3 items-start group border border-transparent hover:border-amber-200 transition-all">
                                                <div className="flex-1 space-y-2">
                                                    <div className="flex gap-2">
                                                        <input placeholder="Metodo()" value={m.name} onChange={e => setFormData(f => ({...f, methods: f.methods.map(x => x.id === m.id ? {...x, name: e.target.value} : x)}))} className="flex-1 p-2 bg-white rounded-lg text-[11px] font-bold outline-none text-amber-700"/>
                                                        <input placeholder="void" value={m.details} onChange={e => setFormData(f => ({...f, methods: f.methods.map(x => x.id === m.id ? {...x, details: e.target.value} : x)}))} className="w-24 p-2 bg-white rounded-lg text-[11px] italic outline-none"/>
                                                    </div>
                                                    <textarea placeholder="Descripción lógica..." value={m.description} onChange={e => setFormData(f => ({...f, methods: f.methods.map(x => x.id === m.id ? {...x, description: e.target.value} : x)}))} className="w-full p-2 bg-white rounded-lg text-[11px] outline-none h-12"/>
                                                </div>
                                                <button onClick={() => setFormData(f => ({...f, methods: f.methods.filter(x => x.id !== m.id)}))} className="text-slate-300 hover:text-red-500 p-1"><Icon name="trash-2" size={14}/></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Variantes */}
                                <div className="space-y-4">
                                    <div className="flex justify-between px-4 font-bold text-[10px] text-slate-400 uppercase tracking-widest">
                                        <div className="flex items-center gap-2"><Icon name="image" size={14}/><span>Variantes Visuales</span></div>
                                        <button onClick={() => setFormData(p => ({...p, variants: [...p.variants, {id: Date.now(), name: '', description: '', image: null, selectedProperties: []}]}))} className="text-blue-600 hover:underline">+ Variante</button>
                                    </div>
                                    {formData.variants.map(v => (
                                        <div key={v.id} onMouseEnter={() => setHoveredVariantId(v.id)} onMouseLeave={() => setHoveredVariantId(null)} className={`bg-white rounded-[2rem] border transition-all p-5 shadow-sm border-slate-200 ${hoveredVariantId === v.id ? 'ring-2 ring-blue-500' : ''}`}>
                                            <div className="flex justify-between mb-4">
                                                <input value={v.name} onChange={e => setFormData(f => ({...f, variants: f.variants.map(x => x.id === v.id ? {...x, name: e.target.value} : x)}))} className="font-bold text-slate-700 bg-transparent outline-none flex-1 text-sm" placeholder="Nombre Variante..."/>
                                                <button onClick={() => setFormData(f => ({...f, variants: f.variants.filter(x => x.id !== v.id)}))} className="text-slate-300 hover:text-red-500"><Icon name="trash-2" size={16}/></button>
                                            </div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div className="space-y-3">
                                                    <div onDragOver={e => {e.preventDefault(); setActiveDragId(v.id)}} onDragLeave={() => setActiveDragId(null)} onDrop={e => {e.preventDefault(); setActiveDragId(null); processImage(v.id, e.dataTransfer.files[0])}} 
                                                         className={`relative aspect-video rounded-2xl border-2 border-dashed flex items-center justify-center transition-all overflow-hidden ${activeDragId === v.id ? 'bg-blue-50 border-blue-400' : 'bg-slate-50 border-slate-200 hover:bg-slate-100'}`}>
                                                        {v.image ? (
                                                            <div className="relative group w-full h-full">
                                                                <img src={v.image} className="w-full h-full object-contain p-2"/>
                                                                <label className="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 flex flex-col items-center justify-center transition-opacity cursor-pointer text-white">
                                                                    <Icon name="upload" size={18} className="mb-1"/><span className="font-bold text-[10px] uppercase tracking-widest">Cambiar</span>
                                                                    <input type="file" className="hidden" accept="image/*" onChange={e => processImage(v.id, e.target.files[0])}/>
                                                                </label>
                                                            </div>
                                                        ) : (
                                                            <label className="flex flex-col items-center cursor-pointer p-4 w-full h-full justify-center text-slate-400">
                                                                <Icon name="clipboard-paste" size={24} className="mb-2"/><span className="text-[9px] uppercase font-bold text-center italic tracking-wider">Ctrl+V o Arrastrar</span>
                                                                <input type="file" className="hidden" onChange={e => processImage(v.id, e.target.files[0])}/>
                                                            </label>
                                                        )}
                                                    </div>
                                                    <textarea value={v.description} onChange={e => setFormData(f => ({...f, variants: f.variants.map(x => x.id === v.id ? {...x, description: e.target.value} : x)}))} className="w-full bg-slate-50 rounded-xl p-2.5 text-[11px] text-slate-500 min-h-[50px] outline-none italic border border-transparent focus:border-slate-200" placeholder="Comentarios..."/>
                                                </div>
                                                <div className="space-y-3">
                                                    <div className="flex justify-between items-center text-[9px] font-black text-slate-400 uppercase tracking-tight"><span>Atributos</span><button onClick={() => setFormData(f => ({...f, variants: f.variants.map(x => x.id === v.id ? {...x, selectedProperties: [...x.selectedProperties, {parameterId: '', value: ''}]} : x)}))} className="text-blue-500 bg-blue-50 p-1 rounded-md hover:bg-blue-100 transition-all"><Icon name="plus" size={14}/></button></div>
                                                    <div className="space-y-2 max-h-[140px] overflow-y-auto pr-1 custom-scrollbar">
                                                        {v.selectedProperties.map((sp, idx) => (
                                                            <div key={idx} className="flex gap-1.5 items-center bg-slate-50 p-1.5 rounded-xl border border-transparent shadow-sm">
                                                                <select value={sp.parameterId} onChange={e => setFormData(f => ({...f, variants: f.variants.map(x => x.id === v.id ? {...x, selectedProperties: x.selectedProperties.map((s, i) => i === idx ? {...s, parameterId: e.target.value} : s)} : x)}))} className="flex-1 p-1 bg-white rounded-lg text-[9px] font-bold outline-none border-none">
                                                                    <option value="">Param...</option>
                                                                    {formData.globalParameters.map(gp => <option key={gp.id} value={gp.id}>{gp.name || '(Sin nombre)'}</option>)}
                                                                </select>
                                                                <input value={sp.value} onChange={e => setFormData(f => ({...f, variants: f.variants.map(x => x.id === v.id ? {...x, selectedProperties: x.selectedProperties.map((s, i) => i === idx ? {...s, value: e.target.value} : s)} : x)}))} placeholder="Valor" className="flex-1 p-1 bg-white rounded-lg text-[9px] outline-none font-mono"/>
                                                                <button onClick={() => setFormData(f => ({...f, variants: f.variants.map(x => x.id === v.id ? {...x, selectedProperties: x.selectedProperties.filter((_, i) => i !== idx)} : x)}))} className="text-slate-300 hover:text-red-500 transition-colors"><Icon name="trash-2" size={12}/></button>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {/* Git */}
                                <div className="bg-slate-900 p-6 rounded-[2.5rem] shadow-xl border border-white/5 mb-10 text-white">
                                    <div className="flex justify-between items-center mb-4 text-blue-400 font-bold uppercase text-[10px] tracking-widest">
                                        <div className="flex items-center gap-2"><Icon name="history" size={16}/><span>Trazabilidad Git</span></div>
                                        <button onClick={() => setFormData(f => ({...f, historyCommits: [...f.historyCommits, {id: Date.now().toString(), title: '', hash: ''}]}))} className="px-3 py-1.5 bg-white/10 hover:bg-white/20 rounded-xl transition-all font-black text-[10px]">+ COMMIT</button>
                                    </div>
                                    <div className="space-y-3">
                                        {formData.historyCommits.map(c => (
                                            <div key={c.id} className="flex gap-3 bg-white/5 p-3 rounded-2xl border border-white/5 group transition-all hover:bg-white/10">
                                                <input value={c.title} onChange={e => setFormData(f => ({...f, historyCommits: f.historyCommits.map(x => x.id === c.id ? {...x, title: e.target.value} : x)}))} className="flex-1 bg-white/5 rounded-xl p-2 text-xs text-white outline-none border-none focus:ring-1 focus:ring-blue-500/50" placeholder="Mensaje..."/>
                                                <input value={c.hash} onChange={e => setFormData(f => ({...f, historyCommits: f.historyCommits.map(x => x.id === c.id ? {...x, hash: e.target.value} : x)}))} className="w-24 bg-white/5 rounded-xl p-2 text-xs font-mono text-blue-300 outline-none border-none uppercase tracking-tighter" placeholder="Hash"/>
                                                <button onClick={() => setFormData(f => ({...f, historyCommits: f.historyCommits.filter(x => x.id !== c.id)}))} className="text-slate-600 hover:text-red-400 p-1"><Icon name="trash-2" size={16}/></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* LIVE PREVIEW (CENTRADAS COMO HOJAS PURAS) */}
                    <div className={`p-4 md:p-8 bg-slate-200 overflow-y-auto h-screen custom-scrollbar flex justify-center transition-all duration-300 ${showEditor ? 'w-full lg:w-1/2' : 'w-full'}`}>
                        <div className="preview-paper p-[15mm] text-slate-800 flex flex-col gap-8 shadow-2xl h-fit">
                            <header className="border-b-2 border-blue-500 pb-6 relative">
                                <div className="flex justify-between items-start">
                                    <div className="space-y-1">
                                        <h1 className="text-3xl font-black text-blue-600 uppercase tracking-tight">{formData.name || 'Componente Ionic'}</h1>
                                        {formData.subtitle && <p className="text-lg font-medium text-slate-500 mono lowercase italic leading-tight">{formData.subtitle}</p>}
                                    </div>
                                    <span className="px-4 py-1 bg-slate-800 text-white text-[10px] font-bold rounded-full uppercase tracking-widest shadow-lg">{formData.status}</span>
                                </div>
                            </header>

                            <section className="break-words">
                                <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2"><Icon name="file-text" size={12}/> Descripción</h3>
                                <p className="text-sm text-slate-600 border-l-4 border-slate-200 pl-4 py-2 italic bg-slate-50 rounded-r-lg shadow-inner leading-relaxed overflow-hidden">
                                    {formData.description || 'Sin descripción...'}
                                </p>
                            </section>

                            <section className="overflow-hidden">
                                <h3 className="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-3 flex items-center gap-2"><Icon name="settings" size={12}/> API: Parámetros</h3>
                                <div className="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
                                    <table className="w-full text-left text-xs table-fixed border-collapse">
                                        <thead className="bg-blue-600 text-white uppercase text-[9px] font-bold tracking-wider">
                                            <tr><th className="p-3 w-1/4">Nombre</th><th className="p-3 w-1/4">Tipo</th><th className="p-3 w-1/2">Descripción</th></tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {formData.globalParameters.map(p => (
                                                <tr key={p.id}>
                                                    <td className="p-3 font-bold text-blue-700 truncate">{p.name || '-'}</td>
                                                    <td className="p-3"><code className="bg-blue-50 px-2 py-0.5 rounded text-blue-600 font-bold mono lowercase text-[10px]">{p.type || 'any'}</code></td>
                                                    <td className="p-3 text-slate-500 italic break-words">{p.description || '-'}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </section>

                            {formData.methods.length > 0 && (
                                <section className="overflow-hidden">
                                    <h3 className="text-[10px] font-black text-amber-600 uppercase tracking-widest mb-3 flex items-center gap-2"><Icon name="zap" size={12}/> Lógica Interna</h3>
                                    <div className="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
                                        <table className="w-full text-left text-xs table-fixed border-collapse">
                                            <thead className="bg-amber-500 text-white uppercase text-[9px] font-bold">
                                                <tr><th className="p-3">Método</th><th className="p-3">Firma</th><th className="p-3">Descripción</th></tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 italic font-medium">
                                                {formData.methods.map(m => (
                                                    <tr key={m.id}><td className="p-3 font-bold text-amber-700 mono">{m.name || '-'}</td><td className="p-3 text-slate-400 mono text-[9px] uppercase">{m.details || 'void'}</td><td className="p-3 text-slate-500 break-words">{m.description || '-'}</td></tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </section>
                            )}

                            <section className="space-y-12">
                                <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-widest border-b pb-2 flex items-center gap-2"><Icon name="image" size={12}/> Variantes</h3>
                                {formData.variants.map((v, idx) => (
                                    <div key={v.id} className="space-y-4">
                                        <div className="flex items-center border-l-4 border-slate-800 pl-4 bg-slate-50 p-2.5 rounded-r-xl shadow-sm italic font-bold">
                                            <h4 className="font-black text-lg text-slate-800 uppercase tracking-tighter italic">{idx + 1}. {v.name || 'Variante'}</h4>
                                        </div>
                                        {v.description && <p className="text-xs text-slate-500 italic px-4 leading-relaxed break-words">{v.description}</p>}
                                        <div className="flex flex-col md:flex-row gap-6 items-start">
                                            {/* IMAGEN IZQUIERDA */}
                                            <div className="w-full md:w-1/2 bg-slate-50 rounded-2xl overflow-hidden shadow-inner border border-slate-100 flex items-center justify-center min-h-[120px]">
                                                {v.image ? <img src={v.image} className="w-full h-auto object-contain" alt="Variante"/> : <div className="text-[10px] font-black uppercase text-slate-300 italic py-10 text-center">Sin Captura</div>}
                                            </div>
                                            {/* TABLA DERECHA */}
                                            <div className="w-full md:w-1/2 overflow-hidden rounded-xl border border-slate-200 shadow-sm bg-white">
                                                <table className="w-full text-left text-[10px] table-fixed border-collapse">
                                                    <thead className="bg-slate-700 text-white uppercase text-[8px] font-bold tracking-widest">
                                                        <tr><th className="p-2.5">Atributo</th><th className="p-2.5">Valor</th></tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-100 italic">
                                                        {v.selectedProperties.map((sp, i) => {
                                                            const p = formData.globalParameters.find(gp => gp.id === sp.parameterId);
                                                            return <tr key={i}><td className="p-2.5 font-bold text-slate-500 truncate">{p ? p.name : '-'}</td><td className="p-2.5 text-slate-900 font-bold mono text-[9px] bg-slate-50/30 break-all">{sp.value || '-'}</td></tr>
                                                        })}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </section>

                            {formData.historyCommits.length > 0 && (
                                <section className="mt-auto pt-10 border-t-2 border-slate-100">
                                    <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2"><Icon name="history" size={12}/> Trazabilidad GIT</h3>
                                    <div className="overflow-hidden rounded-xl border border-slate-200 shadow-xl bg-slate-900 text-white">
                                        <table className="w-full text-left text-[10px] table-fixed border-collapse">
                                            <thead className="bg-slate-800 text-slate-500 uppercase text-[8px] font-black tracking-widest border-b border-white/5">
                                                <tr><th className="p-4 border-r border-white/5 w-2/3">Mensaje</th><th className="p-4 w-1/3">Hash</th></tr>
                                            </thead>
                                            <tbody className="divide-y divide-white/5 italic">
                                                {formData.historyCommits.map(c => (
                                                    <tr key={c.id} className="hover:bg-white/5">
                                                        <td className="p-4 text-slate-200 border-r border-white/5 break-words">{c.title || '-'}</td>
                                                        <td className="p-4 mono text-blue-400 uppercase font-black tracking-tighter truncate">{c.hash || 'N/A'}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </section>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
