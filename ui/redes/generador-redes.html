<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloc Notas Standalone</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y Babel para la lógica -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Fira+Code:wght@400;500&display=swap');
        
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'Fira Code', monospace; }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        
        @media print {
            .no-print { display: none !important; }
            .print-area { display: block !important; width: 100% !important; background: white !important; color: black !important; padding: 0 !important; }
            pre { border: 1px solid #000; padding: 20px; white-space: pre-wrap; word-wrap: break-word; color: black !important; }
            .bg-slate-950, .bg-black { background: white !important; }
        }

        input, select, textarea { transition: all 0.2s ease; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Componentes de Iconos ---
        const IconNetwork = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="9" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="16" y="16" width="6" height="6" rx="1"/><path d="M12 8v4"/><path d="M12 12H5v4"/><path d="M12 12h7v4"/></svg>
        );
        const IconRouter = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="2" y="14" width="20" height="8" rx="2"/><circle cx="6" cy="18" r="1"/><circle cx="10" cy="18" r="1"/><path d="M2 10a8.5 8.5 0 0 1 20 0"/><path d="M5 7a13.5 13.5 0 0 1 14 0"/></svg>
        );
        const IconSwitch = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/></svg>
        );
        const IconPC = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        );
        const IconTrash = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        );
        const IconFile = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
        );
        const IconUpload = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        );
        const IconRefresh = ({ size = 16, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
        );
        const IconAlert = ({ size = 16, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        );
        const IconShield = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        );
        const IconServer = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
        );
        const IconMenu = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        );
        const IconTerminal = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
        );
        const IconX = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        );

        const App = () => {
            const [nodes, setNodes] = useState([]);
            const [selectedNodeId, setSelectedNodeId] = useState(null);
            
            // Estados para control de paneles responsivos
            const [showCli, setShowCli] = useState(window.innerWidth >= 1024);
            const [showSidebar, setShowSidebar] = useState(false);

            useEffect(() => {
                const handleResize = () => {
                    if (window.innerWidth >= 1024) {
                        setShowSidebar(false);
                    }
                };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const generateId = () => Math.random().toString(36).substr(2, 9);

            // --- Helpers de Red ---
            const calculateWildcard = (mask) => {
                if (!mask) return "0.0.0.255";
                return mask.split('.').map(octet => 255 - parseInt(octet)).join('.');
            };

            const getNetworkAddress = (ip, mask) => {
                if (!ip || !mask) return "";
                const ipOctets = ip.split('.');
                const maskOctets = mask.split('.');
                return ipOctets.map((octet, i) => parseInt(octet) & parseInt(maskOctets[i])).join('.');
            };

            const getRouterNetworks = (router) => {
                if (!router) return [];
                const nets = [];
                router.properties.interfaces.forEach(i => {
                    if (i.ip && i.mask && i.showInCli !== false) nets.push({ 
                        ip: i.ip, 
                        mask: i.mask, 
                        network: getNetworkAddress(i.ip, i.mask),
                        wildcard: calculateWildcard(i.mask),
                        label: `${i.name} (Física)`,
                        connectedTo: i.connectedTo 
                    });
                });
                router.properties.subinterfaces.forEach(s => {
                    const base = router.properties.interfaces.find(i => i.name === s.baseInterface);
                    if (base && base.showInCli === false) return; 
                    
                    if (s.ip && s.mask) nets.push({ 
                        ip: s.ip, 
                        mask: s.mask, 
                        network: getNetworkAddress(s.ip, s.mask),
                        wildcard: calculateWildcard(s.mask),
                        label: `${s.baseInterface}.${s.vlan} (Subinterfaz)`,
                        connectedTo: base ? base.connectedTo : null 
                    });
                });
                return nets;
            };

            // --- Lógica de Plantillas ---
            const loadTemplate = (type) => {
                let templateNodes = [];
                if (type === 'subinterfaces') {
                    const r0Id = generateId();
                    const swId = generateId();
                    templateNodes = [
                        {
                            id: r0Id,
                            type: 'router',
                            name: 'R0_Subint',
                            properties: {
                                interfaces: [{ id: generateId(), name: 'G0/0', ip: '192.168.10.1', mask: '255.255.255.0', connectedTo: swId }],
                                subinterfaces: [
                                    { id: generateId(), vlan: '100', ip: '192.168.50.1', mask: '255.255.255.0', baseInterface: 'G0/0' },
                                    { id: generateId(), vlan: '200', ip: '192.168.60.1', mask: '255.255.255.0', baseInterface: 'G0/0' }
                                ],
                                protocol: 'none', protocolData: { staticRoutes: [], eigrpAsn: '100', eigrpNetworks: [], ospfProcessId: '1', ospfArea: '0', ospfNetworks: [], ripNetworks: [], ripVersion: '2', bgpAsn: '100', bgpNeighbors: [], bgpNetworks: [] },
                                translators: [],
                                dhcp: { pools: [], excludedAddresses: [] }
                            }
                        },
                        {
                            id: swId,
                            type: 'switch',
                            name: 'SW_Core',
                            properties: {
                                interfaces: [{ id: generateId(), name: 'G0/1', ip: '', mask: '', connectedTo: r0Id }],
                                vlans: [
                                    { id: '100', name: 'admin', portPrefix: 'Fa0/', startPort: '1', endPort: '10', isNative: true },
                                    { id: '200', name: 'mercadeo', portPrefix: 'Fa0/', startPort: '11', endPort: '20', isNative: false }
                                ],
                                trunks: [{ id: generateId(), interface: 'G0/1', nativeVlan: '100', allowedVlans: '100,200,900' }],
                                nativeVlan: '100',
                                dhcp: { pools: [], excludedAddresses: [] }
                            }
                        }
                    ];
                } else if (type === 'static_rip') {
                    const r1Id = generateId();
                    const r2Id = generateId();
                    templateNodes = [
                        {
                            id: r1Id,
                            type: 'router',
                            name: 'Router_A',
                            properties: {
                                interfaces: [
                                    { id: generateId(), name: 'G0/0', ip: '50.1.15.1', mask: '255.255.255.0', connectedTo: r2Id },
                                    { id: generateId(), name: 'G0/1', ip: '192.168.10.1', mask: '255.255.255.0', connectedTo: null }
                                ],
                                subinterfaces: [],
                                protocol: 'rip',
                                protocolData: { networks: '', staticRoutes: [], eigrpAsn: '1', eigrpNetworks: [], ospfProcessId: '1', ospfArea: '0', ospfNetworks: [], ripVersion: '2', ripNetworks: [{network: '50.1.15.0', label: 'G0/0 (Física)'}, {network: '192.168.10.0', label: 'G0/1 (Física)'}], bgpAsn: '100', bgpNeighbors: [], bgpNetworks: [] },
                                translators: [],
                                dhcp: { pools: [], excludedAddresses: [] }
                            }
                        },
                        {
                            id: r2Id,
                            type: 'router',
                            name: 'Router_B',
                            properties: {
                                interfaces: [
                                    { id: generateId(), name: 'G0/0', ip: '50.1.15.2', mask: '255.255.255.0', connectedTo: r1Id },
                                    { id: generateId(), name: 'G0/1', ip: '192.168.20.1', mask: '255.255.255.0', connectedTo: null }
                                ],
                                subinterfaces: [],
                                protocol: 'rip',
                                protocolData: { networks: '', staticRoutes: [], eigrpAsn: '1', eigrpNetworks: [], ospfProcessId: '1', ospfArea: '0', ospfNetworks: [], ripVersion: '2', ripNetworks: [{network: '50.1.15.0', label: 'G0/0 (Física)'}, {network: '192.168.20.0', label: 'G0/1 (Física)'}], bgpAsn: '200', bgpNeighbors: [], bgpNetworks: [] },
                                translators: [],
                                dhcp: { pools: [], excludedAddresses: [] }
                            }
                        }
                    ];
                }
                setNodes(templateNodes);
                setSelectedNodeId(templateNodes[0]?.id || null);
                setShowSidebar(false);
            };

            const addNode = (type) => {
                const defaultInt = type === 'router' ? 'G0/0' : (type === 'switch' ? 'G0/1' : 'Fa0/1');
                const newNode = {
                    id: generateId(),
                    type,
                    name: `${type.toUpperCase()}_${nodes.length + 1}`,
                    properties: {
                        gateway: '',
                        interfaces: [
                            { id: generateId(), name: defaultInt, ip: '', mask: '255.255.255.0', connectedTo: null }
                        ],
                        vlans: [], 
                        trunks: [], 
                        nativeVlan: '',
                        protocol: 'none',
                        protocolData: { networks: '', routes: '', processId: '1', area: '0', asn: '1', staticRoutes: [], eigrpAsn: '1', eigrpNetworks: [], ospfProcessId: '1', ospfArea: '0', ospfNetworks: [], ripVersion: '2', ripNetworks: [], bgpAsn: '100', bgpNeighbors: [], bgpNetworks: [] },
                        translators: [], 
                        subinterfaces: [],
                        dhcp: { pools: [], excludedAddresses: [] },
                        security: { enabled: false, enableSecret: '', consolePassword: '', vtyPassword: '', vtyLines: '0 2', adminVlan: { enabled: false, id: '900', ip: '', mask: '255.255.255.0' } }
                    }
                };
                setNodes([...nodes, newNode]);
                setSelectedNodeId(newNode.id);
                setShowSidebar(false);
            };

            const deleteNode = (id) => {
                setNodes(nodes.filter(n => n.id !== id));
                if (selectedNodeId === id) setSelectedNodeId(null);
            };

            const updateNode = (id, updates) => {
                setNodes(nodes.map(n => n.id === id ? { ...n, ...updates } : n));
            };

            const selectedNode = nodes.find(n => n.id === selectedNodeId);

            // --- Lógica de Generación de Comandos Cisco ---
            const generateConfig = (node) => {
                if (!node) return "";
                let config = `! --- Configuración para ${node.name} ---\n`;
                config += `hostname ${node.name}\n`;
                
                if (node.type === 'pc') {
                    const primary = node.properties.interfaces[0];
                    config += `! Configuración en terminal de PC:\n`;
                    config += `ip address ${primary?.ip || 'DHCP'} ${primary?.mask || '255.255.255.0'}\n`;
                    config += `ip default-gateway ${node.properties.gateway || '0.0.0.0'}\n`;
                    return config;
                }

                config += `enable\nconf t\n`;
                
                const sec = node.properties.security;
                if (sec && sec.enabled) {
                    config += `! --- Seguridad ---\n`;
                    if (sec.enableSecret) config += `enable secret ${sec.enableSecret}\n`;
                    config += `line console 0\n`;
                    if (sec.consolePassword) config += ` password ${sec.consolePassword}\n`;
                    config += ` login\nexit\n`;
                    config += `line vty ${sec.vtyLines || '0 2'}\n`;
                    if (sec.vtyPassword) config += ` password ${sec.vtyPassword}\n`;
                    config += ` login\nexit\n`;
                    
                    if (node.type === 'switch' && sec.adminVlan && sec.adminVlan.enabled) {
                        config += `interface Vlan${sec.adminVlan.id || '900'}\n ip address ${sec.adminVlan.ip || '192.168.70.2'} ${sec.adminVlan.mask || '255.255.255.0'}\n no shutdown\nexit\n`;
                    }
                }

                if (node.type === 'switch') {
                    // Creación de VLANs definidas por el usuario
                    if (node.properties.vlans) {
                        node.properties.vlans.forEach(v => {
                            if (v.id) config += `vlan ${v.id}\n name ${v.name || 'VLAN'+v.id}\nexit\n`;
                        });
                    }

                    // Creación de VLANs Nativas SOLO si el usuario no las declaró arriba explícitamente
                    const definedVlans = new Set((node.properties.vlans || []).map(v => String(v.id)).filter(Boolean));
                    const nativeVlansToCreate = new Set();
                    
                    if (node.properties.nativeVlan && !definedVlans.has(String(node.properties.nativeVlan))) {
                        nativeVlansToCreate.add(node.properties.nativeVlan);
                    }
                    if (node.properties.trunks) {
                        node.properties.trunks.forEach(t => { 
                            if(t.nativeVlan && !definedVlans.has(String(t.nativeVlan))) nativeVlansToCreate.add(t.nativeVlan); 
                        });
                    }
                    
                    nativeVlansToCreate.forEach(vid => {
                        config += `vlan ${vid}\n name NATIVA\nexit\n`;
                    });

                    // Puertos de Acceso (VLANs)
                    if (node.properties.vlans) {
                        node.properties.vlans.forEach(v => {
                            let interfaceCmd = "";
                            if (v.portPrefix || v.startPort) {
                                if (v.endPort && v.endPort !== v.startPort) {
                                    interfaceCmd = `interface range ${v.portPrefix || 'Fa0/'}${v.startPort}-${v.endPort}`;
                                } else if (v.startPort) {
                                    interfaceCmd = `interface ${v.portPrefix || 'Fa0/'}${v.startPort}`;
                                }
                            } else if (v.range) {
                                interfaceCmd = `interface range ${v.range}`;
                            }

                            if (interfaceCmd && v.id) {
                                config += `${interfaceCmd}\n`;
                                config += ` switchport mode access\n`;
                                config += ` switchport access vlan ${v.id}\nexit\n`;
                            }
                        });
                    }

                    // Puertos Troncales Explícitos
                    if (node.properties.trunks && node.properties.trunks.length > 0) {
                        node.properties.trunks.forEach(t => {
                            if (t.interface) {
                                config += `interface ${t.interface}\n`;
                                config += ` switchport mode trunk\n`;
                                if (t.nativeVlan) config += ` switchport trunk native vlan ${t.nativeVlan}\n`;
                                if (t.allowedVlans) config += ` switchport trunk allowed vlan ${t.allowedVlans}\n`;
                                config += `exit\n`;
                            }
                        });
                    }

                    // Configuración de Interfaces Restantes
                    node.properties.interfaces.forEach(int => {
                        if (int.showInCli === false) return;
                        
                        const targetNode = nodes.find(n => n.id === int.connectedTo);
                        const isExplicitTrunk = node.properties.trunks && node.properties.trunks.find(t => t.interface === int.name);

                        if (!isExplicitTrunk && targetNode && targetNode.type === 'router') {
                            config += `interface ${int.name}\n`;
                            config += ` switchport mode trunk\n`;
                            if (node.properties.nativeVlan) config += ` switchport trunk native vlan ${node.properties.nativeVlan}\n`;
                            const allowed = (node.properties.vlans || []).map(v => v.id).filter(Boolean);
                            if (node.properties.nativeVlan) allowed.push(node.properties.nativeVlan);
                            if (allowed.length > 0) config += ` switchport trunk allowed vlan ${allowed.join(',')}\n`;
                            config += `exit\n`;
                        } else if (int.ip) {
                            config += `interface ${int.name}\n`;
                            config += ` ip address ${int.ip} ${int.mask}\nno shut\nexit\n`;
                        }
                    });
                }

                if (node.type === 'router') {
                    // Interfaces Base y Subinterfaces
                    node.properties.interfaces.forEach(int => {
                        if (int.showInCli === false) return;
                        
                        const subs = node.properties.subinterfaces.filter(s => s.baseInterface === int.name);
                        if (subs.length > 0) {
                            config += `interface ${int.name}\n no shutdown\nexit\n`;
                            subs.forEach(sub => {
                                config += `interface ${int.name}.${sub.vlan}\n`;
                                config += ` encapsulation dot1Q ${sub.vlan}\n`;
                                config += ` ip address ${sub.ip} ${sub.mask}\n`;
                                config += ` no shutdown\nexit\n`;
                            });
                        } else if (int.ip) {
                            config += `interface ${int.name}\n`;
                            config += ` ip address ${int.ip} ${int.mask}\nno shutdown\nexit\n`;
                        }
                    });

                    // 1. Protocolo Base (Configuración Simple)
                    const p = node.properties.protocol;
                    const pd = node.properties.protocolData;

                    if (p === 'static' && pd.staticRoutes) {
                        pd.staticRoutes.forEach(r => {
                            config += `ip route ${r.network} ${r.mask} ${r.nextHop}\n`;
                        });
                    } else if (p === 'eigrp') {
                        config += `router eigrp ${pd.eigrpAsn || '1'}\n`;
                        if (pd.eigrpNetworks) pd.eigrpNetworks.forEach(n => config += ` network ${n.network} ${n.wildcard}\n`);
                        config += ` no auto-summary\nexit\n`;
                    } else if (p === 'ospf') {
                        config += `router ospf ${pd.ospfProcessId || '1'}\n`;
                        if (pd.ospfNetworks) pd.ospfNetworks.forEach(n => config += ` network ${n.network} ${n.wildcard} area ${n.area || '0'}\n`);
                        config += `exit\n`;
                    } else if (p === 'rip') {
                        config += `router rip\n version ${pd.ripVersion || '2'}\n`;
                        if (pd.ripNetworks && pd.ripNetworks.length > 0) {
                            pd.ripNetworks.forEach(n => config += ` network ${n.network}\n`);
                        } else if (pd.networks) {
                            pd.networks.split(',').forEach(n => { if(n.trim()) config += ` network ${n.trim()}\n`; });
                        }
                        config += ` no auto-summary\nexit\n`;
                    } else if (p === 'bgp') {
                        config += `router bgp ${pd.bgpAsn || '100'}\n`;
                        if (pd.bgpNeighbors) pd.bgpNeighbors.forEach(n => config += ` neighbor ${n.ip} remote-as ${n.remoteAs}\n`);
                        if (pd.bgpNetworks) pd.bgpNetworks.forEach(n => config += ` network ${n.network} mask ${n.mask}\n`);
                        config += `exit\n`;
                    }

                    // 2. Módulo Traductor de Protocolos (Multi-Protocolo con Redistribución)
                    if (node.properties.translators && node.properties.translators.length > 0) {
                        config += `\n! --- Traductor de Protocolos (Redistribución Avanzada) ---\n`;
                        const allNets = getRouterNetworks(node);
                        
                        node.properties.translators.forEach(t => {
                            if (t.protocol === 'rip') {
                                config += `router rip\n version 2\n`;
                                (t.networks || []).forEach(netAddr => config += ` network ${netAddr}\n`);
                                (t.redistributions || []).forEach(r => {
                                    config += ` redistribute ${r.source}`;
                                    if (['ospf', 'eigrp', 'bgp'].includes(r.source) && r.sourceId) config += ` ${r.sourceId}`;
                                    if (r.metric) config += ` metric ${r.metric}`;
                                    config += `\n`;
                                });
                                config += ` no auto-summary\nexit\n`;
                                
                            } else if (t.protocol === 'ospf') {
                                config += `router ospf ${t.processId || '1'}\n`;
                                (t.networks || []).forEach(netAddr => {
                                    const netObj = allNets.find(n => n.network === netAddr);
                                    const wc = netObj ? netObj.wildcard : '0.0.0.255';
                                    config += ` network ${netAddr} ${wc} area 0\n`;
                                });
                                (t.redistributions || []).forEach(r => {
                                    config += ` redistribute ${r.source}`;
                                    if (['ospf', 'eigrp', 'bgp'].includes(r.source) && r.sourceId) config += ` ${r.sourceId}`;
                                    if (r.subnets) config += ` subnets`;
                                    if (r.metric) config += ` metric ${r.metric}`;
                                    config += `\n`;
                                });
                                config += `exit\n`;
                                
                            } else if (t.protocol === 'eigrp') {
                                config += `router eigrp ${t.processId || '1'}\n`;
                                (t.networks || []).forEach(netAddr => {
                                    const netObj = allNets.find(n => n.network === netAddr);
                                    const wc = netObj ? netObj.wildcard : '0.0.0.255';
                                    config += ` network ${netAddr} ${wc}\n`;
                                });
                                (t.redistributions || []).forEach(r => {
                                    config += ` redistribute ${r.source}`;
                                    if (['ospf', 'eigrp', 'bgp'].includes(r.source) && r.sourceId) config += ` ${r.sourceId}`;
                                    if (r.metric) config += ` metric ${r.metric}`;
                                    config += `\n`;
                                });
                                config += ` no auto-summary\nexit\n`;
                            }
                        });
                    }
                }

                if (node.properties.dhcp && (node.type === 'router' || node.type === 'switch')) {

                                config += `ip dhcp excluded-address ${ex.startIp}`;
                                if (ex.endIp) config += ` ${ex.endIp}`;
                                config += `\n`;
                            }
                        });
                    }
                    
                    if (node.properties.dhcp.pools && node.properties.dhcp.pools.length > 0) {
                        config += `\n! --- DHCP Pools ---\n`;
                        node.properties.dhcp.pools.forEach(pool => {
                            if (pool.name) {
                                config += `ip dhcp pool ${pool.name}\n`;
                                if (pool.networkIp) config += ` network ${pool.networkIp} ${pool.mask || '255.255.255.0'}\n`;
                                if (pool.defaultRouter) config += ` default-router ${pool.defaultRouter}\n`;
                                if (pool.dnsServer) config += ` dns-server ${pool.dnsServer}\n`;
                                config += `exit\n`;
                            }
                        });
                    }
                }

                config += `end\nwrite\n`;
                return config;

                                                                                    const updatedR = t.redistributions.filter((_, i) => i !== rIdx);
                                                                                    const n = [...selectedNode.properties.translators]; n[tIdx].redistributions = updatedR;
                                                                                    updateNode(selectedNode.id, { properties: { ...selectedNode.properties, translators: n } });
                                                                                }} className="text-slate-600 hover:text-red-500 shrink-0 ml-4"><IconTrash size={16} className="lg:w-[12px] lg:h-[12px]"/></button>
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                </div>

                                                            </div>
                                                        );
                                                    })}
                                                    
                                                    {(!selectedNode.properties.translators || selectedNode.properties.translators.length === 0) && (
                                                        <p className="text-xs text-slate-500 italic text-center">No hay procesos configurados.</p>
                                                    )}
                                                </div>
                                            </section>
                                        )}

                                        {/* Seguridad */}
                                        {(selectedNode.type === 'router' || selectedNode.type === 'switch') && (
                                            <section className="bg-slate-900/30 p-4 lg:p-6 rounded-3xl border border-slate-800 shadow-xl shadow-emerald-950/5">
                                                <div className="flex justify-between items-center mb-6">
                                                    <h3 className="text-[10px] font-black text-emerald-500 uppercase tracking-widest flex items-center gap-2">
                                                        <IconShield size={16} className="text-emerald-500" />
                                                        Seguridad y Administración
                                                    </h3>
                                                    <div className="flex items-center gap-2">
                                                        <span className="text-[9px] font-bold text-slate-500 uppercase">Activar</span>
                                                        <button 
                                                            onClick={() => {
                                                                const sec = selectedNode.properties.security || { enabled: false, enableSecret: '', consolePassword: '', vtyPassword: '', vtyLines: '0 2', adminVlan: { enabled: false, id: '900', ip: '', mask: '255.255.255.0' } };
                                                                updateNode(selectedNode.id, { properties: { ...selectedNode.properties, security: { ...sec, enabled: !sec.enabled } }});
                                                            }}
                                                            className={`w-10 h-5 rounded-full relative transition-colors ${selectedNode.properties.security?.enabled ? 'bg-emerald-500' : 'bg-slate-700'}`}
                                                        >
                                                            <div className={`w-3.5 h-3.5 bg-white rounded-full absolute top-0.5 transition-all ${selectedNode.properties.security?.enabled ? 'left-5' : 'left-1'}`}></div>
                                                        </button>
                                                    </div>
                                                </div>

                                                {selectedNode.properties.security?.enabled && (
                                                    <div className="space-y-4 animate-in fade-in duration-300">
                                                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 bg-slate-950 p-4 lg:p-5 rounded-2xl border border-slate-900">
                                                            <div>
                                                                <label className="text-[8px] font-bold text-slate-500 block mb-1 uppercase tracking-widest">Enable Secret (Privilegiado)</label>
                                                                <input 
                                                                    type="text" 
                                                                    placeholder="Ej: Cisco30"
                                                                    value={selectedNode.properties.security.enableSecret || ''} 
                                                                    onChange={(e) => updateNode(selectedNode.id, { properties: { ...selectedNode.properties, security: {...selectedNode.properties.security, enableSecret: e.target.value} } })}
                                                                    className="w-full bg-slate-900 border-none rounded p-2 text-xs font-mono outline-none focus:ring-1 focus:ring-emerald-500"
                                                                />
                                                            </div>
                                                            <div>
                                                                <label className="text-[8px] font-bold text-slate-500 block mb-1 uppercase tracking-widest">Console Password (Usuario)</label>
                                                                <input 
                                                                    type="text" 
                                                                    placeholder="Ej: User30"
                                                                    value={selectedNode.properties.security.consolePassword || ''} 
                                                                    onChange={(e) => updateNode(selectedNode.id, { properties: { ...selectedNode.properties, security: {...selectedNode.properties.security, consolePassword: e.target.value} } })}
                                                                    className="w-full bg-slate-900 border-none rounded p-2 text-xs font-mono outline-none focus:ring-1 focus:ring-emerald-500"
                                                                />
                                                            </div>
                                                            <div>
                                                                <label className="text-[8px] font-bold text-slate-500 block mb-1 uppercase tracking-widest">VTY Password (Telnet/SSH)</label>
                                                                <div className="flex gap-2">
                                                                    <input 
                                                                        type="text" 
                                                                        placeholder="Rango (Ej: 0 2)"
                                                                        value={selectedNode.properties.security.vtyLines || ''} 
                                                                        onChange={(e) => updateNode(selectedNode.id, { properties: { ...selectedNode.properties, security: {...selectedNode.properties.security, vtyLines: e.target.value} } })}
                                                                        className="w-1/3 bg-slate-900 border-none rounded p-2 text-xs font-mono outline-none focus:ring-1 focus:ring-emerald-500 lg:text-center"
                                                                    />
                                                                    <input 
                                                                        type="text" 
                                                                        placeholder="Ej: Telnet30"
                                                                        value={selectedNode.properties.security.vtyPassword || ''} 
                                                                        onChange={(e) => updateNode(selectedNode.id, { properties: { ...selectedNode.properties, security: {...selectedNode.properties.security, vtyPassword: e.target.value} } })}
                                                                        className="w-2/3 bg-slate-900 border-none rounded p-2 text-xs font-mono outline-none focus:ring-1 focus:ring-emerald-500"
                                                                    />
                                                                </div>
                                                            </div>
                                                        </div>

                                                        {selectedNode.type === 'switch' && (
                                                            <div className="bg-slate-950 p-4 lg:p-5 rounded-2xl border border-slate-900">
                                                                <div className="flex flex-col lg:flex-row justify-between lg:items-center mb-4 gap-3">
                                                                    <label className="text-[10px] font-bold text-slate-400 block uppercase tracking-widest">IP de Administración (SVI / VLAN)</label>
                                                                    <div className="flex items-center gap-2">
                                                                        <span className="text-[8px] font-bold text-slate-600 uppercase">Habilitar SVI</span>
                                                                        <button 
                                                                            onClick={() => {
                                                                                const sec = selectedNode.properties.security;
                                                                                updateNode(selectedNode.id, { properties: { ...selectedNode.properties, security: { ...sec, adminVlan: { ...sec.adminVlan, enabled: !sec.adminVlan.enabled } } }});
                                                                            }}
                                                                            className={`w-8 h-4 rounded-full relative transition-colors ${selectedNode.properties.security?.adminVlan?.enabled ? 'bg-emerald-500' : 'bg-slate-700'}`}
                                                                        >
                                                                            <div className={`w-2.5 h-2.5 bg-white rounded-full absolute top-[3px] transition-all ${selectedNode.properties.security?.adminVlan?.enabled ? 'left-[18px]' : 'left-1'}`}></div>
                                                                        </button>
                                                                    </div>
                                                                </div>
                                                                
                                                                {selectedNode.properties.security?.adminVlan?.enabled && (
                                                                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-3 lg:items-end">
                                                                        <div className="col-span-1 lg:col-span-2">
                                                                            <label className="text-[8px] font-bold text-slate-600 block mb-1 uppercase tracking-tighter">VLAN ID</label>
                                                                            <input 
                                                                                type="text" 
                                                                                placeholder="Ej: 900"
                                                                                value={selectedNode.properties.security.adminVlan.id || ''} 
                                                                                onChange={(e) => updateNode(selectedNode.id, { properties: { ...selectedNode.properties, security: {...selectedNode.properties.security, adminVlan: {...selectedNode.properties.security.adminVlan, id: e.target.value}} } })}
                                                                                className="w-full bg-slate-900 border-none rounded p-2 text-xs font-mono outline-none focus:ring-1 focus:ring-emerald-500 lg:text-center"
                                                                            />
                                                                        </div>
                                                                        <div className="col-span-1 lg:col-span-5">
                                                                            <label className="text-[8px] font-bold text-slate-600 block mb-1 uppercase tracking-tighter">IP Address</label>
                                                                            <input 
                                                                                type="text" 
                                                                                placeholder="Ej: 192.168.70.2"
                                                                                value={selectedNode.properties.security.adminVlan.ip || ''} 
                                                                                onChange={(e) => updateNode(selectedNode.id, { properties: { ...selectedNode.properties, security: {...selectedNode.properties.security, adminVlan: {...selectedNode.properties.security.adminVlan, ip: e.target.value}} } })}
                                                                                className="w-full bg-slate-900 border-none rounded p-2 text-xs font-mono outline-none focus:ring-1 focus:ring-emerald-500"
                                                                            />
                                                                        </div>
                                                                        <div className="col-span-1 lg:col-span-5">
                                                                            <label className="text-[8px] font-bold text-slate-600 block mb-1 uppercase tracking-tighter">Subnet Mask</label>
                                                                            <input 
                                                                                type="text" 
                                                                                placeholder="Ej: 255.255.255.0"
                                                                                value={selectedNode.properties.security.adminVlan.mask || ''} 
                                                                                onChange={(e) => updateNode(selectedNode.id, { properties: { ...selectedNode.properties, security: {...selectedNode.properties.security, adminVlan: {...selectedNode.properties.security.adminVlan, mask: e.target.value}} } })}
                                                                                className="w-full bg-slate-900 border-none rounded p-2 text-xs font-mono outline-none focus:ring-1 focus:ring-emerald-500"
                                                                            />
                                                                        </div>
                                                                        <p className="col-span-1 lg:col-span-12 text-[9px] text-slate-500 italic mt-1">Nota: Asegúrese de que la VLAN {selectedNode.properties.security.adminVlan.id || '900'} esté añadida también en la lista general de VLANs del switch (arriba) para permitir su tráfico en el troncal.</p>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        )}
                                                    </div>
                                                )}
                                            </section>
                                        )}

                                        {/* Servidor DHCP */}
                                        {(selectedNode.type === 'router' || selectedNode.type === 'switch') && (
                                            <section className="bg-slate-900/30 p-4 lg:p-6 rounded-3xl border border-slate-800 shadow-xl shadow-yellow-950/5">
                                                <div className="flex flex-col lg:flex-row justify-between lg:items-center mb-6 gap-4">
                                                    <h3 className="text-[10px] font-black text-yellow-500 uppercase tracking-widest flex items-center gap-2">
                                                        <IconServer size={16} className="text-yellow-500" />
                                                        Servidor DHCP (IPv4)
                                                    </h3>
                                                    <div className="flex gap-2">
                                                        <button onClick={() => {
                                                            const dhcp = selectedNode.properties.dhcp || { pools: [], excludedAddresses: [] };
                                                            updateNode(selectedNode.id, { properties: { ...selectedNode.properties, dhcp: { ...dhcp, excludedAddresses: [...dhcp.excludedAddresses, { id: generateId(), startIp: '', endIp: '' }] } }});
                                                        }} className="no-print text-[9px] font-bold bg-slate-800 border border-slate-700 px-3 py-2 lg:py-1.5 rounded-xl lg:rounded-full uppercase hover:bg-slate-700 transition-all text-slate-300 w-full lg:w-auto text-center">+ Exclusión</button>

                                                        <button onClick={() => {
                                                            const dhcp = selectedNode.properties.dhcp || { pools: [], excludedAddresses: [] };
                                                            updateNode(selectedNode.id, { properties: { ...selectedNode.properties, dhcp: { ...dhcp, pools: [...dhcp.pools, { id: generateId(), name: '', networkIp: '', mask: '255.255.255.0', defaultRouter: '', dnsServer: '' }] } }});
                                                        }} className="no-print text-[9px] font-bold bg-yellow-600 px-3 py-2 lg:py-1.5 rounded-xl lg:rounded-full uppercase hover:scale-105 active:scale-95 transition-all text-white shadow-[0_0_10px_rgba(202,138,4,0.3)] w-full lg:w-auto text-center">+ Añadir Pool</button>
                                                    </div>
                                                </div>

                                                <div className="space-y-6">
                                                    {/* Lista de Exclusiones */}
                                                    {selectedNode.properties.dhcp?.excludedAddresses?.length > 0 && (
                                                        <div className="bg-slate-950 p-4 rounded-2xl border border-slate-900">
                                                            <label className="text-[9px] font-black text-slate-400 block mb-3 uppercase tracking-widest">Direcciones Excluidas</label>
                                                            <div className="space-y-2">
                                                                {selectedNode.properties.dhcp.excludedAddresses.map((ex, idx) => (
                                                                    <div key={ex.id} className="flex flex-col lg:flex-row gap-3 lg:items-center group border-b border-slate-800 pb-3 mb-3 lg:border-none lg:pb-0 lg:mb-0">
                                                                        <input type="text" placeholder="IP Inicial (Ej: 192.168.70.1)" value={ex.startIp} onChange={(e) => {
                                                                            const n = [...selectedNode.properties.dhcp.excludedAddresses]; n[idx].startIp = e.target.value;
                                                                            updateNode(selectedNode.id, { properties: { ...selectedNode.properties, dhcp: { ...selectedNode.properties.dhcp, excludedAddresses: n } } });
                                                                        }} className="w-full lg:w-1/2 bg-slate-900 border-none rounded p-2 lg:p-1.5 text-xs font-mono focus:ring-1 focus:ring-yellow-500" />
                                                                        
                                                                        <input type="text" placeholder="IP Final (Opcional) (Ej: 192.168.70.20)" value={ex.endIp} onChange={(e) => {
                                                                            const n = [...selectedNode.properties.dhcp.excludedAddresses]; n[idx].endIp = e.target.value;
                                                                            updateNode(selectedNode.id, { properties: { ...selectedNode.properties, dhcp: { ...selectedNode.properties.dhcp, excludedAddresses: n } } });
                                                                        }} className="w-full lg:w-1/2 bg-slate-900 border-none rounded p-2 lg:p-1.5 text-xs font-mono focus:ring-1 focus:ring-yellow-500" />
                                                                        
                                                                        <button onClick={() => {
                                                                            const n = selectedNode.properties.dhcp.excludedAddresses.filter((_, i) => i !== idx);
                                                                            updateNode(selectedNode.id, { properties: { ...selectedNode.properties, dhcp: { ...selectedNode.properties.dhcp, excludedAddresses: n } } });
                                                                        }} className="text-slate-600 bg-slate-900 lg:bg-transparent p-2 lg:p-0 rounded hover:text-red-500 shrink-0 self-end lg:self-auto"><IconTrash size={16} className="lg:w-[14px] lg:h-[14px]"/></button>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    )}

                                                    {/* Lista de Pools */}
                                                    <div className="space-y-3">
                                                        {selectedNode.properties.dhcp?.pools?.map((pool, idx) => (
                                                            <div key={pool.id} className="grid grid-cols-1 lg:grid-cols-12 gap-3 bg-slate-950 p-4 rounded-2xl border border-slate-900 lg:items-end group hover:border-slate-700 transition-all">
                                                                <div className="col-span-1 lg:col-span-3">
                                                                    <label className="text-[8px] font-bold text-slate-600 block mb-1 uppercase">Nombre del Pool</label>
                                                                    <input type="text" value={pool.name} placeholder="Ej: admin" onChange={(e) => {
                                                                        const n = [...selectedNode.properties.dhcp.pools]; n[idx].name = e.target.value;
                                                                        updateNode(selectedNode.id, { properties: { ...selectedNode.properties, dhcp: { ...selectedNode.properties.dhcp, pools: n } } });
                                                                    }} className="w-full bg-slate-900 border-none rounded p-2 lg:p-1.5 text-xs font-mono outline-none focus:ring-1 focus:ring-yellow-500" />
                                                                </div>
                                                                <div className="col-span-1 lg:col-span-4">
                                                                    <label className="text-[8px] font-bold text-slate-600 block mb-1 uppercase">Red (Network + Mask)</label>
                                                                    <div className="flex flex-col lg:flex-row gap-2">
                                                                        <input type="text" value={pool.networkIp} placeholder="192.168.70.0" onChange={(e) => {
                                                                            const n = [...selectedNode.properties.dhcp.pools]; n[idx].networkIp = e.target.value;
                                                                            updateNode(selectedNode.id, { properties: { ...selectedNode.properties, dhcp: { ...selectedNode.properties.dhcp, pools: n } } });
                                                                        }} className="w-full lg:w-1/2 bg-slate-900 border-none rounded p-2 lg:p-1.5 text-xs font-mono outline-none focus:ring-1 focus:ring-yellow-500" />
                                                                        <input type="text" value={pool.mask} placeholder="255.255.255.0" onChange={(e) => {
                                                                            const n = [...selectedNode.properties.dhcp.pools]; n[idx].mask = e.target.value;
                                                                            updateNode(selectedNode.id, { properties: { ...selectedNode.properties, dhcp: { ...selectedNode.properties.dhcp, pools: n } } });
                                                                        }} className="w-full lg:w-1/2 bg-slate-900 border-none rounded p-2 lg:p-1.5 text-xs font-mono outline-none focus:ring-1 focus:ring-yellow-500" />
                                                                    </div>
                                                                </div>
                                                                <div className="col-span-1 lg:col-span-2">
                                                                    <label className="text-[8px] font-bold text-slate-600 block mb-1 uppercase tracking-tighter">Default Router</label>
                                                                    <input type="text" value={pool.defaultRouter} placeholder="192.168.70.1" onChange={(e) => {
                                                                        const n = [...selectedNode.properties.dhcp.pools]; n[idx].defaultRouter = e.target.value;
                                                                        updateNode(selectedNode.id, { properties: { ...selectedNode.properties, dhcp: { ...selectedNode.properties.dhcp, pools: n } } });
                                                                    }} className="w-full bg-slate-900 border-none rounded p-2 lg:p-1.5 text-xs font-mono outline-none focus:ring-1 focus:ring-yellow-500" />
                                                                </div>
                                                                <div className="col-span-1 lg:col-span-2">
                                                                    <label className="text-[8px] font-bold text-slate-600 block mb-1 uppercase tracking-tighter">DNS Server</label>
                                                                    <input type="text" value={pool.dnsServer} placeholder="8.8.8.8" onChange={(e) => {
                                                                        const n = [...selectedNode.properties.dhcp.pools]; n[idx].dnsServer = e.target.value;
                                                                        updateNode(selectedNode.id, { properties: { ...selectedNode.properties, dhcp: { ...selectedNode.properties.dhcp, pools: n } } });
                                                                    }} className="w-full bg-slate-900 border-none rounded p-2 lg:p-1.5 text-xs font-mono outline-none focus:ring-1 focus:ring-yellow-500" />
                                                                </div>
                                                                <div className="col-span-1 lg:col-span-1 flex justify-end lg:justify-center mt-2 lg:mt-0 pt-2 lg:pt-0 border-t border-slate-800 lg:border-none lg:pb-1 no-print">
                                                                    <button onClick={() => {
                                                                        const n = selectedNode.properties.dhcp.pools.filter((_, i) => i !== idx);
                                                                        updateNode(selectedNode.id, { properties: { ...selectedNode.properties, dhcp: { ...selectedNode.properties.dhcp, pools: n } } });
                                                                    }} className="text-slate-600 bg-slate-900 lg:bg-transparent p-2 lg:p-0 rounded lg:rounded-none hover:text-red-500 transition-colors"><IconTrash size={16} className="lg:w-[14px] lg:h-[14px]"/></button>
                                                                </div>
                                                            </div>
                                                        ))}
                                                        
                                                        {(!selectedNode.properties.dhcp?.pools || selectedNode.properties.dhcp.pools.length === 0) && (
                                                            <p className="text-xs text-slate-600 italic text-center py-4">No hay pools DHCP configurados.</p>
                                                        )}
                                                    </div>
                                                </div>
                                            </section>
                                        )}
                                        <div className="h-10"></div>{/* Spacer for bottom */}
                                    </div>
                                </div>

                                {/* CONSOLE CLI RESPONSIVO */}
                                {showCli && (
                                    <div className="absolute inset-0 lg:relative z-40 w-full lg:w-[450px] xl:w-[500px] bg-black p-6 lg:p-8 border-l border-slate-900 flex flex-col no-print shadow-2xl lg:shadow-[inset_10px_0_30px_rgba(0,0,0,0.4)] animate-in slide-in-from-right duration-300">
                                        <div className="flex items-center justify-between mb-6">
                                            <div className="flex items-center gap-3">
                                                <div className="w-2.5 h-2.5 rounded-full bg-green-500 shadow-[0_0_12px_#22c55e]"></div>
                                                <h3 className="text-[10px] font-black text-slate-500 uppercase tracking-[0.3em]">Cisco Real-Time CLI</h3>
                                            </div>
                                            <div className="flex items-center gap-3">
                                                <button onClick={copyToClipboard} className="text-[9px] font-black text-slate-400 hover:text-white border border-slate-800 px-4 py-2 rounded-lg uppercase tracking-widest transition-all hover:bg-slate-900">Copiar</button>
                                                <button onClick={() => setShowCli(false)} className="lg:hidden p-2 bg-slate-900 rounded text-slate-400 hover:text-white">
                                                    <IconX size={18} />
                                                </button>
                                            </div>
                                        </div>
                                        <div className="flex-1 bg-[#0a0c10] rounded-2xl border border-slate-800 p-6 font-mono text-[11px] leading-relaxed overflow-y-auto text-green-500/90 scrollbar-hide selection:bg-green-500/20 selection:text-white">
                                            <pre className="whitespace-pre-wrap">{generateConfig(selectedNode)}</pre>
                                        </div>
                                        <div className="mt-6 p-4 bg-slate-900/30 rounded-xl border border-slate-800/50 text-center font-bold italic text-[9px] text-slate-500 uppercase tracking-wide">
                                            Generación compatible con IOS XE/XR
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
