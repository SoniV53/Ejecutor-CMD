<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConsoleFlow - API Documenter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f1f5f9; height: 100vh; overflow: hidden; }
        .code-font { font-family: 'Fira Code', monospace; }
        .glass-sidebar { background: #0b1120; border-right: 1px solid #1e293b; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        .editor-area { background: #020617; border: 1px solid #1e293b; }
        .item-row:hover { background: #1e293b; }
        .item-active { background: #312e81 !important; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- HEADER -->
    <header class="h-16 border-b border-slate-900 bg-[#020617]/90 backdrop-blur-xl flex items-center justify-between px-6 shrink-0">
        <div class="flex items-center gap-4">
            <a href="/" class="p-2 hover:bg-slate-800 rounded-xl transition-colors">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </a>
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-lg shadow-lg">
                    <i data-lucide="file-json" class="text-white w-5 h-5"></i>
                </div>
                <h1 class="font-bold text-lg">API Doc Manager</h1>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="downloadAsTxt()" class="flex items-center gap-2 px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-bold transition-all">
                <i data-lucide="download" class="w-4 h-4"></i> Descargar .txt
            </button>
            <button onclick="saveToProject()" class="flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-xs font-bold shadow-lg shadow-indigo-600/20 transition-all">
                <i data-lucide="save" class="w-4 h-4"></i> Guardar en Proyecto
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        
        <!-- SIDEBAR (EXPLORADOR) -->
        <aside class="w-72 glass-sidebar flex flex-col shrink-0 overflow-hidden">
            <div class="p-4 border-b border-slate-900 flex justify-between items-center">
                <span class="text-[10px] font-black uppercase text-slate-500 tracking-widest">Explorador</span>
                <div class="flex gap-1">
                    <button onclick="createFolder()" class="p-1.5 hover:bg-slate-800 rounded-lg text-slate-400" title="Nueva Carpeta">
                        <i data-lucide="folder-plus" class="w-4 h-4"></i>
                    </button>
                    <button onclick="refreshExplorer()" class="p-1.5 hover:bg-slate-800 rounded-lg text-slate-400" title="Refrescar">
                        <i data-lucide="rotate-cw" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
            
            <div id="explorerList" class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1">
                <!-- Se llena dinámicamente -->
            </div>
            
            <div class="p-4 bg-slate-950/50 border-t border-slate-900">
                <div class="text-[9px] text-slate-600 font-bold uppercase mb-1">Carpeta Activa:</div>
                <div id="currentFolderPath" class="text-[11px] text-indigo-400 font-mono truncate">/root</div>
            </div>
        </aside>

        <!-- MAIN EDITOR -->
        <main class="flex-1 flex flex-col p-6 gap-6 overflow-hidden">
            <div class="flex gap-4 shrink-0">
                <div class="flex-1">
                    <label class="text-[10px] font-bold text-slate-500 uppercase mb-2 block ml-1">Nombre del Servicio / Archivo</label>
                    <input type="text" id="docName" placeholder="ej: auth_login_v1" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-indigo-600 outline-none text-white transition-all">
                </div>
                <div class="w-48">
                    <label class="text-[10px] font-bold text-slate-500 uppercase mb-2 block ml-1">Tipo</label>
                    <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-800">
                        <button onclick="setDocType('req')" id="btnReq" class="flex-1 py-2 text-[10px] font-bold rounded-lg bg-indigo-600 text-white transition-all">REQUEST</button>
                        <button onclick="setDocType('res')" id="btnRes" class="flex-1 py-2 text-[10px] font-bold rounded-lg text-slate-400 hover:text-white transition-all">RESPONSE</button>
                    </div>
                </div>
            </div>

            <div class="flex-1 flex flex-col overflow-hidden">
                <label class="text-[10px] font-bold text-slate-500 uppercase mb-2 block ml-1">Contenido (JSON / Texto Largo)</label>
                <textarea id="docContent" class="flex-1 w-full editor-area rounded-2xl p-6 code-font text-sm text-indigo-100 focus:outline-none focus:ring-2 focus:ring-indigo-600/50 resize-none custom-scrollbar" placeholder="{ 'data': ... }"></textarea>
            </div>
        </main>
    </div>

    <script>
        let currentFolder = '';
        let currentDocType = 'req';
        let items = [];

        async function refreshExplorer(folder = '') {
            currentFolder = folder;
            document.getElementById('currentFolderPath').innerText = '/' + (folder || 'root');
            
            try {
                const res = await fetch(`/api/doc/list?path=${encodeURIComponent(folder)}`);
                items = await res.json();
                renderExplorer();
            } catch (e) { console.error(e); }
        }

        function renderExplorer() {
            const container = document.getElementById('explorerList');
            let html = '';
            
            if (currentFolder) {
                html += `
                    <div onclick="goBack()" class="item-row flex items-center gap-3 p-2.5 rounded-xl cursor-pointer text-slate-500 transition-colors">
                        <i data-lucide="chevron-left" class="w-4 h-4"></i>
                        <span class="text-xs font-bold">Volver...</span>
                    </div>
                `;
            }

            items.forEach(item => {
                const icon = item.isFolder ? 'folder' : 'file-text';
                const color = item.isFolder ? 'text-amber-500' : 'text-slate-400';
                
                html += `
                    <div onclick="${item.isFolder ? `refreshExplorer('${item.path}')` : `loadFile('${item.path}')`}" class="item-row group flex items-center justify-between p-2.5 rounded-xl cursor-pointer transition-all">
                        <div class="flex items-center gap-3 truncate">
                            <i data-lucide="${icon}" class="w-4 h-4 ${color} shrink-0"></i>
                            <span class="text-xs font-medium truncate">${item.name}</span>
                        </div>
                        <button onclick="event.stopPropagation(); deleteItem('${item.path}')" class="opacity-0 group-hover:opacity-100 p-1 hover:text-red-400 transition-all">
                            <i data-lucide="trash-2" class="w-3 h-3"></i>
                        </button>
                    </div>
                `;
            });

            container.innerHTML = html || '<p class="text-[10px] text-slate-600 text-center py-10">Carpeta vacía</p>';
            lucide.createIcons();
        }

        function goBack() {
            const parts = currentFolder.split('/');
            parts.pop();
            refreshExplorer(parts.join('/'));
        }

        async function loadFile(path) {
            try {
                const res = await fetch(`/api/doc/read?path=${encodeURIComponent(path)}`);
                const data = await res.json();
                document.getElementById('docContent').value = data.content;
                const name = path.split('/').pop().replace('.txt', '');
                document.getElementById('docName').value = name;
            } catch (e) { alert("Error al cargar archivo"); }
        }

        async function saveToProject() {
            const name = document.getElementById('docName').value.trim();
            const content = document.getElementById('docContent').value;
            if (!name || !content) return alert("Completa nombre y contenido");

            const finalName = `${name}_${currentDocType}`;

            try {
                const res = await fetch('/api/doc/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fileName: finalName, folder: currentFolder, content })
                });
                if (res.ok) {
                    alert("Guardado correctamente en el sistema");
                    refreshExplorer(currentFolder);
                }
            } catch (e) { alert("Error al guardar"); }
        }

        function downloadAsTxt() {
            const name = document.getElementById('docName').value || 'api_doc';
            const content = document.getElementById('docContent').value;
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${name}_${currentDocType}.txt`;
            a.click();
        }

        function setDocType(type) {
            currentDocType = type;
            document.getElementById('btnReq').className = type === 'req' ? 'flex-1 py-2 text-[10px] font-bold rounded-lg bg-indigo-600 text-white transition-all' : 'flex-1 py-2 text-[10px] font-bold rounded-lg text-slate-400 hover:text-white transition-all';
            document.getElementById('btnRes').className = type === 'res' ? 'flex-1 py-2 text-[10px] font-bold rounded-lg bg-indigo-600 text-white transition-all' : 'flex-1 py-2 text-[10px] font-bold rounded-lg text-slate-400 hover:text-white transition-all';
        }

        async function createFolder() {
            const name = prompt("Nombre de la nueva carpeta:");
            if (!name) return;
            try {
                await fetch('/api/doc/save', {
                    method: 'POST',
                    body: JSON.stringify({ fileName: '.keep', folder: currentFolder + '/' + name, content: '' })
                });
                refreshExplorer(currentFolder);
            } catch(e) {}
        }

        async function deleteItem(path) {
            if (!confirm("¿Eliminar permanentemente?")) return;
            try {
                await fetch('/api/doc/delete', {
                    method: 'POST',
                    body: JSON.stringify({ itemPath: path })
                });
                refreshExplorer(currentFolder);
            } catch(e) {}
        }

        window.onload = () => {
            lucide.createIcons();
            refreshExplorer();
        };
    </script>
</body>
</html>
