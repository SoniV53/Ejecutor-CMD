<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConsoleFlow - API Documenter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f1f5f9; height: 100vh; overflow: hidden; }
        .code-font { font-family: 'Fira Code', monospace; }
        .glass-sidebar { background: #0b1120; border-right: 1px solid #1e293b; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        .editor-area { background: #020617; border: 1px solid #1e293b; }
        
        /* Mejoras en las filas del explorador */
        .item-row { border: 1px solid transparent; }
        .item-row.active-file { background: rgba(79, 70, 229, 0.15); border-color: rgba(99, 102, 241, 0.3); }
        .item-row:hover:not(.active-file) { background: #1e293b; }
        
        .toast {
            position: fixed; bottom: 2rem; right: 2rem; padding: 1rem 1.5rem; border-radius: 1rem;
            display: flex; align-items: center; gap: 0.75rem; z-index: 1000; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateY(100px); opacity: 0;
        }
        .toast.show { transform: translateY(0); opacity: 1; }

        /* Animación para los modales */
        .animate-fade { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <div id="toast" class="toast bg-slate-900 border border-indigo-500/30 text-white shadow-2xl">
        <i data-lucide="check-circle" id="toastIcon" class="w-5 h-5 text-indigo-400"></i>
        <span id="toastMsg" class="text-sm font-medium">Acción completada</span>
    </div>

    <!-- HEADER -->
    <header class="h-16 border-b border-slate-900 bg-[#020617]/90 backdrop-blur-xl flex items-center justify-between px-6 shrink-0 z-10">
        <div class="flex items-center gap-4">
            <a href="/" class="p-2 hover:bg-slate-800 rounded-xl transition-colors">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </a>
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-lg shadow-lg">
                    <i data-lucide="file-json" class="text-white w-5 h-5"></i>
                </div>
                <h1 class="font-bold text-lg">API Doc Manager</h1>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="clearEditor()" class="p-2 text-slate-500 hover:text-white transition-colors" title="Limpiar Editor">
                <i data-lucide="eraser" class="w-5 h-5"></i>
            </button>
            <button onclick="downloadAsTxt()" class="flex items-center gap-2 px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-bold transition-all">
                <i data-lucide="download" class="w-4 h-4"></i> Descargar .txt
            </button>
            <button id="btnSave" onclick="saveToProject()" class="flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-xs font-bold shadow-lg shadow-indigo-600/20 transition-all">
                <i data-lucide="save" class="w-4 h-4"></i> Guardar en Proyecto
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- SIDEBAR -->
        <aside class="w-72 glass-sidebar flex flex-col shrink-0 overflow-hidden">
            <div class="p-4 border-b border-slate-900 flex justify-between items-center">
                <span class="text-[10px] font-black uppercase text-slate-500 tracking-widest">Explorador</span>
                <div class="flex gap-1">
                    <button onclick="createFolder()" class="p-1.5 hover:bg-slate-800 rounded-lg text-slate-400 transition-colors" title="Nueva Carpeta">
                        <i data-lucide="folder-plus" class="w-4 h-4"></i>
                    </button>
                    <button onclick="refreshExplorer(currentFolder)" class="p-1.5 hover:bg-slate-800 rounded-lg text-slate-400 transition-colors" title="Refrescar">
                        <i data-lucide="rotate-cw" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
            
            <div id="explorerList" class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1"></div>
            
            <div class="p-4 bg-slate-950/50 border-t border-slate-900">
                <div class="text-[9px] text-slate-600 font-bold uppercase mb-1">Directorio:</div>
                <div id="currentFolderPath" class="text-[11px] text-indigo-400 font-mono truncate">/api_docs</div>
            </div>
        </aside>

        <!-- EDITOR -->
        <main class="flex-1 flex flex-col p-6 gap-6 overflow-hidden">
            <div class="flex gap-4 shrink-0">
                <div class="flex-1">
                    <label class="text-[10px] font-bold text-slate-500 uppercase mb-2 block ml-1">Nombre del Servicio</label>
                    <input type="text" id="docName" placeholder="auth_login_v1" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-indigo-600 outline-none text-white transition-all">
                </div>
                <div class="w-48">
                    <label class="text-[10px] font-bold text-slate-500 uppercase mb-2 block ml-1">Tipo de Trama</label>
                    <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-800">
                        <button onclick="setDocType('req')" id="btnReq" class="flex-1 py-2 text-[10px] font-bold rounded-lg bg-indigo-600 text-white transition-all">REQ</button>
                        <button onclick="setDocType('res')" id="btnRes" class="flex-1 py-2 text-[10px] font-bold rounded-lg text-slate-400 hover:text-white transition-all">RES</button>
                    </div>
                </div>
            </div>

            <div class="flex-1 flex flex-col overflow-hidden relative">
                <!-- Herramientas de Formateo -->
                <div class="flex items-center justify-between mb-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase block ml-1">Cuerpo del Mensaje (Request/Response)</label>
                    
                    <!-- Botonera de Formateadores -->
                    <div class="flex items-center gap-1.5">
                        <span class="text-[9px] font-bold text-slate-600 uppercase mr-1">Formato:</span>
                        <button onclick="formatContent('json')" class="flex items-center gap-1.5 px-2.5 py-1.5 bg-slate-900 hover:bg-indigo-600/20 text-slate-400 hover:text-indigo-400 border border-slate-800 rounded-lg text-[9px] font-bold transition-all" title="Formatear como JSON">
                            <i data-lucide="braces" class="w-3 h-3"></i> JSON
                        </button>
                        <button onclick="formatContent('txt')" class="flex items-center gap-1.5 px-2.5 py-1.5 bg-slate-900 hover:bg-emerald-600/20 text-slate-400 hover:text-emerald-400 border border-slate-800 rounded-lg text-[9px] font-bold transition-all" title="Limpiar y formatear Texto">
                            <i data-lucide="align-left" class="w-3 h-3"></i> TXT
                        </button>
                    </div>
                </div>
                
                <textarea id="docContent" spellcheck="false" class="flex-1 w-full editor-area rounded-2xl p-6 code-font text-sm text-indigo-100 focus:outline-none focus:ring-2 focus:ring-indigo-600/50 resize-none custom-scrollbar" placeholder='{ "header": { ... }, "body": { ... } }'></textarea>
            </div>
        </main>
    </div>

    <!-- MODALES CUSTOM -->
    
    <!-- Modal Nueva Carpeta -->
    <div id="folderModal" class="fixed inset-0 bg-black/80 hidden z-[60] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-[#0f172a] border border-slate-800 w-full max-w-sm rounded-3xl p-6 shadow-2xl animate-fade">
            <h3 class="text-xl font-bold text-white mb-2">Nueva Carpeta</h3>
            <p class="text-xs text-slate-400 mb-4">Ingresa el nombre del nuevo directorio de servicios.</p>
            <input type="text" id="inFolderName" placeholder="Ej: v1_pagos" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-indigo-600 outline-none text-white mb-6" onkeydown="if(event.key==='Enter') confirmCreateFolder()">
            <div class="flex gap-3">
                <button onclick="closeFolderModal()" class="flex-1 py-3 rounded-xl bg-slate-800 font-bold text-slate-300 transition-colors hover:bg-slate-700">Cancelar</button>
                <button onclick="confirmCreateFolder()" class="flex-1 py-3 rounded-xl bg-indigo-600 font-bold text-white shadow-lg shadow-indigo-600/30 transition-all hover:bg-indigo-500">Crear</button>
            </div>
        </div>
    </div>

    <!-- Modal Confirmación Genérico -->
    <div id="confirmModal" class="fixed inset-0 bg-black/80 hidden z-[70] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-[#0f172a] border border-slate-800 w-full max-w-sm rounded-3xl p-6 shadow-2xl animate-fade text-center">
            <div class="w-14 h-14 bg-red-500/10 text-red-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-red-500/20">
                <i data-lucide="alert-triangle" class="w-7 h-7"></i>
            </div>
            <h3 class="text-xl font-bold text-white mb-2" id="confirmTitle">¿Estás seguro?</h3>
            <p class="text-slate-400 text-sm mb-6" id="confirmText">Esta acción no se puede deshacer.</p>
            <div class="flex gap-3">
                <button onclick="closeConfirmModal()" class="flex-1 py-3 rounded-xl bg-slate-800 font-bold text-slate-300 transition-colors hover:bg-slate-700">Cancelar</button>
                <button id="btnConfirmAction" class="flex-1 py-3 rounded-xl bg-red-600 font-bold text-white shadow-lg shadow-red-600/30 transition-all hover:bg-red-500">Confirmar</button>
            </div>
        </div>
    </div>

    <script>
        let currentFolder = '';
        let currentDocType = 'req';
        let items = [];
        let activeFile = '';
        let confirmCallback = null;

        // MANEJO DE TOASTS Y MODALES
        function showToast(msg, icon = 'check-circle', color = 'text-indigo-400') {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            const iconEl = document.getElementById('toastIcon');
            iconEl.setAttribute('data-lucide', icon);
            iconEl.className = `w-5 h-5 ${color}`;
            lucide.createIcons();
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function showConfirm(title, text, callback) {
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmText').innerText = text;
            confirmCallback = callback;
            document.getElementById('confirmModal').classList.remove('hidden');
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.add('hidden');
            confirmCallback = null;
        }

        document.getElementById('btnConfirmAction').addEventListener('click', () => {
            if(confirmCallback) confirmCallback();
            closeConfirmModal();
        });

        // EXPLORADOR
        async function refreshExplorer(folder = '') {
            currentFolder = folder;
            document.getElementById('currentFolderPath').innerText = '/api_docs' + (folder ? '/' + folder : '');
            
            try {
                const res = await fetch(`/api/doc/list?path=${encodeURIComponent(folder)}&_t=${Date.now()}`, { cache: 'no-store' });
                if (!res.ok) throw new Error("Error en la red al refrescar");
                items = await res.json();
            } catch (e) { 
                console.error("Error explorador:", e);
                if (items.length === 0) items = []; 
            }
            renderExplorer();
        }

        function renderExplorer() {
            const container = document.getElementById('explorerList');
            let html = '';
            
            if (currentFolder) {
                html += `
                    <div onclick="goBack()" class="item-row flex items-center gap-3 p-2.5 rounded-xl cursor-pointer text-slate-500 transition-colors">
                        <i data-lucide="chevron-left" class="w-4 h-4"></i>
                        <span class="text-xs font-bold">...volver</span>
                    </div>
                `;
            }

            let renderedItemsCount = 0;

            items.forEach(item => {
                if (item.name === '.keep.txt' || item.name === '.keep' || item.name === '_init.txt') return;
                renderedItemsCount++;

                const icon = item.isFolder ? 'folder' : 'file-text';
                const color = item.isFolder ? 'text-amber-500' : 'text-indigo-400';
                const safePath = item.path.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const isCurrentActive = !item.isFolder && item.path === activeFile;
                const activeClass = isCurrentActive ? 'active-file' : '';
                
                html += `
                    <div onclick="${item.isFolder ? `refreshExplorer('${safePath}')` : `loadFile('${safePath}')`}" 
                         class="item-row ${activeClass} group flex items-center justify-between p-2.5 rounded-xl cursor-pointer transition-all">
                        
                        <div class="flex items-center gap-3 truncate flex-1 pointer-events-none">
                            <i data-lucide="${icon}" class="w-4 h-4 ${color} shrink-0"></i>
                            <span class="text-xs font-medium truncate ${isCurrentActive ? 'text-indigo-300' : ''}">${item.name}</span>
                        </div>
                        
                        <button onclick="event.stopPropagation(); deleteItem('${safePath}')" 
                                class="opacity-0 group-hover:opacity-100 p-1.5 hover:bg-slate-800 hover:text-red-400 rounded-lg transition-all" title="Eliminar">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                `;
            });

            if (renderedItemsCount === 0 && !currentFolder) {
                container.innerHTML = '<p class="text-[10px] text-slate-600 text-center py-10 font-bold uppercase">Vacío</p>';
            } else {
                container.innerHTML = html;
            }
            
            lucide.createIcons();
        }

        function goBack() {
            const parts = currentFolder.split('/').filter(Boolean);
            parts.pop();
            refreshExplorer(parts.join('/'));
        }

        // CARGA Y GUARDADO
        async function loadFile(path) {
            try {
                const res = await fetch(`/api/doc/read?path=${encodeURIComponent(path)}&_t=${Date.now()}`);
                const data = await res.json();
                document.getElementById('docContent').value = data.content;
                
                const fileName = path.split('/').pop();
                const baseName = fileName.replace('.txt', '').replace(/_(req|res)$/, '');
                document.getElementById('docName').value = baseName;
                
                if (fileName.includes('_res')) setDocType('res');
                else if (fileName.includes('_req')) setDocType('req');

                activeFile = path;
                renderExplorer(); 
                showToast("Archivo cargado");
            } catch (e) { 
                showToast("Error al abrir", "alert-circle", "text-red-400"); 
            }
        }

        async function saveToProject() {
            const name = document.getElementById('docName').value.trim();
            const content = document.getElementById('docContent').value.trim();
            
            if (!name) return showToast("Falta nombre", "alert-circle", "text-red-400");
            if (!content) return showToast("Contenido vacío", "alert-circle", "text-red-400");

            const finalName = `${name}_${currentDocType}`;
            const btn = document.getElementById('btnSave');
            btn.disabled = true;
            btn.classList.add('opacity-50');

            try {
                const res = await fetch('/api/doc/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fileName: finalName, folder: currentFolder, content })
                });
                const data = await res.json();
                
                if (data.status === 'success') {
                    showToast("Guardado en servidor");
                    activeFile = (currentFolder ? currentFolder + '/' : '') + finalName + '.txt';
                    refreshExplorer(currentFolder);
                } else { 
                    throw new Error(data.error); 
                }
            } catch (e) { 
                showToast("Error de conexión", "alert-circle", "text-red-400"); 
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }

        function downloadAsTxt() {
            const name = document.getElementById('docName').value.trim() || 'servicio_doc';
            const content = document.getElementById('docContent').value.trim();
            
            if (!content) return showToast("Nada que exportar", "alert-circle", "text-red-400");

            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${name}_${currentDocType}.txt`;
            document.body.appendChild(a);
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 100);
            
            showToast("Exportado a descargas");
        }

        // CARPETAS Y ELIMINACIÓN
        function createFolder() {
            document.getElementById('inFolderName').value = '';
            document.getElementById('folderModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('inFolderName').focus(), 100);
        }

        function closeFolderModal() {
            document.getElementById('folderModal').classList.add('hidden');
        }

        async function confirmCreateFolder() {
            const rawName = document.getElementById('inFolderName').value;
            const name = rawName.replace(/[^a-zA-Z0-9_\-\s]/g, '').trim();
            
            if (!name) return showToast("Nombre inválido", "alert-circle", "text-red-400");
            
            closeFolderModal();

            const targetFolder = currentFolder ? `${currentFolder}/${name}` : name;
            items.unshift({ name: name, isFolder: true, path: targetFolder });
            renderExplorer();

            try {
                const res = await fetch('/api/doc/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        fileName: '_init.txt', 
                        folder: targetFolder, 
                        content: 'Directorio inicializado por ConsoleFlow'
                    })
                });
                
                const data = await res.json();
                
                if (res.ok && data.status === 'success') {
                    showToast("Carpeta creada");
                    setTimeout(() => refreshExplorer(currentFolder), 250);
                } else {
                    throw new Error(data.error || "Error del servidor");
                }
            } catch(e) {
                console.error("Error al crear carpeta:", e);
                showToast("Error de servidor", "alert-circle", "text-red-400");
                refreshExplorer(currentFolder);
            }
        }

        function deleteItem(path) {
            showConfirm("Eliminar Elemento", "¿Borrar este archivo/carpeta permanentemente?", async () => {
                try {
                    const res = await fetch('/api/doc/delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ itemPath: path })
                    });
                    if (res.ok) {
                        showToast("Eliminado");
                        if (activeFile === path) {
                            document.getElementById('docContent').value = '';
                            document.getElementById('docName').value = '';
                            activeFile = '';
                        }
                        refreshExplorer(currentFolder);
                    }
                } catch(e) {
                    showToast("Error al eliminar", "alert-circle", "text-red-400");
                }
            });
        }

        function clearEditor() {
            showConfirm("Limpiar Editor", "¿Deseas borrar todo el texto que estás escribiendo?", () => {
                document.getElementById('docContent').value = '';
                document.getElementById('docName').value = '';
                activeFile = '';
                renderExplorer();
                showToast("Editor limpio", "eraser");
            });
        }

        function setDocType(type) {
            currentDocType = type;
            document.getElementById('btnReq').className = type === 'req' ? 'flex-1 py-2 text-[10px] font-bold rounded-lg bg-indigo-600 text-white' : 'flex-1 py-2 text-[10px] font-bold rounded-lg text-slate-400 hover:text-white';
            document.getElementById('btnRes').className = type === 'res' ? 'flex-1 py-2 text-[10px] font-bold rounded-lg bg-indigo-600 text-white' : 'flex-1 py-2 text-[10px] font-bold rounded-lg text-slate-400 hover:text-white';
        }

        // LÓGICA DE FORMATEADORES VISUALES
        function formatContent(type) {
            const editor = document.getElementById('docContent');
            let content = editor.value;

            if (!content.trim()) {
                showToast("El editor está vacío", "alert-circle", "text-amber-400");
                return;
            }

            if (type === 'json') {
                try {
                    // Intenta reemplazar comillas simples por dobles en caso de haber copiado un objeto JS
                    let toParse = content.replace(/'/g, '"');
                    const obj = JSON.parse(toParse);
                    // Formatea con 4 espacios de indentación
                    editor.value = JSON.stringify(obj, null, 4);
                    showToast("JSON Formateado", "check", "text-indigo-400");
                } catch (e) {
                    showToast("Sintaxis JSON Inválida", "alert-triangle", "text-red-400");
                }
            } else if (type === 'txt') {
                // Formateo simple de texto: remueve dobles espacios y múltiples saltos de línea inútiles
                editor.value = content
                    .replace(/\n{3,}/g, '\n\n') // Reduce saltos de línea excesivos
                    .split('\n')
                    .map(line => line.trim())   // Elimina espacios al principio/final de cada línea
                    .join('\n');
                showToast("Texto Formateado", "check", "text-emerald-400");
            }
        }

        window.onload = () => {
            lucide.createIcons();
            refreshExplorer();
        };
    </script>
</body>
</html>
