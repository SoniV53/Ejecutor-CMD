<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConsoleFlow - Device Emulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Script de seguridad para evitar errores de solo lectura en WebSocket con Eruda -->
    <script>
        (function() {
            try {
                var originalWebSocket = window.WebSocket;
                if (originalWebSocket) {
                    Object.defineProperty(window, 'WebSocket', {
                        configurable: true,
                        enumerable: true,
                        get: function() { return originalWebSocket; },
                        set: function(v) { 
                            console.warn("Intento de sobrescritura de WebSocket detectado y bloqueado."); 
                        }
                    });
                }
            } catch (e) {}
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f1f5f9;
            height: 100vh;
            width: 100vw;
            margin: 0;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.05) 0%, transparent 50%);
        }

        .code-font { font-family: 'Fira Code', monospace; }
        
        #workspace {
            display: flex;
            align-items: flex-start; 
            justify-content: flex-start; 
            overflow: auto;
            flex: 1;
            position: relative;
        }

        #deviceWrapper {
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
            margin: auto; 
            position: relative;
        }

        .device-mockup {
            /* Sincronizado a 0.3s idéntico al Wrapper para que el Zoom no parpadee ni se desfase */
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255,255,255,0.05);
            background: black;
            position: relative;
            transform-origin: top left; 
        }

        /* --- CLASE CLAVE PARA EL MODO RESPONSIVE (ARRASTRABLE) --- */
        .mode-responsive {
            max-width: none !important;
            max-height: none !important;
            border-radius: 0 !important;
            border: 2px dashed #475569 !important;
            box-shadow: none !important;
            resize: both !important; 
            overflow: hidden !important;
            background: white !important;
            min-width: 250px;
            min-height: 250px;
            transform: none !important;
        }
        
        .mode-responsive > #notch,
        .mode-responsive > #statusBar,
        .mode-responsive > #homeIndicator {
            display: none !important;
        }

        .animate-slide-up { animation: slideUp 0.6s ease-out forwards; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; border: 2px solid #020617; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #334155; }
        .custom-scrollbar::-webkit-scrollbar-corner { background: transparent; }

        #mainHeader { transition: transform 0.3s ease-in-out, margin-top 0.3s ease-in-out; }
        .header-hidden { transform: translateY(-100%); margin-top: -90px; }
    </style>
</head>
<body class="flex flex-col h-screen relative">

    <!-- BARRA DE ARRASTRE PARA REDIMENSIONAR LA CONSOLA ERUDA -->
    <div id="console-resizer" class="fixed z-[9999] hidden hover:bg-indigo-500/50 transition-colors"></div>

    <!-- TOAST DE ALERTA DE CORS -->
    <div id="toastCors" class="fixed bottom-6 right-6 bg-[#0f172a] text-white p-5 rounded-2xl shadow-2xl z-[70] hidden border border-red-500/50 max-w-sm animate-slide-up">
        <h4 class="font-bold text-red-400 mb-2 flex items-center gap-2 text-sm">
            <i data-lucide="shield-alert" class="w-5 h-5"></i> Bloqueo de Seguridad (CORS)
        </h4>
        <p class="text-xs text-slate-400 leading-relaxed">
            El emulador no pudo inyectar el simulador táctil para tu teclado porque la App está en un puerto diferente.<br><br>
            Asegúrate de agregar <code class="text-indigo-400 bg-indigo-500/10 px-1 rounded">webSecurity: false</code> en las <b>webPreferences</b> de tu <code class="text-indigo-400">main.js</code> de Electron.
        </p>
        <button onclick="document.getElementById('toastCors').classList.add('hidden')" class="mt-4 w-full py-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-lg text-xs font-bold transition-colors">
            Entendido
        </button>
    </div>

    <button id="btnShowMenu" onclick="toggleMenu()" class="fixed top-4 left-4 z-[60] bg-indigo-600 p-2.5 rounded-xl shadow-lg opacity-0 pointer-events-none transition-all">
        <i data-lucide="chevrons-down" class="text-white w-5 h-5"></i>
    </button>

    <header id="mainHeader" class="w-full border-b border-slate-900 bg-[#020617]/95 backdrop-blur-2xl z-50 shrink-0">
        <div class="px-4 md:px-6 py-3 flex flex-col gap-3">
            <div class="flex items-center justify-between gap-4">
                <div class="flex items-center gap-2 md:gap-4 shrink-0">
                    <button onclick="toggleMenu()" class="p-2 rounded-xl transition-all hover:bg-slate-800 text-slate-400 hover:text-white" title="Ocultar Menú">
                        <i data-lucide="chevrons-up" class="w-5 h-5"></i>
                    </button>
                    <a href="/" class="bg-indigo-600 p-2 rounded-xl shadow-lg hover:scale-105 transition-transform">
                        <i data-lucide="home" class="text-white w-5 h-5"></i>
                    </a>
                </div>

                <div class="flex-1 max-w-2xl flex items-center gap-2">
                    <input type="text" id="urlInput" value="" placeholder="http://localhost:8100" 
                        class="w-full bg-[#0f172a] border border-slate-800 rounded-xl px-4 py-2 text-sm code-font focus:outline-none focus:border-indigo-500 transition-all text-white"
                        onkeydown="if(event.key === 'Enter') navigateToUrl()">
                    <button onclick="navigateToUrl()" class="bg-indigo-600 hover:bg-indigo-500 text-white p-2 rounded-xl transition-colors shadow-lg">
                        <i data-lucide="arrow-right" class="w-5 h-5"></i>
                    </button>
                    <button onclick="refreshFrame()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2 rounded-xl transition-colors border border-slate-700">
                        <i data-lucide="rotate-cw" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between gap-2 overflow-x-auto custom-scrollbar pb-1">
                <div class="flex items-center gap-1 bg-[#0f172a] p-1 rounded-xl border border-slate-800 shrink-0">
                    <button onclick="updateZoom(-0.1)" class="p-1.5 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition-colors">
                        <i data-lucide="zoom-out" class="w-4 h-4"></i>
                    </button>
                    <span id="zoomLabel" class="text-[10px] font-bold text-indigo-400 w-10 text-center">100%</span>
                    <button onclick="updateZoom(0.1)" class="p-1.5 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition-colors">
                        <i data-lucide="zoom-in" class="w-4 h-4"></i>
                    </button>
                    <div class="w-px h-4 bg-slate-700 mx-1"></div>
                    <button onclick="autoFit()" class="p-1.5 text-slate-400 hover:text-indigo-400 rounded-lg hover:bg-slate-800 transition-colors" title="Auto-Ajustar (Encajar)">
                        <i data-lucide="shrink" class="w-4 h-4"></i>
                    </button>
                    <button onclick="resetZoom()" class="p-1.5 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition-colors" title="Tamaño Original (100%)">
                        <i data-lucide="maximize" class="w-4 h-4"></i>
                    </button>
                </div>

                <div class="flex items-center gap-2 shrink-0 bg-[#0f172a] p-1 rounded-xl border border-slate-800">
                    <button onclick="toggleDeviceMode()" class="p-1.5 text-slate-400 hover:text-white" title="Alternar Modo">
                        <i data-lucide="smartphone-charging" class="w-4 h-4"></i>
                    </button>
                    <div class="w-px h-4 bg-slate-700"></div>
                    <select id="deviceSelector" onchange="changeDevice()" class="bg-transparent text-[10px] font-bold text-slate-300 outline-none px-2 py-1 cursor-pointer">
                        <option value="iphone14">iPhone 14 Pro</option>
                        <option value="pixel7">Pixel 7</option>
                        <option value="ipad">iPad Mini</option>
                        <option value="responsive">Responsive</option>
                    </select>
                    <div class="w-px h-4 bg-slate-700"></div>
                    <button onclick="toggleRotation()" id="btnRotate" class="p-1.5 text-slate-400 hover:text-white rounded-lg transition-all">
                        <i data-lucide="smartphone" class="w-4 h-4 transition-transform duration-300" id="rotateIcon"></i>
                    </button>
                </div>

                <div class="flex items-center gap-1">
                    <select id="consolePosition" onchange="changeConsolePosition()" class="bg-slate-800 text-[10px] font-bold text-slate-300 outline-none px-2 py-2 rounded-xl border border-slate-700 cursor-pointer hidden">
                        <option value="bottom">Abajo</option>
                        <option value="left">Izquierda</option>
                        <option value="right">Derecha</option>
                    </select>
                    <button onclick="toggleConsole()" class="flex items-center gap-2 bg-slate-800 hover:bg-indigo-600/20 text-slate-300 hover:text-indigo-400 px-4 py-2 rounded-xl text-[10px] font-black uppercase transition-all border border-slate-700">
                        <i data-lucide="terminal" class="w-4 h-4"></i> <span class="hidden sm:inline">Consola</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main id="workspace" class="custom-scrollbar bg-[#020617]">
        <!-- MOVIMOS animate-slide-up AL WRAPPER PARA QUE NO BLOQUEE EL ZOOM (TRANSFORM) DEL DISPOSITIVO -->
        <div id="deviceWrapper" class="animate-slide-up">
            <div id="deviceContainer" class="device-mockup border-slate-900 rounded-[3rem] flex flex-col overflow-hidden w-[393px] h-[852px] border-[12px]">
                <div id="notch" class="absolute top-0 inset-x-0 h-6 bg-slate-900 rounded-b-2xl w-28 mx-auto z-10 flex justify-center items-end pb-1 gap-1.5">
                    <div class="w-10 h-1 bg-black rounded-full opacity-40"></div>
                    <div class="w-1 h-1 bg-black rounded-full opacity-40"></div>
                </div>
                <div id="statusBar" class="h-6 w-full bg-black text-white text-[9px] font-bold flex justify-between items-center px-6 shrink-0">
                    <span id="clock">9:41</span>
                    <div class="flex gap-1.5 items-center">
                        <i data-lucide="signal" class="w-2.5 h-2.5"></i>
                        <i data-lucide="wifi" class="w-2.5 h-2.5"></i>
                        <i data-lucide="battery-full" class="w-3 h-3"></i>
                    </div>
                </div>
                <div class="flex-1 w-full bg-white relative">
                    <iframe id="appFrame" src="" class="absolute inset-0 w-full h-full border-0 bg-white"></iframe>
                    <div id="loadingOverlay" class="absolute inset-0 bg-slate-50 flex flex-col items-center justify-center z-20 hidden">
                        <i data-lucide="loader-2" class="w-6 h-6 text-indigo-500 animate-spin mb-3"></i>
                        <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Cargando aplicación...</p>
                    </div>
                </div>
                <div id="homeIndicator" class="h-5 w-full bg-black shrink-0 flex justify-center items-center">
                    <div class="w-1/4 h-1 bg-white/20 rounded-full"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const devices = {
            iphone14: { width: 393, height: 852, borderRadius: '3.2rem', borderWidth: '12px', hasNotch: true },
            pixel7: { width: 412, height: 915, borderRadius: '2.5rem', borderWidth: '10px', hasNotch: false },
            ipad: { width: 768, height: 1024, borderRadius: '1.5rem', borderWidth: '18px', hasNotch: false },
            responsive: { width: '100%', height: '100%', borderRadius: '0', borderWidth: '0', hasNotch: false }
        };

        let isLandscape = false;
        let isMenuVisible = true;
        let currentDeviceKey = 'iphone14';
        let lastDeviceKey = 'iphone14';
        let currentZoom = 1.0;
        let isConsoleOpen = false;

        let consWidth = parseInt(localStorage.getItem('eruda-width')) || 450;
        let consHeight = parseInt(localStorage.getItem('eruda-height')) || 300;

        const frame = document.getElementById('appFrame');
        const urlInput = document.getElementById('urlInput');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const container = document.getElementById('deviceContainer');
        const wrapper = document.getElementById('deviceWrapper');
        const workspace = document.getElementById('workspace');
        const zoomLabel = document.getElementById('zoomLabel');
        const rotateIcon = document.getElementById('rotateIcon');
        const notch = document.getElementById('notch');
        const statusBar = document.getElementById('statusBar');
        const homeIndicator = document.getElementById('homeIndicator');
        const deviceSelector = document.getElementById('deviceSelector');
        const mainHeader = document.getElementById('mainHeader');
        const btnShowMenu = document.getElementById('btnShowMenu');
        const toastCors = document.getElementById('toastCors');
        const consolePositionSelector = document.getElementById('consolePosition');
        const resizerBar = document.getElementById('console-resizer');

        // FUNCIÓN CLAVE: Centrado inteligente que respeta los scrollbars
        function updateCentering() {
            if (currentDeviceKey === 'responsive') {
                wrapper.style.margin = '0';
                return;
            }
            
            const availableW = workspace.clientWidth;
            const availableH = workspace.clientHeight;
            
            const wWrap = parseFloat(wrapper.style.width) || 0;
            const hWrap = parseFloat(wrapper.style.height) || 0;
            
            const mTop = hWrap <= availableH ? 'auto' : '0px';
            const mBottom = hWrap <= availableH ? 'auto' : '0px';
            const mLeft = wWrap <= availableW ? 'auto' : '0px';
            const mRight = wWrap <= availableW ? 'auto' : '0px';
            
            wrapper.style.margin = `${mTop} ${mRight} ${mBottom} ${mLeft}`;
        }

        // FUNCIÓN NUEVA: Auto-Ajustar al espacio disponible al instante
        function autoFit() {
            if (currentDeviceKey === 'responsive') {
                currentZoom = 1.0;
                applyZoom();
                return;
            }

            // Calculamos el espacio real que nos quedó luego de abrir/cerrar consola
            const availableW = workspace.clientWidth - 40; // 40px de respiro (20px por lado)
            const availableH = workspace.clientHeight - 40;
            
            const config = devices[currentDeviceKey];
            const w = isLandscape ? config.height : config.width;
            const h = isLandscape ? config.width : config.height;

            const scaleW = availableW / w;
            const scaleH = availableH / h;
            
            // Toma la escala más pequeña requerida para encajar perfectamente (tope de 100%)
            currentZoom = Math.min(scaleW, scaleH, 1.0);
            currentZoom = Math.max(0.1, currentZoom);
            
            applyZoom();
        }

        function updateWorkspaceLayout() {
            let l = 0, r = 0, b = 0;

            if (isConsoleOpen) {
                const pos = consolePositionSelector.value;
                if (pos === 'left') l = consWidth;
                else if (pos === 'right') r = consWidth;
                else if (pos === 'bottom') b = consHeight;
            }
            
            workspace.style.marginLeft = l + 'px';
            workspace.style.marginRight = r + 'px';
            workspace.style.marginBottom = b + 'px';
            
            setTimeout(autoFit, 10);
        }

        // INYECCIÓN DE ESTILOS EN EL SHADOW DOM DE ERUDA
        function applyErudaPosition(pos) {
            if (typeof eruda === 'undefined' || !eruda._isInit || !eruda._shadowRoot) return;
            
            let styleEl = eruda._shadowRoot.getElementById('custom-eruda-pos');
            if (!styleEl) {
                styleEl = document.createElement('style');
                styleEl.id = 'custom-eruda-pos';
                eruda._shadowRoot.appendChild(styleEl);
            }

            if (!isConsoleOpen) {
                resizerBar.classList.add('hidden');
            } else {
                resizerBar.classList.remove('hidden');
            }

            if (pos === 'left') {
                styleEl.innerHTML = `
                    .eruda-dev-tools {
                        top: 0 !important; bottom: 0 !important; left: 0 !important; right: auto !important;
                        width: ${consWidth}px !important; max-width: 90vw !important; height: 100% !important; max-height: none !important;
                        border-right: 1px solid #1e293b !important; resize: none !important; overflow: auto !important; transform: none !important;
                    }
                    .eruda-entry-btn { display: none !important; }
                `;
                resizerBar.style.cssText = `top: 0; bottom: 0; left: ${consWidth - 4}px; width: 8px; cursor: ew-resize; z-index: 9999;`;
            } else if (pos === 'right') {
                styleEl.innerHTML = `
                    .eruda-dev-tools {
                        top: 0 !important; bottom: 0 !important; right: 0 !important; left: auto !important;
                        width: ${consWidth}px !important; max-width: 90vw !important; height: 100% !important; max-height: none !important;
                        border-left: 1px solid #1e293b !important; resize: none !important; overflow: auto !important; transform: none !important;
                    }
                    .eruda-entry-btn { display: none !important; }
                `;
                resizerBar.style.cssText = `top: 0; bottom: 0; right: ${consWidth - 4}px; width: 8px; cursor: ew-resize; z-index: 9999;`;
            } else {
                styleEl.innerHTML = `
                     .eruda-dev-tools {
                        top: auto !important; bottom: 0 !important; left: 0 !important; right: 0 !important;
                        width: 100% !important; max-width: none !important; height: ${consHeight}px !important; max-height: 90vh !important;
                        border-top: 1px solid #1e293b !important; resize: none !important; transform: none !important;
                     }
                     .eruda-entry-btn { display: none !important; }
                `;
                resizerBar.style.cssText = `left: 0; right: 0; bottom: ${consHeight - 4}px; height: 8px; cursor: ns-resize; z-index: 9999;`;
            }
        }

        // LÓGICA DE DRAG & DROP
        let isDraggingCons = false;
        let dragStartPos = 0;
        let startSize = 0;

        resizerBar.addEventListener('mousedown', (e) => {
            isDraggingCons = true;
            document.body.style.userSelect = 'none'; 
            resizerBar.classList.add('bg-indigo-500'); 
            
            const pos = consolePositionSelector.value;
            if (pos === 'bottom') {
                dragStartPos = e.clientY;
                startSize = consHeight;
                document.body.style.cursor = 'ns-resize';
            } else {
                dragStartPos = e.clientX;
                startSize = consWidth;
                document.body.style.cursor = 'ew-resize';
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDraggingCons) return;
            
            const pos = consolePositionSelector.value;
            if (pos === 'bottom') {
                const delta = dragStartPos - e.clientY;
                consHeight = Math.max(150, Math.min(window.innerHeight - 80, startSize + delta));
            } else if (pos === 'left') {
                const delta = e.clientX - dragStartPos; 
                consWidth = Math.max(250, Math.min(window.innerWidth - 80, startSize + delta));
            } else if (pos === 'right') {
                const delta = dragStartPos - e.clientX; 
                consWidth = Math.max(250, Math.min(window.innerWidth - 80, startSize + delta));
            }
            
            applyErudaPosition(pos);
            updateWorkspaceLayout(); // Trigger autoFit dinámicamente al arrastrar
        });

        window.addEventListener('mouseup', () => {
            if (isDraggingCons) {
                isDraggingCons = false;
                document.body.style.userSelect = '';
                document.body.style.cursor = '';
                resizerBar.classList.remove('bg-indigo-500');
                
                localStorage.setItem('eruda-width', consWidth);
                localStorage.setItem('eruda-height', consHeight);
            }
        });

        function initEruda() {
            if (typeof eruda !== 'undefined') {
                try {
                    eruda.init({ tool: ['console', 'elements', 'network', 'resource'], useShadowDom: true, autoScale: false });
                    eruda.hide();
                    const currentPos = localStorage.getItem('eruda-position') || 'bottom';
                    consolePositionSelector.value = currentPos;
                    applyErudaPosition(currentPos);
                } catch (e) { console.warn("Eruda inicialización fallida."); }
            }
        }

        window.addEventListener('load', initEruda);
        
        window.addEventListener('resize', () => {
            updateWorkspaceLayout();
        });

        function toggleConsole() {
            if (typeof eruda !== 'undefined' && eruda._isInit) { 
                if(isConsoleOpen) {
                    eruda.hide();
                    isConsoleOpen = false;
                    consolePositionSelector.classList.add('hidden');
                } else {
                    eruda.show();
                    isConsoleOpen = true;
                    consolePositionSelector.classList.remove('hidden');
                }
                updateWorkspaceLayout();
                applyErudaPosition(consolePositionSelector.value);
            }
            else { alert("Eruda no disponible."); }
        }

        function changeConsolePosition() {
            if (typeof eruda !== 'undefined' && eruda._isInit) {
                const newPos = consolePositionSelector.value;
                localStorage.setItem('eruda-position', newPos);
                applyErudaPosition(newPos);
                updateWorkspaceLayout();
            }
        }

        function toggleMenu() {
            isMenuVisible = !isMenuVisible;
            if (isMenuVisible) {
                mainHeader.classList.remove('header-hidden');
                btnShowMenu.classList.add('opacity-0', 'pointer-events-none');
            } else {
                mainHeader.classList.add('header-hidden');
                btnShowMenu.classList.remove('opacity-0', 'pointer-events-none');
            }
            setTimeout(updateWorkspaceLayout, 350); // Recalcula el autoFit al ocultar menú
        }

        lucide.createIcons();

        // INYECCIÓN EN EL IFRAME
        frame.onload = () => {
            loadingOverlay.classList.add('hidden');
            
            try {
                const iframeWindow = frame.contentWindow;
                const iframeDoc = frame.contentDocument;
                if (!iframeDoc) throw new Error("CORS Blocked");

                const updateUrlBar = () => {
                    try {
                        const currentUrl = iframeWindow.location.href;
                        if (currentUrl && currentUrl !== 'about:blank') urlInput.value = currentUrl;
                    } catch(e) {}
                };

                updateUrlBar();
                iframeWindow.addEventListener('hashchange', updateUrlBar);
                iframeWindow.addEventListener('popstate', updateUrlBar);

                const originalPushState = iframeWindow.history.pushState;
                iframeWindow.history.pushState = function() {
                    originalPushState.apply(this, arguments);
                    updateUrlBar();
                };

                const originalReplaceState = iframeWindow.history.replaceState;
                iframeWindow.history.replaceState = function() {
                    originalReplaceState.apply(this, arguments);
                    updateUrlBar();
                };

                if (!('ontouchstart' in iframeWindow)) iframeWindow.ontouchstart = function() {};

                const createTouchEvt = (type, originalEvent) => {
                    let touchObj;
                    try {
                        touchObj = new iframeWindow.Touch({
                            identifier: Date.now(), target: originalEvent.target,
                            clientX: originalEvent.clientX, clientY: originalEvent.clientY,
                            screenX: originalEvent.screenX, screenY: originalEvent.screenY,
                            pageX: originalEvent.pageX, pageY: originalEvent.pageY
                        });
                    } catch(err) {
                        touchObj = { ...originalEvent, identifier: Date.now(), target: originalEvent.target };
                    }
                    try {
                        return new iframeWindow.TouchEvent(type, {
                            bubbles: true, cancelable: true, view: iframeWindow,
                            touches: type === 'touchend' ? [] : [touchObj],
                            targetTouches: type === 'touchend' ? [] : [touchObj],
                            changedTouches: [touchObj]
                        });
                    } catch(err) {
                        const evt = iframeDoc.createEvent('Event');
                        evt.initEvent(type, true, true);
                        evt.touches = type === 'touchend' ? [] : [touchObj];
                        evt.targetTouches = type === 'touchend' ? [] : [touchObj];
                        evt.changedTouches = [touchObj];
                        return evt;
                    }
                };

                iframeDoc.addEventListener('mousedown', (e) => e.target.dispatchEvent(createTouchEvt('touchstart', e)), true);
                iframeDoc.addEventListener('mouseup', (e) => e.target.dispatchEvent(createTouchEvt('touchend', e)), true);

                const consoleMethods = ['log', 'info', 'warn', 'error', 'debug'];
                consoleMethods.forEach(method => {
                    const originalConsoleMethod = iframeWindow.console[method];
                    iframeWindow.console[method] = function(...args) {
                        window.console[method]('[App]', ...args);
                        if (originalConsoleMethod) originalConsoleMethod.apply(iframeWindow.console, args);
                    };
                });

                iframeWindow.addEventListener('error', function(e) {
                    window.console.error('[App Error]', e.message, 'en', e.filename, 'línea', e.lineno);
                });

                toastCors.classList.add('hidden'); 
            } catch (err) {
                console.error("❌ Bloqueo CORS detectado.", err);
                toastCors.classList.remove('hidden');
            }
        };

        setInterval(() => {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            if(document.getElementById('clock')) document.getElementById('clock').innerText = timeStr;
        }, 1000);

        function updateZoom(delta) {
            if (currentDeviceKey === 'responsive') return;
            currentZoom = Math.max(0.1, Math.min(2, currentZoom + delta));
            applyZoom();
        }

        function resetZoom() {
            currentZoom = 1.0;
            applyZoom();
        }

        // LÓGICA PRINCIPAL DE ZOOM Y DIMENSIONES
        function applyZoom() {
            if (currentDeviceKey === 'responsive') {
                container.style.transform = 'none';
                wrapper.style.width = '100%';
                wrapper.style.height = '100%';
                wrapper.style.margin = '0';
            } else {
                const config = devices[currentDeviceKey];
                const w = isLandscape ? config.height : config.width;
                const h = isLandscape ? config.width : config.height;

                // Aplicamos la transformación SÓLO al dispositivo interno
                container.style.transform = `scale(${currentZoom})`;
                
                // Actualizamos el tamaño del Wrapper externo para que el navegador genere las barras de scroll
                wrapper.style.width = `${w * currentZoom}px`;
                wrapper.style.height = `${h * currentZoom}px`;
            }
            zoomLabel.innerText = Math.round(currentZoom * 100) + '%';
            
            updateCentering();
        }

        function navigateToUrl() {
            let url = urlInput.value.trim();
            if (!url) return; 
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'http://' + url;
                urlInput.value = url;
            }
            loadingOverlay.classList.remove('hidden');
            frame.src = url;
        }

        function refreshFrame() {
            if (frame.src && frame.src !== 'about:blank' && frame.src !== window.location.href) {
                loadingOverlay.classList.remove('hidden');
                frame.src = frame.src;
            }
        }

        function changeDevice() {
            currentDeviceKey = deviceSelector.value;
            if (currentDeviceKey !== 'responsive') lastDeviceKey = currentDeviceKey;
            applyDeviceStyles();
        }

        function toggleDeviceMode() {
            currentDeviceKey = (currentDeviceKey === 'responsive') ? lastDeviceKey : 'responsive';
            deviceSelector.value = currentDeviceKey;
            applyDeviceStyles();
        }

        function toggleRotation() {
            if (currentDeviceKey === 'responsive') return;
            isLandscape = !isLandscape;
            rotateIcon.style.transform = isLandscape ? 'rotate(90deg)' : 'rotate(0deg)';
            applyDeviceStyles();
        }

        function applyDeviceStyles() {
            const config = devices[currentDeviceKey];
            
            if (currentDeviceKey === 'responsive') {
                container.classList.add('mode-responsive');
                rotateIcon.classList.add('opacity-30');
                
                container.style.width = '100%';
                container.style.height = '100%';
            } else {
                container.classList.remove('mode-responsive');
                rotateIcon.classList.remove('opacity-30');
                
                const w = config.width;
                const h = config.height;

                container.style.width = isLandscape ? h + 'px' : w + 'px';
                container.style.height = isLandscape ? w + 'px' : h + 'px';
                container.style.borderRadius = config.borderRadius;
                container.style.borderWidth = config.borderWidth;

                if (config.hasNotch && !isLandscape) notch.classList.remove('hidden');
                else notch.classList.add('hidden');

                statusBar.classList.remove('hidden');
                homeIndicator.classList.remove('hidden');
            }
            
            updateWorkspaceLayout();
        }

        applyDeviceStyles();
        navigateToUrl();
    </script>
</body>
</html>
