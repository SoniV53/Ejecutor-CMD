<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConsoleFlow - Device Emulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        (function() {
            try {
                var originalWebSocket = window.WebSocket;
                if (originalWebSocket) {
                    Object.defineProperty(window, 'WebSocket', {
                        configurable: true,
                        enumerable: true,
                        get: function() { return originalWebSocket; },
                        set: function(v) { 
                            console.warn("Intento de sobrescritura de WebSocket detectado y bloqueado."); 
                        }
                    });
                }
            } catch (e) {}
        })();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617; /* Slate 950 */
            color: #f1f5f9;
            height: 100vh;
            width: 100vw;
            margin: 0;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.05) 0%, transparent 50%);
        }

        .code-font { font-family: 'Fira Code', monospace; }
        
        #workspace {
            display: flex;
            align-items: flex-start; 
            justify-content: flex-start; 
            overflow: auto;
            flex: 1;
            position: relative;
        }

        #deviceWrapper {
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
            margin: auto; 
            position: relative;
        }

        .device-mockup {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255,255,255,0.05);
            background: black;
            position: relative;
            transform-origin: top left; 
        }

        .mode-responsive {
            max-width: none !important;
            max-height: none !important;
            border-radius: 0 !important;
            border: 2px dashed #475569 !important;
            box-shadow: none !important;
            resize: both !important; 
            overflow: hidden !important;
            background: white !important;
            min-width: 250px;
            min-height: 250px;
            transform: none !important;
        }
        
        .mode-responsive > #notch,
        .mode-responsive > #statusBar,
        .mode-responsive > #homeIndicator {
            display: none !important;
        }

        .animate-slide-up { animation: slideUp 0.6s ease-out forwards; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* SCROLL INVISIBLE GLOBAL */
        * {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }
        *::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        #mainHeader { transition: transform 0.3s ease-in-out, margin-top 0.3s ease-in-out; }
        .header-hidden { transform: translateY(-100%); margin-top: -90px; }
        
        .dropdown-open { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .dropdown-closed { opacity: 0; transform: translateY(-10px); pointer-events: none; }

        #floatingConsoleBtn { transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s; }
        #floatingConsoleBtn:hover { transform: scale(1.1); }
        .console-active-btn {
            background-color: #4f46e5 !important;
            color: white !important;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4), 0 4px 6px -2px rgba(79, 70, 229, 0.2) !important;
        }
    </style>
</head>
<body class="flex flex-col h-screen relative">

    <div id="eruda-parent-container"></div>
    <div id="console-resizer" class="fixed z-[9999] hidden hover:bg-indigo-500/50 transition-colors"></div>

    <button id="floatingConsoleBtn" onclick="toggleConsole()" class="fixed bottom-6 left-6 z-[60] bg-slate-800 text-slate-400 p-3.5 rounded-full shadow-lg border border-slate-700 hover:text-white group">
        <i data-lucide="terminal-square" class="w-6 h-6 transition-transform group-hover:-translate-y-0.5"></i>
    </button>

    <!-- TOAST DE ALERTA DE ELECTRON -->
    <div id="toastElectron" class="fixed bottom-6 right-6 bg-[#0f172a] text-white p-5 rounded-2xl shadow-2xl z-[70] hidden border border-yellow-500/50 max-w-sm animate-slide-up">
        <h4 class="font-bold text-yellow-400 mb-2 flex items-center gap-2 text-sm">
            <i data-lucide="alert-triangle" class="w-5 h-5"></i> Requiere configuración de Electron
        </h4>
        <p class="text-xs text-slate-400 leading-relaxed">
            Se ha detectado Electron, pero la etiqueta webview falló. Asegúrate de agregar <code class="text-indigo-400 bg-indigo-500/10 px-1 rounded">webviewTag: true</code> en las <b>webPreferences</b> de tu <code class="text-indigo-400">main.js</code>.
        </p>
        <button onclick="document.getElementById('toastElectron').classList.add('hidden')" class="mt-4 w-full py-2 bg-yellow-500/10 hover:bg-yellow-500/20 text-yellow-400 rounded-lg text-xs font-bold transition-colors">
            Entendido
        </button>
    </div>
    
    <div id="toastMessage" class="fixed top-20 right-6 bg-slate-800 text-white p-4 rounded-xl shadow-2xl z-[70] hidden border border-slate-700 animate-slide-up transition-all">
        <div class="flex items-center gap-3">
            <i data-lucide="info" class="w-5 h-5 text-indigo-400"></i>
            <p id="toastText" class="text-sm text-slate-200"></p>
        </div>
    </div>

    <button id="btnShowMenu" onclick="toggleMenu()" class="fixed top-4 left-4 z-[60] bg-indigo-600 p-2.5 rounded-xl shadow-lg opacity-0 pointer-events-none transition-all">
        <i data-lucide="chevrons-down" class="text-white w-5 h-5"></i>
    </button>

    <header id="mainHeader" class="w-full border-b border-slate-900 bg-[#020617]/95 backdrop-blur-2xl z-50 shrink-0">
        <div class="px-4 md:px-6 py-3 flex flex-col gap-3">
            <div class="flex items-center justify-between gap-4">
                <div class="flex items-center gap-2 md:gap-4 shrink-0">
                    <button onclick="toggleMenu()" class="p-2 rounded-xl transition-all hover:bg-slate-800 text-slate-400 hover:text-white" title="Ocultar Menú">
                        <i data-lucide="chevrons-up" class="w-5 h-5"></i>
                    </button>
                    <a href="/" class="bg-indigo-600 p-2 rounded-xl shadow-lg hover:scale-105 transition-transform">
                        <i data-lucide="home" class="text-white w-5 h-5"></i>
                    </a>
                </div>

                <div class="flex-1 max-w-2xl flex items-center gap-2 relative">
                    <div class="relative w-full">
                        <input type="text" id="urlInput" value="" placeholder="http://localhost:8100" 
                            class="w-full bg-[#0f172a] border border-slate-800 rounded-xl pl-4 pr-10 py-2 text-sm code-font focus:outline-none focus:border-indigo-500 transition-all text-white"
                            onkeydown="if(event.key === 'Enter') navigateToUrl()"
                            onfocus="toggleHistory(true)"
                            onblur="setTimeout(() => toggleHistory(false), 200)">
                        
                        <button onclick="toggleHistory(true)" class="absolute right-2 top-1/2 -translate-y-1/2 p-1 text-slate-400 hover:text-white">
                            <i data-lucide="chevron-down" class="w-4 h-4"></i>
                        </button>

                        <div id="historyDropdown" class="absolute top-full left-0 right-0 mt-2 bg-[#0f172a] border border-slate-800 rounded-xl shadow-2xl z-50 transition-all duration-200 dropdown-closed overflow-hidden">
                            <div class="px-3 py-2 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
                                <span class="text-xs font-semibold text-slate-400">Historial Reciente</span>
                                <button onclick="clearHistory()" class="text-xs text-red-400 hover:text-red-300">Limpiar</button>
                            </div>
                            <ul id="historyList" class="max-h-48 overflow-y-auto"></ul>
                        </div>
                    </div>

                    <button onclick="navigateToUrl()" class="bg-indigo-600 hover:bg-indigo-500 text-white p-2 rounded-xl transition-colors shadow-lg shrink-0">
                        <i data-lucide="arrow-right" class="w-5 h-5"></i>
                    </button>
                    <button onclick="refreshFrame()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2 rounded-xl transition-colors border border-slate-700 shrink-0">
                        <i data-lucide="rotate-cw" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between gap-2 overflow-x-auto pb-1">
                <div class="flex items-center gap-1 bg-[#0f172a] p-1 rounded-xl border border-slate-800 shrink-0">
                    <button onclick="updateZoom(-0.1)" class="p-1.5 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition-colors">
                        <i data-lucide="zoom-out" class="w-4 h-4"></i>
                    </button>
                    <span id="zoomLabel" class="text-[10px] font-bold text-indigo-400 w-10 text-center">100%</span>
                    <button onclick="updateZoom(0.1)" class="p-1.5 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition-colors">
                        <i data-lucide="zoom-in" class="w-4 h-4"></i>
                    </button>
                    <div class="w-px h-4 bg-slate-700 mx-1"></div>
                    <button onclick="autoFit()" class="p-1.5 text-slate-400 hover:text-indigo-400 rounded-lg hover:bg-slate-800 transition-colors" title="Auto-Ajustar (Encajar)">
                        <i data-lucide="shrink" class="w-4 h-4"></i>
                    </button>
                    <button onclick="resetZoom()" class="p-1.5 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition-colors" title="Tamaño Original (100%)">
                        <i data-lucide="maximize" class="w-4 h-4"></i>
                    </button>
                </div>

                <div class="flex items-center gap-2 shrink-0 bg-[#0f172a] p-1 rounded-xl border border-slate-800">
                    <button onclick="toggleDeviceMode()" class="p-1.5 text-slate-400 hover:text-white" title="Alternar Modo">
                        <i data-lucide="smartphone-charging" class="w-4 h-4"></i>
                    </button>
                    <div class="w-px h-4 bg-slate-700"></div>
                    <select id="deviceSelector" onchange="changeDevice()" class="bg-transparent text-[10px] font-bold text-slate-300 outline-none px-2 py-1 cursor-pointer">
                        <option value="iphone14">iPhone 14 Pro</option>
                        <option value="pixel7">Pixel 7</option>
                        <option value="ipad">iPad Mini</option>
                        <option value="responsive">Responsive</option>
                    </select>
                    <div class="w-px h-4 bg-slate-700"></div>
                    <button onclick="toggleRotation()" id="btnRotate" class="p-1.5 text-slate-400 hover:text-white rounded-lg transition-all">
                        <i data-lucide="smartphone" class="w-4 h-4 transition-transform duration-300" id="rotateIcon"></i>
                    </button>
                </div>

                <div class="flex items-center gap-1">
                    <select id="consolePosition" onchange="changeConsolePosition()" class="bg-slate-800 text-[10px] font-bold text-slate-300 outline-none px-2 py-2 rounded-xl border border-slate-700 cursor-pointer">
                        <option value="left">Izquierda</option>
                        <option value="right">Derecha</option>
                        <option value="bottom">Abajo</option>
                    </select>
                    <button onclick="toggleConsole()" id="btnHeaderConsole" class="flex items-center gap-2 bg-slate-800 hover:bg-indigo-600/20 text-slate-300 hover:text-indigo-400 px-4 py-2 rounded-xl text-[10px] font-black uppercase transition-all border border-slate-700">
                        <i data-lucide="terminal" class="w-4 h-4"></i> <span id="devToolsLabel" class="hidden sm:inline">DevTools</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main id="workspace" class="bg-[#020617]">
        <div id="deviceWrapper" class="animate-slide-up">
            <div id="deviceContainer" class="device-mockup border-slate-900 rounded-[3rem] flex flex-col overflow-hidden w-[393px] h-[852px] border-[12px]">
                <div id="notch" class="absolute top-0 inset-x-0 h-6 bg-slate-900 rounded-b-2xl w-28 mx-auto z-10 flex justify-center items-end pb-1 gap-1.5">
                    <div class="w-10 h-1 bg-black rounded-full opacity-40"></div>
                    <div class="w-1 h-1 bg-black rounded-full opacity-40"></div>
                </div>
                <div id="statusBar" class="h-6 w-full bg-black text-white text-[9px] font-bold flex justify-between items-center px-6 shrink-0">
                    <span id="clock">9:41</span>
                    <div class="flex gap-1.5 items-center">
                        <i data-lucide="signal" class="w-2.5 h-2.5"></i>
                        <i data-lucide="wifi" class="w-2.5 h-2.5"></i>
                        <i data-lucide="battery-full" class="w-3 h-3"></i>
                    </div>
                </div>
                <div class="flex-1 w-full bg-white relative" id="frameContainer">
                    <!-- El frame (WebView o Iframe) se inyectará aquí mediante JavaScript -->
                    <div id="loadingOverlay" class="absolute inset-0 bg-slate-50 flex flex-col items-center justify-center z-20 hidden">
                        <i data-lucide="loader-2" class="w-6 h-6 text-indigo-500 animate-spin mb-3"></i>
                        <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Cargando aplicación...</p>
                    </div>
                </div>
                <div id="homeIndicator" class="h-5 w-full bg-black shrink-0 flex justify-center items-center">
                    <div class="w-1/4 h-1 bg-white/20 rounded-full"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- DETECCIÓN DE ENTORNO ELECTRON ---
        const isElectron = window.navigator.userAgent.toLowerCase().includes('electron');
        let appFrame; 
        
        const devices = {
            iphone14: { width: 393, height: 852, borderRadius: '3.2rem', borderWidth: '12px', hasNotch: true },
            pixel7: { width: 412, height: 915, borderRadius: '2.5rem', borderWidth: '10px', hasNotch: false },
            ipad: { width: 768, height: 1024, borderRadius: '1.5rem', borderWidth: '18px', hasNotch: false },
            responsive: { width: '100%', height: '100%', borderRadius: '0', borderWidth: '0', hasNotch: false }
        };

        let isLandscape = false;
        let isMenuVisible = true;
        let currentDeviceKey = 'iphone14';
        let lastDeviceKey = 'iphone14';
        let currentZoom = 1.0;
        let isConsoleOpen = false;

        let consWidth = parseInt(localStorage.getItem('eruda-width')) || 450;
        let consHeight = parseInt(localStorage.getItem('eruda-height')) || 300;

        const urlInput = document.getElementById('urlInput');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const container = document.getElementById('deviceContainer');
        const wrapper = document.getElementById('deviceWrapper');
        const workspace = document.getElementById('workspace');
        const zoomLabel = document.getElementById('zoomLabel');
        const rotateIcon = document.getElementById('rotateIcon');
        const notch = document.getElementById('notch');
        const statusBar = document.getElementById('statusBar');
        const homeIndicator = document.getElementById('homeIndicator');
        const deviceSelector = document.getElementById('deviceSelector');
        const mainHeader = document.getElementById('mainHeader');
        const btnShowMenu = document.getElementById('btnShowMenu');
        const consolePositionSelector = document.getElementById('consolePosition');
        const resizerBar = document.getElementById('console-resizer');
        const historyDropdown = document.getElementById('historyDropdown');
        const historyList = document.getElementById('historyList');
        const floatingConsoleBtn = document.getElementById('floatingConsoleBtn');
        const btnHeaderConsole = document.getElementById('btnHeaderConsole');
        const erudaParentContainer = document.getElementById('eruda-parent-container');
        const frameContainer = document.getElementById('frameContainer');
        const devToolsLabel = document.getElementById('devToolsLabel');

        // ==========================================
        // INICIALIZACIÓN DEL FRAME (HÍBRIDO: WEBVIEW vs IFRAME)
        // ==========================================
        function initAppFrame() {
            if (isElectron) {
                // Modo Profesional: Electron con Native DevTools
                appFrame = document.createElement('webview');
                appFrame.setAttribute('allowpopups', 'true');
                devToolsLabel.innerText = "Native DevTools";
                // En webview la posición la maneja Chrome nativo, ocultamos selector
                consolePositionSelector.classList.add('hidden'); 
            } else {
                // Fallback: Web Canvas con Iframe y Eruda
                appFrame = document.createElement('iframe');
            }
            
            appFrame.id = "appFrame";
            appFrame.className = "absolute inset-0 w-full h-full border-0 bg-white z-10";
            frameContainer.appendChild(appFrame);

            // Escuchadores de carga
            if (isElectron) {
                appFrame.addEventListener('did-start-loading', () => loadingOverlay.classList.remove('hidden'));
                
                // NUEVO: Inyectamos CSS directamente al webview para ocultar su scroll interno
                appFrame.addEventListener('dom-ready', () => {
                    appFrame.insertCSS(`
                        *::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
                        * { -ms-overflow-style: none !important; scrollbar-width: none !important; }
                    `);
                });

                appFrame.addEventListener('did-stop-loading', () => {
                    loadingOverlay.classList.add('hidden');
                    urlInput.value = appFrame.getURL();
                });
                appFrame.addEventListener('did-fail-load', () => {
                    document.getElementById('toastElectron').classList.remove('hidden');
                });
            } else {
                appFrame.onload = handleIframeOnLoad;
            }
        }

        // ==========================================
        // LÓGICA DE HISTORIAL 
        // ==========================================
        const HistoryAPI = {
            async getFullData() {
                try {
                    const response = await fetch('/data');
                    if (!response.ok) throw new Error("Error de red");
                    return await response.json();
                } catch (e) {
                    return { 
                        history: JSON.parse(localStorage.getItem('temp_history')) || [],
                        projects: [], commands: [], categories: [] 
                    };
                }
            },
            async get() {
                const data = await this.getFullData();
                return data.history || [];
            },
            async save(url) {
                const data = await this.getFullData();
                let history = data.history || [];
                history = history.filter(item => item !== url);
                history.unshift(url);
                if(history.length > 15) history.pop();
                data.history = history;

                try {
                    await fetch('/data', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data, null, 2) });
                } catch (e) {
                    localStorage.setItem('temp_history', JSON.stringify(history));
                }
                return history;
            }
        };

        async function renderHistoryList() {
            const history = await HistoryAPI.get();
            historyList.innerHTML = '';
            if(history.length === 0) {
                historyList.innerHTML = '<li class="px-4 py-3 text-sm text-slate-500 italic text-center">No hay búsquedas recientes</li>';
                return;
            }
            history.forEach(url => {
                const li = document.createElement('li');
                li.className = 'px-4 py-2.5 text-sm text-slate-300 hover:bg-indigo-600/20 hover:text-white cursor-pointer border-b border-slate-800/50 last:border-0 truncate flex items-center gap-2 transition-colors';
                li.innerHTML = `<i data-lucide="globe" class="w-3.5 h-3.5 opacity-50"></i> ${url}`;
                li.onclick = () => { urlInput.value = url; navigateToUrl(); };
                historyList.appendChild(li);
            });
            lucide.createIcons();
        }

        function toggleHistory(show) {
            if(show) {
                renderHistoryList();
                historyDropdown.classList.remove('dropdown-closed');
                historyDropdown.classList.add('dropdown-open');
            } else {
                historyDropdown.classList.remove('dropdown-open');
                historyDropdown.classList.add('dropdown-closed');
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toastMessage');
            document.getElementById('toastText').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => { toast.classList.add('hidden'); }, 3000);
        }

        function updateCentering() {
            if (currentDeviceKey === 'responsive') { 
                wrapper.style.margin = '0'; 
                return; 
            }
            // MODIFICADO: Lógica estricta de centrado con Flexbox/Auto-margins según espacio disponible
            const availableW = workspace.clientWidth;
            const availableH = workspace.clientHeight;
            
            const wWrap = parseFloat(wrapper.style.width) || 0;
            const hWrap = parseFloat(wrapper.style.height) || 0;
            
            const mTop = hWrap <= availableH ? 'auto' : '0px';
            const mBottom = hWrap <= availableH ? 'auto' : '0px';
            const mLeft = wWrap <= availableW ? 'auto' : '0px';
            const mRight = wWrap <= availableW ? 'auto' : '0px';
            
            wrapper.style.margin = `${mTop} ${mRight} ${mBottom} ${mLeft}`;
        }

        function autoFit() {
            if (currentDeviceKey === 'responsive') { 
                currentZoom = 1.0; 
                applyZoom(); 
                return; 
            }
            const config = devices[currentDeviceKey];
            const scaleW = (workspace.clientWidth - 40) / (isLandscape ? config.height : config.width);
            const scaleH = (workspace.clientHeight - 40) / (isLandscape ? config.width : config.height);
            currentZoom = Math.max(0.1, Math.min(scaleW, scaleH, 1.0));
            applyZoom();
        }

        function updateWorkspaceLayout() {
            let l = 0, r = 0, b = 0;
            if (isConsoleOpen && !isElectron) { // Resizer solo aplica a Eruda (iframe)
                const pos = consolePositionSelector.value;
                if (pos === 'left') l = consWidth;
                else if (pos === 'right') r = consWidth;
                else if (pos === 'bottom') b = consHeight;
            }
            workspace.style.marginLeft = l + 'px';
            workspace.style.marginRight = r + 'px';
            workspace.style.marginBottom = b + 'px';
            
            // Usar requestAnimationFrame asegura que los márgenes se calculen DESPUÉS de que el DOM asimiló el cambio
            requestAnimationFrame(() => {
                updateCentering();
            });
        }

        // ==========================================
        // DISEÑO Y LÓGICA DE ERUDA (SOLO PARA IFRAME)
        // ==========================================
        function updateFloatingButtonPos() {
            if (isElectron) return; // En Electron el botón no se mueve
            if (!isConsoleOpen) {
                floatingConsoleBtn.style.left = '1.5rem'; floatingConsoleBtn.style.right = 'auto'; floatingConsoleBtn.style.bottom = '1.5rem';
                return;
            }
            const pos = consolePositionSelector.value;
            if (pos === 'left') { floatingConsoleBtn.style.left = `calc(${consWidth}px + 1.5rem)`; floatingConsoleBtn.style.right = 'auto'; floatingConsoleBtn.style.bottom = '1.5rem'; } 
            else if (pos === 'right') { floatingConsoleBtn.style.right = `calc(${consWidth}px + 1.5rem)`; floatingConsoleBtn.style.left = 'auto'; floatingConsoleBtn.style.bottom = '1.5rem'; } 
            else if (pos === 'bottom') { floatingConsoleBtn.style.left = '1.5rem'; floatingConsoleBtn.style.right = 'auto'; floatingConsoleBtn.style.bottom = `calc(${consHeight}px + 1.5rem)`; }
        }

        function applyErudaPosition(pos) {
            if (isElectron) return;
            const currentEruda = appFrame.contentWindow ? appFrame.contentWindow.eruda : null;
            if (!currentEruda || !currentEruda._isInit || !currentEruda._shadowRoot) return;
            
            let styleEl = currentEruda._shadowRoot.getElementById('custom-eruda-pos');
            if (!styleEl) { styleEl = document.createElement('style'); styleEl.id = 'custom-eruda-pos'; currentEruda._shadowRoot.appendChild(styleEl); }

            if (!isConsoleOpen) resizerBar.classList.add('hidden');
            else resizerBar.classList.remove('hidden');

            const devToolsThemeCSS = `
                /* Base y fondo */
                .eruda-dev-tools { background-color: #ffffff !important; color: #333333 !important; }
                /* Iconos arreglados explícitamente */
                .eruda-icon { font-family: 'eruda-icon' !important; font-style: normal !important; }
                .eruda-entry-btn { display: none !important; }
                
                /* Barra de navegación */
                .eruda-nav-bar { background-color: #ffffff !important; border-bottom: 1px solid #e2e8f0 !important; }
                .eruda-nav-bar .eruda-nav-bar-item { color: #475569 !important; font-size: 13px !important; }
                .eruda-nav-bar .eruda-active { color: #4f46e5 !important; border-bottom: 2px solid #4f46e5 !important; }

                /* FORZANDO MODO SPLIT VIEW CORRECTAMENTE */
                .eruda-elements { display: flex !important; flex-direction: column !important; height: 100% !important; }
                .eruda-elements .eruda-dom-tree { display: block !important; flex: 1 1 50% !important; height: 50% !important; overflow-y: auto !important; }
                
                /* Las propiedades deben mostrarse estáticas debajo */
                .eruda-elements .eruda-style-wrapper {
                    display: block !important;
                    position: static !important;
                    flex: 1 1 50% !important;
                    height: 50% !important;
                    transform: none !important;
                    border-top: 2px solid #cbd5e1 !important;
                    background: #f8fafc !important;
                    overflow-y: auto !important;
                }
                .eruda-style-wrapper .eruda-back { display: none !important; }

                /* Colores Chrome */
                .eruda-tag-name { color: #881280 !important; }
                .eruda-attribute-name { color: #994500 !important; }
                .eruda-attribute-value { color: #1a1aa6 !important; }
            `;

            let positionCSS = '';
            if (pos === 'left') {
                positionCSS = `.eruda-dev-tools { top: 0 !important; bottom: 0 !important; left: 0 !important; right: auto !important; width: ${consWidth}px !important; position: fixed !important; border-right: 1px solid #cbd5e1 !important; border-left: none !important; border-top: none !important; border-bottom: none !important; }`;
                resizerBar.style.cssText = `top: 0; bottom: 0; left: ${consWidth - 4}px; width: 8px; cursor: ew-resize; z-index: 9999;`;
            } else if (pos === 'right') {
                positionCSS = `.eruda-dev-tools { top: 0 !important; bottom: 0 !important; right: 0 !important; left: auto !important; width: ${consWidth}px !important; position: fixed !important; border-left: 1px solid #cbd5e1 !important; border-right: none !important; border-top: none !important; border-bottom: none !important; }`;
                resizerBar.style.cssText = `top: 0; bottom: 0; right: ${consWidth - 4}px; width: 8px; cursor: ew-resize; z-index: 9999;`;
            } else {
                positionCSS = `.eruda-dev-tools { top: auto !important; bottom: 0 !important; left: 0 !important; right: 0 !important; height: ${consHeight}px !important; width: 100% !important; position: fixed !important; border-top: 1px solid #cbd5e1 !important; border-bottom: none !important; border-left: none !important; border-right: none !important; }`;
                resizerBar.style.cssText = `left: 0; right: 0; bottom: ${consHeight - 4}px; height: 8px; cursor: ns-resize; z-index: 9999;`;
            }

            styleEl.innerHTML = devToolsThemeCSS + positionCSS;
            updateFloatingButtonPos(); 
        }

        resizerBar.addEventListener('mousedown', (e) => {
            isDraggingCons = true; document.body.style.userSelect = 'none'; resizerBar.classList.add('bg-indigo-400');
            const pos = consolePositionSelector.value;
            dragStartPos = pos === 'bottom' ? e.clientY : e.clientX;
            startSize = pos === 'bottom' ? consHeight : consWidth;
            document.body.style.cursor = pos === 'bottom' ? 'ns-resize' : 'ew-resize';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDraggingCons) return;
            const pos = consolePositionSelector.value;
            if (pos === 'bottom') consHeight = Math.max(150, Math.min(window.innerHeight - 80, startSize + (dragStartPos - e.clientY)));
            else if (pos === 'left') consWidth = Math.max(250, Math.min(window.innerWidth - 80, startSize + (e.clientX - dragStartPos)));
            else if (pos === 'right') consWidth = Math.max(250, Math.min(window.innerWidth - 80, startSize + (dragStartPos - e.clientX)));
            applyErudaPosition(pos); updateWorkspaceLayout(); updateFloatingButtonPos(); 
        });

        window.addEventListener('mouseup', () => {
            if (isDraggingCons) {
                isDraggingCons = false; document.body.style.userSelect = ''; document.body.style.cursor = ''; resizerBar.classList.remove('bg-indigo-400');
                localStorage.setItem('eruda-width', consWidth); localStorage.setItem('eruda-height', consHeight);
            }
        });

        // ==========================================
        // CONTROL GLOBAL DE LA CONSOLA (ELECTRON O IFRAME)
        // ==========================================
        function toggleConsole() {
            if (isElectron) {
                // Modo NATIVO (Electron WebView)
                if(isConsoleOpen) {
                    appFrame.closeDevTools();
                    isConsoleOpen = false;
                    btnHeaderConsole.classList.remove('bg-indigo-600/20', 'text-indigo-400');
                    floatingConsoleBtn.classList.remove('console-active-btn');
                } else {
                    appFrame.openDevTools();
                    isConsoleOpen = true;
                    btnHeaderConsole.classList.add('bg-indigo-600/20', 'text-indigo-400');
                    floatingConsoleBtn.classList.add('console-active-btn');
                }
            } else {
                // Modo FALLBACK (Web Eruda)
                const currentEruda = appFrame.contentWindow ? appFrame.contentWindow.eruda : null;
                if (currentEruda && currentEruda._isInit) { 
                    if(isConsoleOpen) {
                        currentEruda.hide();
                        isConsoleOpen = false;
                        btnHeaderConsole.classList.remove('bg-indigo-600/20', 'text-indigo-400');
                        floatingConsoleBtn.classList.remove('console-active-btn');
                    } else {
                        currentEruda.show();
                        isConsoleOpen = true;
                        btnHeaderConsole.classList.add('bg-indigo-600/20', 'text-indigo-400');
                        floatingConsoleBtn.classList.add('console-active-btn');
                    }
                    updateWorkspaceLayout();
                    applyErudaPosition(consolePositionSelector.value);
                } else { showToast("Consola cargando o no disponible."); }
            }
        }

        function changeConsolePosition() {
            if (isElectron) return;
            const newPos = consolePositionSelector.value;
            localStorage.setItem('eruda-position', newPos);
            applyErudaPosition(newPos);
            updateWorkspaceLayout();
        }

        function toggleMenu() {
            isMenuVisible = !isMenuVisible;
            if (isMenuVisible) { mainHeader.classList.remove('header-hidden'); btnShowMenu.classList.add('opacity-0', 'pointer-events-none'); } 
            else { mainHeader.classList.add('header-hidden'); btnShowMenu.classList.remove('opacity-0', 'pointer-events-none'); }
            setTimeout(updateWorkspaceLayout, 350);
        }

        lucide.createIcons();

        // ==========================================
        // INYECCIÓN DE ERUDA EN IFRAME (SOLO SI NO ES ELECTRON)
        // ==========================================
        function handleIframeOnLoad() {
            loadingOverlay.classList.add('hidden');
            erudaParentContainer.innerHTML = ''; 
            
            try {
                const iframeWindow = appFrame.contentWindow;
                const iframeDoc = appFrame.contentDocument;
                if (!iframeDoc) throw new Error("CORS Blocked");

                const updateUrlBar = () => { try { if (iframeWindow.location.href !== 'about:blank') urlInput.value = iframeWindow.location.href; } catch(e) {} };
                updateUrlBar();
                iframeWindow.addEventListener('hashchange', updateUrlBar);
                iframeWindow.addEventListener('popstate', updateUrlBar);

                const script = iframeDoc.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/eruda';
                iframeDoc.head.appendChild(script);

                script.onload = () => {
                    if(iframeWindow.eruda) {
                        iframeWindow.eruda.init({ container: erudaParentContainer, tool: ['console', 'elements', 'network', 'resource'], useShadowDom: true });
                        setTimeout(() => {
                            applyErudaPosition(consolePositionSelector.value || 'left');
                            if(isConsoleOpen) iframeWindow.eruda.show(); else iframeWindow.eruda.hide();
                        }, 500);
                    }
                };

                const isErudaSelectActive = () => {
                    try { return !!iframeWindow.eruda._shadowRoot.querySelector('.eruda-select.eruda-active'); } catch(e) { return false; }
                };

                const createTouchEvt = (type, e) => {
                    let t; try { t = new iframeWindow.Touch({ identifier: Date.now(), target: e.target, clientX: e.clientX, clientY: e.clientY }); } 
                    catch(err) { t = { ...e, identifier: Date.now(), target: e.target }; }
                    try { return new iframeWindow.TouchEvent(type, { bubbles: true, touches: type==='touchend'?[]:[t], changedTouches: [t] }); } 
                    catch(err) { const evt = iframeDoc.createEvent('Event'); evt.initEvent(type, true, true); return evt; }
                };

                iframeDoc.addEventListener('mousedown', (e) => { if (!isErudaSelectActive()) e.target.dispatchEvent(createTouchEvt('touchstart', e)); }, true);
                iframeDoc.addEventListener('mouseup', (e) => { if (!isErudaSelectActive()) e.target.dispatchEvent(createTouchEvt('touchend', e)); }, true);
                
                // Reenvio de logs al main
                ['log', 'info', 'warn', 'error'].forEach(m => iframeWindow.console[m] = function(...a) { window.console[m].apply(window.console, a); });

            } catch (err) {
                console.error("CORS Bloqueado.");
            }
        }

        setInterval(() => {
            const now = new Date();
            if(document.getElementById('clock')) document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }, 1000);

        function updateZoom(delta) {
            if (currentDeviceKey === 'responsive') return;
            // Al hacer zoom manual, también recalcula desde la escala base limpia.
            currentZoom = Math.max(0.1, Math.min(2, currentZoom + delta));
            applyZoom();
        }
        
        function resetZoom() { 
            currentZoom = 1.0; 
            applyZoom(); 
        }

        function applyZoom() {
            if (currentDeviceKey === 'responsive') {
                container.style.transform = 'none'; 
                wrapper.style.width = '100%'; 
                wrapper.style.height = '100%'; 
                if(isElectron) appFrame.setZoomFactor(1);
            } else {
                const config = devices[currentDeviceKey];
                const w = isLandscape ? config.height : config.width;
                const h = isLandscape ? config.width : config.height;
                
                // Aplicar escala CSS
                container.style.transform = `scale(${currentZoom})`;
                
                // Ajustar el contenedor para reflejar el tamaño escalado
                wrapper.style.width = `${w * currentZoom}px`;
                wrapper.style.height = `${h * currentZoom}px`;
                
                if(isElectron && appFrame.setZoomFactor) appFrame.setZoomFactor(currentZoom); // En electron usamos zoom nativo interno!
            }
            zoomLabel.innerText = Math.round(currentZoom * 100) + '%';
            
            // Recalcular el centrado después de escalar
            updateCentering();
        }

        async function navigateToUrl() {
            let url = urlInput.value.trim();
            if (!url) return; 
            if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'http://' + url;
            
            await HistoryAPI.save(url);
            loadingOverlay.classList.remove('hidden');
            appFrame.src = url;
            toggleHistory(false);
        }

        function refreshFrame() {
            if (appFrame.src) {
                loadingOverlay.classList.remove('hidden');
                if (isElectron) appFrame.reload(); else appFrame.src = appFrame.src;
            }
        }

        function changeDevice() { 
            currentDeviceKey = deviceSelector.value; 
            if (currentDeviceKey !== 'responsive') {
                lastDeviceKey = currentDeviceKey; 
            }
            // MODIFICADO: Resetear zoom a 1 para asegurar un cambio limpio sin "friqueos" residuales
            currentZoom = 1.0;
            applyDeviceStyles(); 
            // Forzar un "auto-fit" (si es necesario) pero partiendo de una escala base limpia 1.0
            autoFit();
        }
        
        function toggleDeviceMode() { 
            currentDeviceKey = (currentDeviceKey === 'responsive') ? lastDeviceKey : 'responsive'; 
            deviceSelector.value = currentDeviceKey; 
            
            // MODIFICADO: Alterne entre modos necesita reinicio limpio de escala
            currentZoom = 1.0;
            applyDeviceStyles(); 
            
            if(currentDeviceKey !== 'responsive') {
                autoFit();
            }
        }
        
        function toggleRotation() { 
            if (currentDeviceKey === 'responsive') return; 
            isLandscape = !isLandscape; 
            rotateIcon.style.transform = isLandscape ? 'rotate(90deg)' : 'rotate(0deg)'; 
            
            // MODIFICADO: Reiniciar escala al rotar para evitar deformaciones
            currentZoom = 1.0;
            applyDeviceStyles(); 
            autoFit();
        }

        function applyDeviceStyles() {
            const config = devices[currentDeviceKey];
            if (currentDeviceKey === 'responsive') {
                container.classList.add('mode-responsive'); 
                rotateIcon.classList.add('opacity-30');
                
                // Elimina tamaños fijos
                container.style.width = '100%'; 
                container.style.height = '100%';
                wrapper.style.width = '100%';
                wrapper.style.height = '100%';
                container.style.transform = 'none';
                
            } else {
                container.classList.remove('mode-responsive'); 
                rotateIcon.classList.remove('opacity-30');
                
                const w = config.width, h = config.height;
                // Establece dimensiones base reales (sin zoom aplicado todavía)
                container.style.width = isLandscape ? h + 'px' : w + 'px'; 
                container.style.height = isLandscape ? w + 'px' : h + 'px';
                container.style.borderRadius = config.borderRadius; 
                container.style.borderWidth = config.borderWidth;
                
                if (config.hasNotch && !isLandscape) notch.classList.remove('hidden'); 
                else notch.classList.add('hidden');
                
                statusBar.classList.remove('hidden'); 
                homeIndicator.classList.remove('hidden');
            }
            
            // Usar requestAnimationFrame para garantizar que el DOM ya tiene las nuevas dimensiones
            requestAnimationFrame(() => {
                updateWorkspaceLayout();
            });
        }

        window.addEventListener('load', () => {
            initAppFrame();
            const savedPos = localStorage.getItem('eruda-position') || 'left';
            consolePositionSelector.value = savedPos;
            renderHistoryList(); 
            applyDeviceStyles();
            if(urlInput.value) navigateToUrl();
        });
        
        window.addEventListener('resize', () => { 
            updateWorkspaceLayout(); 
            updateFloatingButtonPos(); 
        });

    </script>
</body>
</html>
