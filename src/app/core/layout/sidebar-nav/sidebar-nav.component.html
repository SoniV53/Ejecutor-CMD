<nav class="w-16 h-full bg-[#0a0f1d] border-r border-slate-800 flex flex-col items-center py-6 gap-4 z-50 shrink-0 select-none">
  <a
    routerLink="/hub"
    class="mb-2 text-indigo-500 font-black text-xl tracking-tighter hover:text-indigo-400 transition-colors"
    title="ConsoleFlow Hub"
  >
    CF
  </a>

  <div class="flex-1 flex flex-col items-center gap-4 overflow-y-auto no-scrollbar w-full">
    <a
      *ngFor="let item of navItems; trackBy: trackByRoute"
      [routerLink]="item.route"
      routerLinkActive="nav-active"
      class="nav-btn p-3 rounded-xl hover:bg-slate-800 text-slate-400 flex items-center justify-center shrink-0"
      [title]="item.title"
    >
      <i [attr.data-lucide]="item.icon"></i>
    </a>
  </div>

  <!-- Botón de Configuraciones fijo en la parte inferior -->
  <div class="pt-3 border-t border-slate-800/80 w-full flex justify-center">
    <a
      routerLink="/configuraciones"
      routerLinkActive="nav-active"
      class="nav-btn p-3 rounded-xl hover:bg-slate-800 text-slate-400 flex items-center justify-center"
      title="Configuraciones"
    >
      <i data-lucide="settings"></i>
    </a>
  </div>
</nav>
