<!-- Overlay para móvil cuando el sidebar está abierto -->
<div
  *ngIf="showSidebar"
  class="fixed inset-0 bg-black/60 z-40 lg:hidden backdrop-blur-sm no-print"
  (click)="closeSidebar.emit()"
></div>

<!-- SIDEBAR (Izquierdo) -->
<aside
  class="fixed lg:relative z-50 h-full w-80 bg-slate-900 border-r border-slate-800 flex flex-col shrink-0 no-print transition-transform duration-300 ease-out"
  [ngClass]="showSidebar ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'"
>
  <div class="p-6 border-b border-slate-800 flex justify-between items-center gap-2">
    <div class="flex items-center gap-3">
      <a
        routerLink="/hub"
        title="Volver al Hub"
        class="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white transition-colors border border-slate-700/60"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </a>
      <h1 class="text-xl font-black flex items-center gap-2 text-blue-500">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="16" width="6" height="6" rx="1"/>
          <rect x="9" y="2" width="6" height="6" rx="1"/>
          <rect x="2" y="16" width="6" height="6" rx="1"/>
          <rect x="16" y="16" width="6" height="6" rx="1"/>
          <path d="M12 8v4"/>
          <path d="M12 12H5v4"/>
          <path d="M12 12h7v4"/>
        </svg>
        CISCO PRO
      </h1>
    </div>
    <button
      type="button"
      class="lg:hidden text-slate-400 hover:text-white"
      (click)="closeSidebar.emit()"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <div class="p-4 flex flex-col gap-6 overflow-y-auto flex-1 scrollbar-hide">
    <!-- Topologías / Plantillas -->
    <div>
      <p class="text-[10px] font-bold text-slate-500 uppercase px-2 mb-3 tracking-[0.2em]">
        Topologías / Plantillas
      </p>
      <div class="space-y-2">
        <button
          type="button"
          (click)="selectTemplate.emit('subinterfaces')"
          class="w-full flex items-center gap-3 p-3 bg-blue-600/10 border border-blue-500/30 rounded-xl hover:bg-blue-600/20 transition-all text-left"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-400 shrink-0">
            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
          <div>
            <span class="text-[11px] font-bold block leading-tight text-slate-100">Subinterfaces (PDF 1)</span>
            <span class="text-[9px] text-slate-500 uppercase">Dot1Q + VLANs</span>
          </div>
        </button>

        <button
          type="button"
          (click)="selectTemplate.emit('static_rip')"
          class="w-full flex items-center gap-3 p-3 bg-orange-600/10 border border-orange-500/30 rounded-xl hover:bg-orange-600/20 transition-all text-left"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-orange-400 shrink-0">
            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
          <div>
            <span class="text-[11px] font-bold block leading-tight text-slate-100">Enrutamiento (PDF 2)</span>
            <span class="text-[9px] text-slate-500 uppercase">Rutas Estáticas / RIP</span>
          </div>
        </button>
      </div>
    </div>

    <!-- Componentes -->
    <div>
      <p class="text-[10px] font-bold text-slate-500 uppercase px-2 mb-2 tracking-[0.2em]">
        Componentes
      </p>
      <div class="grid grid-cols-3 gap-2">
        <button
          type="button"
          (click)="addNode.emit('pc')"
          class="flex flex-col items-center p-3 bg-slate-800 rounded-xl hover:bg-blue-600/20 transition-all text-slate-200"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          <span class="text-[9px] mt-2 font-bold">+ PC</span>
        </button>

        <button
          type="button"
          (click)="addNode.emit('switch')"
          class="flex flex-col items-center p-3 bg-slate-800 rounded-xl hover:bg-green-600/20 transition-all text-slate-200"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 16 4 4 4-4"/>
            <path d="M7 20V4"/>
            <path d="m21 8-4-4-4 4"/>
            <path d="M17 4v16"/>
          </svg>
          <span class="text-[9px] mt-2 font-bold">+ SW</span>
        </button>

        <button
          type="button"
          (click)="addNode.emit('router')"
          class="flex flex-col items-center p-3 bg-slate-800 rounded-xl hover:bg-orange-600/20 transition-all text-slate-200"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="14" width="20" height="8" rx="2"/>
            <circle cx="6" cy="18" r="1"/>
            <circle cx="10" cy="18" r="1"/>
            <path d="M2 10a8.5 8.5 0 0 1 20 0"/>
            <path d="M5 7a13.5 13.5 0 0 1 14 0"/>
          </svg>
          <span class="text-[9px] mt-2 font-bold">+ RT</span>
        </button>
      </div>
    </div>

    <!-- Nodos en Red -->
    <div>
      <p class="text-[10px] font-bold text-slate-500 uppercase px-2 mb-2 tracking-[0.2em]">
        Nodos en Red
      </p>
      <div class="space-y-2">
        <div
          *ngFor="let node of nodes"
          (click)="onNodeClick(node.id)"
          class="flex items-center justify-between p-3 rounded-xl cursor-pointer border transition-all"
          [ngClass]="
            selectedNodeId === node.id
              ? 'bg-blue-600/10 border-blue-500 shadow-lg shadow-blue-900/10'
              : 'bg-slate-800/50 border-slate-700 hover:border-slate-500'
          "
        >
          <div class="flex items-center gap-3">
            <div [ngClass]="selectedNodeId === node.id ? 'text-blue-400' : 'text-slate-400'">
              <svg *ngIf="node.type === 'pc'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2"/>
                <line x1="8" y1="21" x2="16" y2="21"/>
                <line x1="12" y1="17" x2="12" y2="21"/>
              </svg>
              <svg *ngIf="node.type === 'switch'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 16 4 4 4-4"/>
                <path d="M7 20V4"/>
                <path d="m21 8-4-4-4 4"/>
                <path d="M17 4v16"/>
              </svg>
              <svg *ngIf="node.type === 'router'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="14" width="20" height="8" rx="2"/>
                <circle cx="6" cy="18" r="1"/>
                <circle cx="10" cy="18" r="1"/>
                <path d="M2 10a8.5 8.5 0 0 1 20 0"/>
                <path d="M5 7a13.5 13.5 0 0 1 14 0"/>
              </svg>
            </div>
            <span class="text-xs font-bold text-slate-100">{{ node.name }}</span>
          </div>
          <button
            type="button"
            (click)="onDeleteClick($event, node.id)"
            class="text-slate-600 hover:text-red-500 transition-colors"
            title="Eliminar nodo"
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"/>
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
              <line x1="10" y1="11" x2="10" y2="17"/>
              <line x1="14" y1="11" x2="14" y2="17"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="p-4 border-t border-slate-800 flex flex-col gap-2 bg-slate-900/50">
    <div class="flex gap-2">
      <button
        type="button"
        (click)="saveJson.emit()"
        class="flex-1 py-2.5 bg-slate-800 rounded-lg text-[10px] font-bold uppercase hover:bg-blue-600 transition-all text-slate-100"
      >
        Guardar JSON
      </button>
      <button
        type="button"
        (click)="importInput.click()"
        class="flex-1 py-2.5 bg-slate-800 rounded-lg text-[10px] font-bold uppercase hover:bg-green-600 transition-all text-slate-100 flex items-center justify-center gap-1"
      >
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="inline">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        Importar JSON
      </button>
    </div>
    <button
      type="button"
      (click)="printPdf.emit()"
      class="w-full py-2.5 bg-slate-800 rounded-lg text-[10px] font-bold uppercase hover:bg-slate-700 transition-all text-slate-100"
    >
      Imprimir / PDF
    </button>
    <input
      #importInput
      type="file"
      class="hidden"
      accept=".json"
      (change)="onFileSelected($event)"
    />
  </div>
</aside>
