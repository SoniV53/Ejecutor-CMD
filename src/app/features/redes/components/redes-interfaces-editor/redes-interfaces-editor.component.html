<!-- Device Hostname Header + CLI Toggle Button -->
<div class="flex flex-col lg:flex-row lg:items-center justify-between mb-8 lg:mb-10 no-print gap-4">
  <div class="flex items-center gap-4 flex-1">
    <div class="p-3 bg-blue-600/10 rounded-2xl border border-blue-500/30 shrink-0 hidden lg:block">
      <!-- Router Icon -->
      <svg *ngIf="node.type === 'router'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-orange-400">
        <rect x="2" y="14" width="20" height="8" rx="2"/>
        <circle cx="6" cy="18" r="1"/>
        <circle cx="10" cy="18" r="1"/>
        <path d="M2 10a8.5 8.5 0 0 1 20 0"/>
        <path d="M5 7a13.5 13.5 0 0 1 14 0"/>
      </svg>
      <!-- Switch Icon -->
      <svg *ngIf="node.type === 'switch'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-green-400">
        <path d="m3 16 4 4 4-4"/>
        <path d="M7 20V4"/>
        <path d="m21 8-4-4-4 4"/>
        <path d="M17 4v16"/>
      </svg>
      <!-- PC Icon -->
      <svg *ngIf="node.type === 'pc'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-400">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
    </div>

    <div class="flex flex-col w-full max-w-sm">
      <label class="text-[8px] font-bold text-slate-500 uppercase tracking-widest mb-1 flex items-center gap-1">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
        Hostname (Editable)
      </label>
      <input
        type="text"
        [ngModel]="node.name"
        (ngModelChange)="onHostnameChange($event)"
        class="text-2xl lg:text-3xl font-black italic uppercase tracking-tighter bg-transparent border-b-2 border-transparent hover:border-slate-700 focus:border-blue-500 transition-colors outline-none text-slate-100 p-0 m-0 w-full"
        placeholder="NOMBRE_DISPOSITIVO"
      />
    </div>
  </div>

  <button
    type="button"
    (click)="toggleCli.emit()"
    class="hidden lg:flex items-center gap-2 bg-slate-800 border border-slate-700 px-4 py-2 rounded-xl text-[10px] font-bold uppercase hover:bg-slate-700 hover:text-white transition-all text-slate-400 shrink-0"
  >
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [ngClass]="showCli ? 'text-green-500' : ''">
      <polyline points="4 17 10 11 4 5"></polyline>
      <line x1="12" y1="19" x2="20" y2="19"></line>
    </svg>
    {{ showCli ? 'Ocultar CLI' : 'Mostrar CLI' }}
  </button>
</div>

<div class="space-y-6 lg:space-y-10">
  <!-- Section 1: Interfaces Físicas -->
  <section class="bg-slate-900/30 p-4 lg:p-6 rounded-3xl border border-slate-800/60 shadow-xl">
    <div class="flex justify-between items-center mb-6">
      <h3 class="text-[10px] font-black text-blue-500 uppercase tracking-[0.2em] flex items-center gap-2">
        <div class="w-1.5 h-1.5 rounded-full bg-blue-500 shadow-[0_0_8px_#3b82f6]"></div>
        Interfaces Físicas
      </h3>
      <button
        type="button"
        (click)="addInterface()"
        class="no-print text-[9px] font-bold bg-blue-600 text-white px-3 py-1.5 rounded-full uppercase hover:scale-105 active:scale-95 transition-all"
      >
        Añadir Puerto
      </button>
    </div>

    <div class="space-y-3">
      <div
        *ngFor="let int of node.properties.interfaces; let idx = index"
        class="flex flex-col lg:flex-row gap-3 bg-slate-950 p-4 rounded-2xl border border-slate-900 lg:items-end group hover:border-slate-700 transition-all"
      >
        <div class="w-full lg:w-20 shrink-0">
          <label class="text-[8px] font-bold text-slate-600 block mb-1 uppercase">Puerto</label>
          <input
            type="text"
            [(ngModel)]="int.name"
            (ngModelChange)="emitChange()"
            class="w-full bg-slate-900 border-none rounded p-2 lg:p-1.5 text-xs font-mono text-slate-100 outline-none"
          />
        </div>
        <div class="flex-1">
          <label class="text-[8px] font-bold text-slate-600 block mb-1 uppercase">IP</label>
          <input
            type="text"
            [(ngModel)]="int.ip"
            (ngModelChange)="emitChange()"
            class="w-full bg-slate-900 border-none rounded p-2 lg:p-1.5 text-xs font-mono text-slate-100 outline-none"
            placeholder="192.168.1.1"
          />
        </div>
        <div class="flex-1">
          <label class="text-[8px] font-bold text-slate-600 block mb-1 uppercase">Mask</label>
          <input
            type="text"
            [(ngModel)]="int.mask"
            (ngModelChange)="emitChange()"
            class="w-full bg-slate-900 border-none rounded p-2 lg:p-1.5 text-xs font-mono text-slate-100 outline-none"
            placeholder="255.255.255.0"
          />
        </div>
        <div class="flex-1">
          <label class="text-[8px] font-bold text-slate-600 block mb-1 uppercase tracking-tighter">Conectado a</label>
          <select
            [ngModel]="int.connectedTo || ''"
            (ngModelChange)="int.connectedTo = $event || null; emitChange()"
            class="w-full bg-slate-900 border-none rounded p-2 lg:p-1.5 text-xs text-slate-100 focus:ring-1 focus:ring-blue-500 outline-none"
          >
            <option value="">(Desconectado)</option>
            <option *ngFor="let n of otherNodes" [value]="n.id">{{ n.name }}</option>
          </select>
        </div>

        <div class="flex flex-row lg:flex-col items-center justify-between lg:justify-center w-full lg:w-10 mt-2 lg:mt-0 pt-2 lg:pt-0 border-t border-slate-800 lg:border-none shrink-0">
          <label
            class="text-[9px] lg:text-[6px] font-bold text-slate-500 lg:mb-1.5 uppercase tracking-tighter cursor-pointer text-center leading-none"
            title="Incluir en CLI"
          >
            En CLI
          </label>
          <button
            type="button"
            (click)="toggleInterfaceCli(int)"
            class="w-10 h-5 lg:w-7 lg:h-4 rounded-full relative transition-colors"
            [ngClass]="int.showInCli !== false ? 'bg-blue-500' : 'bg-slate-700'"
          >
            <div
              class="w-3.5 h-3.5 lg:w-2.5 lg:h-2.5 bg-white rounded-full absolute top-[3px] transition-all"
              [ngClass]="int.showInCli !== false ? 'left-[22px] lg:left-[16px]' : 'left-1'"
            ></div>
          </button>
        </div>

        <div class="w-full lg:w-6 flex justify-end lg:justify-center shrink-0 no-print mt-2 lg:mt-0 lg:pb-1">
          <button
            type="button"
            (click)="removeInterface(int.id)"
            class="text-slate-600 bg-slate-900 lg:bg-transparent p-2 lg:p-0 rounded lg:rounded-none hover:text-red-500 hover:bg-red-500/10 transition-colors"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lg:w-[14px] lg:h-[14px]">
              <path d="M3 6h18"/>
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
              <line x1="10" y1="11" x2="10" y2="17"/>
              <line x1="14" y1="11" x2="14" y2="17"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Default Gateway para PC -->
      <div *ngIf="node.type === 'pc'" class="bg-slate-950 p-4 rounded-2xl border border-slate-900">
        <label class="text-[8px] font-bold text-slate-600 block mb-1 uppercase">Default Gateway (PC)</label>
        <input
          type="text"
          [ngModel]="node.properties.gateway || ''"
          (ngModelChange)="onGatewayChange($event)"
          class="w-full bg-slate-900 border-none rounded p-2 lg:p-1.5 text-xs font-mono text-slate-100 outline-none focus:ring-1 focus:ring-blue-500"
          placeholder="192.168.1.254"
        />
      </div>
    </div>
  </section>

  <!-- Section 2: Subinterfaces (Exclusivo Router) -->
  <section
    *ngIf="node.type === 'router'"
    class="bg-slate-900/30 p-4 lg:p-6 rounded-3xl border border-slate-800/60 shadow-xl"
  >
    <div class="flex justify-between items-center mb-6">
      <h3 class="text-[10px] font-black text-cyan-500 uppercase tracking-[0.2em] flex items-center gap-2">
        <div class="w-1.5 h-1.5 rounded-full bg-cyan-500 shadow-[0_0_8px_#06b6d4]"></div>
        Subinterfaces (802.1Q)
      </h3>
      <button
        type="button"
        (click)="addSubinterface()"
        class="no-print text-[9px] font-bold bg-cyan-600 text-white px-3 py-1.5 rounded-full uppercase hover:scale-105 active:scale-95 transition-all shadow-[0_0_10px_rgba(6,182,212,0.3)]"
      >
        Añadir Subint.
      </button>
    </div>

    <div class="space-y-3">
      <div
        *ngFor="let sub of node.properties.subinterfaces; let idx = index"
        class="grid grid-cols-1 lg:grid-cols-12 gap-3 bg-slate-950 p-4 rounded-2xl border border-slate-900 lg:items-end group hover:border-slate-700 transition-all"
      >
        <div class="col-span-1 lg:col-span-3">
          <label class="text-[8px] font-bold text-slate-600 block mb-1 uppercase tracking-tighter">Int. Base</label>
          <select
            [(ngModel)]="sub.baseInterface"
            (ngModelChange)="emitChange()"
            class="w-full bg-slate-900 border-none rounded p-2 lg:p-1.5 text-xs text-slate-100 focus:ring-1 focus:ring-cyan-500 font-mono outline-none"
          >
            <option value="">Seleccione...</option>
            <option *ngFor="let i of node.properties.interfaces" [value]="i.name">{{ i.name }}</option>
          </select>
        </div>
        <div class="col-span-1 lg:col-span-2">
          <label class="text-[8px] font-bold text-slate-600 block mb-1 uppercase">VLAN ID</label>
          <input
            type="text"
            [(ngModel)]="sub.vlan"
            (ngModelChange)="emitChange()"
            class="w-full bg-slate-900 border-none rounded p-2 lg:p-1.5 text-xs font-mono text-slate-100 lg:text-center outline-none focus:ring-1 focus:ring-cyan-500"
            placeholder="100"
          />
        </div>
        <div class="col-span-1 lg:col-span-3">
          <label class="text-[8px] font-bold text-slate-600 block mb-1 uppercase">IP Address</label>
          <input
            type="text"
            [(ngModel)]="sub.ip"
            (ngModelChange)="emitChange()"
            class="w-full bg-slate-900 border-none rounded p-2 lg:p-1.5 text-xs font-mono text-slate-100 outline-none focus:ring-1 focus:ring-cyan-500"
            placeholder="192.168.50.1"
          />
        </div>
        <div class="col-span-1 lg:col-span-3">
          <label class="text-[8px] font-bold text-slate-600 block mb-1 uppercase">Mask</label>
          <input
            type="text"
            [(ngModel)]="sub.mask"
            (ngModelChange)="emitChange()"
            class="w-full bg-slate-900 border-none rounded p-2 lg:p-1.5 text-xs font-mono text-slate-100 outline-none focus:ring-1 focus:ring-cyan-500"
            placeholder="255.255.255.0"
          />
        </div>
        <div class="col-span-1 lg:col-span-1 flex justify-end lg:justify-center lg:pb-1 mt-2 lg:mt-0 pt-2 lg:pt-0 border-t border-slate-800 lg:border-none no-print">
          <button
            type="button"
            (click)="removeSubinterface(idx)"
            class="text-slate-600 bg-slate-900 lg:bg-transparent p-2 lg:p-0 rounded lg:rounded-none hover:text-red-500 hover:bg-red-500/10 transition-colors"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lg:w-[14px] lg:h-[14px]">
              <path d="M3 6h18"/>
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
              <line x1="10" y1="11" x2="10" y2="17"/>
              <line x1="14" y1="11" x2="14" y2="17"/>
            </svg>
          </button>
        </div>
      </div>

      <p
        *ngIf="!node.properties.subinterfaces || node.properties.subinterfaces.length === 0"
        class="text-xs text-slate-600 italic text-center py-4"
      >
        No hay subinterfaces configuradas.
      </p>
    </div>
  </section>

  <!-- Section 3: VLANs de Acceso (Exclusivo Switch) -->
  <section
    *ngIf="node.type === 'switch'"
    class="bg-slate-900/30 p-4 lg:p-6 rounded-3xl border border-slate-800/60 shadow-xl"
  >
    <div class="flex justify-between items-center mb-6">
      <h3 class="text-[10px] font-black text-green-500 uppercase tracking-[0.2em] flex items-center gap-2">
        <div class="w-1.5 h-1.5 rounded-full bg-green-500 shadow-[0_0_8px_#22c55e]"></div>
        VLANs de Acceso
      </h3>
      <button
        type="button"
        (click)="addVlan()"
        class="no-print text-[9px] font-bold bg-green-600 text-white px-3 py-1.5 rounded-full uppercase hover:scale-105 transition-all"
      >
        Añadir VLAN
      </button>
    </div>

    <div class="space-y-3">
      <div
        *ngFor="let vlan of node.properties.vlans || []; let idx = index"
        class="grid grid-cols-1 lg:grid-cols-12 gap-3 bg-slate-950 p-4 rounded-2xl border border-slate-900 lg:items-end group hover:border-slate-700 transition-all"
      >
        <div class="col-span-1 lg:col-span-2">
          <label class="text-[8px] font-bold text-slate-600 block mb-1 uppercase">VLAN ID</label>
          <input
            type="text"
            placeholder="Ej: 100"
            [ngModel]="vlan.id"
            (ngModelChange)="onVlanIdChange(vlan, $event)"
            class="w-full bg-slate-900 border-none rounded p-2 lg:p-1.5 text-xs font-mono text-slate-100 lg:text-center outline-none focus:ring-1 focus:ring-green-500"
          />
        </div>
        <div class="col-span-1 lg:col-span-4">
          <label class="text-[8px] font-bold text-slate-600 block mb-1 uppercase">Nombre</label>
          <input
            type="text"
            [placeholder]="vlan.isNative ? 'Ej: Nativa' : 'Ej: ventas'"
            [(ngModel)]="vlan.name"
            (ngModelChange)="emitChange()"
            class="w-full bg-slate-900 border-none rounded p-2 lg:p-1.5 text-xs font-mono text-slate-100 outline-none focus:ring-1 focus:ring-green-500"
          />
        </div>
        <div class="col-span-1 lg:col-span-4">
          <label class="text-[8px] font-bold text-slate-600 block mb-1 uppercase">Rango Puertos</label>
          <div class="flex gap-1 items-center w-full">
            <input
              type="text"
              placeholder="Fa0/"
              [ngModel]="vlan.portPrefix !== undefined ? vlan.portPrefix : 'Fa0/'"
              (ngModelChange)="vlan.portPrefix = $event; emitChange()"
              class="flex-1 lg:w-12 lg:flex-none bg-slate-900 border-none rounded p-2 lg:p-1.5 text-xs lg:text-[11px] font-mono text-slate-100 text-center outline-none focus:ring-1 focus:ring-green-500"
            />
            <input
              type="text"
              placeholder="1"
              [(ngModel)]="vlan.startPort"
              (ngModelChange)="emitChange()"
              class="w-14 lg:w-10 bg-slate-900 border-none rounded p-2 lg:p-1.5 text-xs lg:text-[11px] font-mono text-slate-100 text-center outline-none focus:ring-1 focus:ring-green-500"
            />
            <span class="text-slate-500 font-bold text-xs px-1">-</span>
            <input
              type="text"
              placeholder="10"
              [(ngModel)]="vlan.endPort"
              (ngModelChange)="emitChange()"
              class="w-14 lg:w-10 bg-slate-900 border-none rounded p-2 lg:p-1.5 text-xs lg:text-[11px] font-mono text-slate-100 text-center outline-none focus:ring-1 focus:ring-green-500"
            />
          </div>
        </div>

        <div class="col-span-1 lg:col-span-2 flex items-center justify-between lg:justify-center mt-2 lg:mt-0 pt-2 lg:pt-0 border-t border-slate-800 lg:border-none">
          <div class="flex items-center gap-2 lg:flex-col lg:gap-0 lg:mb-1.5">
            <label class="text-[10px] lg:text-[7px] font-bold text-slate-500 lg:mb-1 uppercase tracking-tighter cursor-pointer">
              Nativa
            </label>
            <input
              type="radio"
              [name]="'nativa_' + node.id"
              [checked]="!!vlan.isNative"
              (change)="setNativeVlan(idx)"
              class="w-4 h-4 lg:w-3.5 lg:h-3.5 accent-green-500 cursor-pointer"
            />
          </div>
          <button
            type="button"
            (click)="removeVlan(idx)"
            class="text-slate-600 bg-slate-900 lg:bg-transparent p-2 lg:p-0 rounded lg:rounded-none hover:text-red-500 hover:bg-red-500/10 transition-colors no-print"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lg:w-[14px] lg:h-[14px]">
              <path d="M3 6h18"/>
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
              <line x1="10" y1="11" x2="10" y2="17"/>
              <line x1="14" y1="11" x2="14" y2="17"/>
            </svg>
          </button>
        </div>
      </div>

      <p
        *ngIf="!node.properties.vlans || node.properties.vlans.length === 0"
        class="text-xs text-slate-600 italic text-center py-4"
      >
        No hay VLANs configuradas.
      </p>
    </div>
  </section>

  <!-- Section 4: Enlaces Troncales (Exclusivo Switch) -->
  <section
    *ngIf="node.type === 'switch'"
    class="bg-slate-900/30 p-4 lg:p-6 rounded-3xl border border-slate-800/60 shadow-xl"
  >
    <div class="flex justify-between items-center mb-6">
      <h3 class="text-[10px] font-black text-indigo-500 uppercase tracking-[0.2em] flex items-center gap-2">
        <div class="w-1.5 h-1.5 rounded-full bg-indigo-500 shadow-[0_0_8px_#6366f1]"></div>
        Enlaces Troncales (Trunks)
      </h3>
      <button
        type="button"
        (click)="addTrunk()"
        class="no-print text-[9px] font-bold bg-indigo-600 text-white px-3 py-1.5 rounded-full uppercase hover:scale-105 transition-all"
      >
        Añadir Troncal
      </button>
    </div>

    <div class="space-y-3">
      <div
        *ngFor="let trunk of node.properties.trunks || []; let idx = index"
        class="grid grid-cols-1 lg:grid-cols-12 gap-3 bg-slate-950 p-4 rounded-2xl border border-slate-900 lg:items-end group hover:border-slate-700 transition-all"
      >
        <div class="col-span-1 lg:col-span-3">
          <label class="text-[8px] font-bold text-slate-600 block mb-1 uppercase">Interfaz</label>
          <input
            type="text"
            placeholder="Ej: G0/1"
            [(ngModel)]="trunk.interface"
            (ngModelChange)="emitChange()"
            class="w-full bg-slate-900 border-none rounded p-2 lg:p-1.5 text-xs font-mono text-slate-100 lg:text-center outline-none"
          />
        </div>
        <div class="col-span-1 lg:col-span-3">
          <label class="text-[8px] font-bold text-slate-600 block mb-1 uppercase">VLAN Nativa</label>
          <input
            type="text"
            placeholder="Ej: 700"
            [(ngModel)]="trunk.nativeVlan"
            (ngModelChange)="emitChange()"
            class="w-full bg-slate-900 border-none rounded p-2 lg:p-1.5 text-xs font-mono text-slate-100 lg:text-center outline-none"
          />
        </div>
        <div class="col-span-1 lg:col-span-5">
          <label class="text-[8px] font-bold text-slate-600 block mb-1 uppercase">VLANs Permitidas</label>
          <input
            type="text"
            placeholder="Ej: 100,200,700,900"
            [(ngModel)]="trunk.allowedVlans"
            (ngModelChange)="emitChange()"
            class="w-full bg-slate-900 border-none rounded p-2 lg:p-1.5 text-xs font-mono text-slate-100 outline-none"
          />
        </div>
        <div class="col-span-1 lg:col-span-1 flex justify-end lg:justify-center lg:pb-1 mt-2 lg:mt-0 pt-2 lg:pt-0 border-t border-slate-800 lg:border-none no-print">
          <button
            type="button"
            (click)="removeTrunk(idx)"
            class="text-slate-600 bg-slate-900 lg:bg-transparent p-2 lg:p-0 rounded lg:rounded-none hover:text-red-500 hover:bg-red-500/10 transition-colors"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lg:w-[14px] lg:h-[14px]">
              <path d="M3 6h18"/>
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
              <line x1="10" y1="11" x2="10" y2="17"/>
              <line x1="14" y1="11" x2="14" y2="17"/>
            </svg>
          </button>
        </div>
      </div>

      <p
        *ngIf="!node.properties.trunks || node.properties.trunks.length === 0"
        class="text-xs text-slate-600 italic text-center py-4"
      >
        No hay enlaces troncales definidos.
      </p>
    </div>
  </section>
</div>
