<div class="absolute inset-0 lg:relative z-40 w-full lg:w-[450px] xl:w-[500px] h-full bg-black p-6 lg:p-8 border-l border-slate-900 flex flex-col no-print shadow-2xl lg:shadow-[inset_10px_0_30px_rgba(0,0,0,0.4)]">
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-3">
      <div class="w-2.5 h-2.5 rounded-full bg-green-500 shadow-[0_0_12px_#22c55e]"></div>
      <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-[0.3em]">
        Cisco Real-Time CLI
      </h3>
    </div>
    <div class="flex items-center gap-3">
      <button
        type="button"
        (click)="copyToClipboard()"
        class="text-[9px] font-black text-slate-400 hover:text-white border border-slate-800 px-4 py-2 rounded-lg uppercase tracking-widest transition-all hover:bg-slate-900"
      >
        {{ copied ? 'Copiado' : 'Copiar' }}
      </button>
      <button
        type="button"
        (click)="closeCli.emit()"
        class="lg:hidden p-2 bg-slate-900 rounded text-slate-400 hover:text-white"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="flex-1 bg-[#0a0c10] rounded-2xl border border-slate-800 p-6 font-mono text-[11px] leading-relaxed overflow-y-auto text-green-500/90 scrollbar-hide selection:bg-green-500/20 selection:text-white">
    <pre class="whitespace-pre-wrap">{{ configText }}</pre>
  </div>

  <div class="mt-6 p-4 bg-slate-900/30 rounded-xl border border-slate-800/50 text-center font-bold italic text-[9px] text-slate-500 uppercase tracking-wide">
    Generación compatible con IOS XE/XR
  </div>
</div>
