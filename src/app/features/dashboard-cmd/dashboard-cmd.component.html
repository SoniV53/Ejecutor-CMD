<div class="flex flex-row overflow-hidden relative h-full w-full bg-[#020617] text-[#f1f5f9]">
  <app-cmd-sidebar
    [projects]="displayedProjects"
    [selectedProjId]="selectedProjId"
    [serverOnline]="serverOnline"
    [sidebarOpenMobile]="sidebarOpenMobile"
    [sidebarOpenDesktop]="sidebarOpenDesktop"
    [activeProfile]="activeProfile"
    (selectProject)="selectProj($event)"
    (editProject)="editProject($event)"
    (deleteProject)="deleteProject($event)"
    (openNewProject)="openNewProjectModal()"
    (toggleSidebar)="toggleSidebar()"
  ></app-cmd-sidebar>

  <main class="flex-1 flex flex-col h-full relative bg-[#020617]/30 min-w-0 transition-all duration-300">
    <app-cmd-header
      [searchTerm]="searchTerm"
      [viewMode]="viewMode"
      [activeProject]="activeProject"
      [profiles]="profiles"
      [activeProfile]="activeProfile"
      (searchTermChange)="searchTerm = $event"
      (viewModeChange)="viewMode = $event"
      (toggleSidebar)="toggleSidebar()"
      (openNewCategory)="openNewCategoryModal()"
      (openNewCommand)="openNewCommandModal()"
      (openNewBat)="openNewBatModal()"
      (importBatFiles)="handleImportBatFiles($event)"
      (exportAllBats)="exportAllBats()"
      (deselectProject)="deselectProject()"
      (activeProfileChange)="onActiveProfileChange($event)"
      (manageProfiles)="openManageProfiles()"
      (exportProfileCommands)="exportProfileCommands()"
      (importProfileCommands)="importProfileCommands($event)"
    ></app-cmd-header>

    <div class="flex-1 overflow-y-auto p-4 md:p-10 custom-scrollbar">
      <app-cmd-grid
        [commands]="displayedCommands"
        [explicitCategories]="explicitCategories"
        [collapsedCategories]="collapsedCategories"
        [viewMode]="viewMode"
        [searchTerm]="searchTerm"
        (toggleCategory)="toggleCategory($event)"
        (editCategory)="editCategory($event)"
        (deleteCategory)="deleteCategory($event)"
        (editCommand)="editCommand($event)"
        (editBatCommand)="editBatCommand($event)"
        (exportBatCommand)="exportSingleBat($event)"
        (deleteCommand)="deleteCommand($event)"
        (runCommand)="runCommand($event)"
      ></app-cmd-grid>
    </div>

    <app-cmd-console-drawer
      [logs]="logs"
      [activeLogId]="activeLogId"
      [consoleMin]="consoleMin"
      [consoleMax]="consoleMax"
      [cleared]="logsCleared"
      [activeCwd]="activeProject?.path || 'C:\\'"
      (toggleConsole)="toggleConsole()"
      (toggleConsoleMax)="toggleConsoleMax()"
      (clearLogs)="clearLogs()"
      (selectTab)="selectTab($event)"
      (closeTab)="closeTab($event)"
      (clearTabOutput)="clearTabOutput($event)"
      (createNewTab)="createNewTerminalTab()"
      (rerunTab)="rerunTab($event)"
      (stopProcess)="stopProcess($event)"
      (runManualCommand)="runManualCommand($event)"
      (sendProcessInput)="sendInputToProcess($event)"
    ></app-cmd-console-drawer>
  </main>

  <!-- Modales clásicos (Proyecto, Categoría, Comando Estándar, Perfiles) -->
  <app-cmd-modals
    [showProjModal]="showProjModal"
    [editingProject]="editingProject"
    [showCatModal]="showCatModal"
    [editingCatName]="editingCatName"
    [showCmdModal]="showCmdModal"
    [editingCommand]="editingCommand"
    [allCategories]="allCategories"
    [allAvailableTags]="allAvailableTags"
    [allProfiles]="profiles"
    [activeProfile]="activeProfile"
    [showProfilesModal]="showProfilesModal"
    (closeProjModal)="showProjModal = false; editingProjId = null"
    (saveProject)="onSaveProject($event)"
    (closeCatModal)="showCatModal = false; editingCatName = null"
    (saveCategory)="onSaveCategory($event)"
    (closeCmdModal)="showCmdModal = false; editingCmdId = null"
    (saveCommand)="onSaveCommand($event)"
    (closeProfilesModal)="showProfilesModal = false"
    (saveProfilesList)="onSaveProfiles($event)"
  ></app-cmd-modals>

  <!-- Modal dedicado para Archivos .BAT Ejecutables -->
  <app-cmd-bat-modal
    [showBatModal]="showBatModal"
    [editingCommand]="editingBatCmd"
    [projects]="displayedProjects"
    [activeProject]="activeProject"
    [allCategories]="allCategories"
    [allAvailableTags]="allAvailableTags"
    [allProfiles]="profiles"
    (closeBatModal)="showBatModal = false; editingBatCmd = null"
    (saveBat)="onSaveBat($event)"
  ></app-cmd-bat-modal>
</div>
