<header class="min-h-[5rem] px-4 md:px-8 py-4 flex flex-wrap items-center justify-between border-b border-slate-900 bg-[#020617]/80 backdrop-blur-2xl gap-3 z-20 sticky top-0">
  <div class="flex items-center flex-1 min-w-[200px] gap-3">
    <button
      (click)="toggleSidebar.emit()"
      class="p-2.5 rounded-xl bg-slate-800/50 hover:bg-slate-800 text-slate-400 hover:text-white transition-colors shrink-0"
    >
      <i data-lucide="menu" class="w-5 h-5"></i>
    </button>
    <div class="relative w-full max-w-xl">
      <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 w-4 h-4"></i>
      <input
        type="text"
        [ngModel]="searchTerm"
        (ngModelChange)="onSearchInput($event)"
        placeholder="Buscar..."
        class="w-full bg-slate-900/50 border border-slate-800 rounded-2xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 transition-all text-white placeholder-slate-500"
      />
    </div>
  </div>

  <div class="flex flex-wrap items-center gap-2 md:gap-3 shrink-0 ml-auto">
    <!-- Selector de Vistas -->
    <div class="flex items-center bg-slate-900/80 rounded-xl p-1 border border-slate-800 shrink-0">
      <button
        (click)="viewModeChange.emit('list')"
        [ngClass]="viewMode === 'list' ? 'bg-slate-800 text-white shadow-sm' : 'text-slate-500 hover:text-white'"
        class="p-1.5 md:p-2 rounded-lg transition-all"
        title="Vista de Lista"
      >
        <i data-lucide="list" class="w-4 h-4"></i>
      </button>
      <button
        (click)="viewModeChange.emit('card')"
        [ngClass]="viewMode === 'card' ? 'bg-slate-800 text-white shadow-sm' : 'text-slate-500 hover:text-white'"
        class="p-1.5 md:p-2 rounded-lg transition-all"
        title="Vista de Tarjetas"
      >
        <i data-lucide="layout-grid" class="w-4 h-4"></i>
      </button>
    </div>

    <div class="flex items-center gap-2 shrink-0">
      <button
        (click)="openNewCategory.emit()"
        class="flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 md:px-4 py-2.5 rounded-xl text-xs md:text-sm font-bold transition-all active:scale-95 whitespace-nowrap shrink-0"
      >
        <i data-lucide="folder-plus" class="w-4 h-4 shrink-0"></i>
        <span class="hidden sm:inline">Categoría</span>
      </button>
      <button
        (click)="openNewCommand.emit()"
        class="flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 md:px-5 py-2.5 rounded-xl text-xs md:text-sm font-bold shadow-xl shadow-indigo-600/30 transition-all active:scale-95 whitespace-nowrap shrink-0"
      >
        <i data-lucide="plus" class="w-4 h-4 shrink-0"></i>
        <span class="hidden sm:inline">Nuevo Comando</span>
      </button>
    </div>
  </div>
</header>

<!-- Contexto de Proyecto Activo -->
<div
  *ngIf="activeProject"
  class="animate-fade shrink-0 z-10 bg-[#020617]/80 backdrop-blur-xl border-b border-slate-900 px-4 md:px-10 py-3"
>
  <div class="bg-indigo-600/10 border border-indigo-500/20 py-2 px-4 rounded-xl flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-3 w-full overflow-hidden">
      <div class="bg-indigo-600 p-1.5 rounded-lg shadow-sm shadow-indigo-600/20 shrink-0">
        <i data-lucide="folder-code" class="text-white w-4 h-4"></i>
      </div>
      <div class="overflow-hidden flex flex-col sm:flex-row sm:items-baseline gap-0.5 sm:gap-2 w-full">
        <h2 class="text-sm font-bold text-white tracking-tight truncate">{{ activeProject.name }}</h2>
        <p class="text-[10px] font-mono text-indigo-400 opacity-80 truncate">{{ activeProject.path }}</p>
      </div>
    </div>
    <button
      (click)="deselectProject.emit()"
      class="text-slate-500 hover:text-indigo-400 transition-colors bg-slate-900/50 hover:bg-indigo-500/10 p-1.5 rounded-lg shrink-0 ml-3"
    >
      <i data-lucide="x" class="w-4 h-4"></i>
    </button>
  </div>
</div>
