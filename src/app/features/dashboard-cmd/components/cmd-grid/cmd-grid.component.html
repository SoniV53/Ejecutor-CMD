<div class="flex flex-col gap-6 md:gap-10">
  <div *ngIf="visibleCategories.length === 0" class="text-center py-10 text-slate-500 italic">
    No se encontraron resultados...
  </div>

  <div *ngFor="let catGroup of visibleCategories" class="mb-5">
    <!-- Barra de Categoría -->
    <div
      class="flex items-center gap-2 mb-3 border-b border-slate-800 pb-2 group/cat hover:border-indigo-500/30 transition-colors cursor-pointer select-none"
      (click)="toggleCategory.emit(catGroup.name)"
    >
      <i
        [attr.data-lucide]="collapsedCategories[catGroup.name] ? 'chevron-right' : 'chevron-down'"
        class="w-4 h-4 text-slate-500 transition-transform"
      ></i>
      <i data-lucide="folder-tree" class="w-4 h-4 text-indigo-500"></i>
      <h3 class="text-sm font-bold text-white uppercase tracking-widest">{{ catGroup.name }}</h3>
      <div class="ml-auto flex gap-1 opacity-100 sm:opacity-0 group-hover/cat:opacity-100 transition-all">
        <button
          (click)="onEditCat($event, catGroup.name)"
          class="text-slate-500 hover:text-indigo-400 p-2 sm:p-1.5 hover:bg-indigo-500/10 rounded-lg transition-all"
          title="Renombrar Categoría"
        >
          <i data-lucide="pencil" class="w-4 h-4"></i>
        </button>
        <button
          *ngIf="catGroup.name !== 'General'"
          (click)="onDeleteCat($event, catGroup.name)"
          class="text-slate-500 hover:text-red-400 p-2 sm:p-1.5 hover:bg-red-500/10 rounded-lg transition-all"
          title="Eliminar Categoría"
        >
          <i data-lucide="trash-2" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Contenedor de Comandos -->
    <div
      *ngIf="!collapsedCategories[catGroup.name]"
      [ngClass]="
        viewMode === 'card'
          ? 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4'
          : 'flex flex-col gap-2'
      "
    >
      <div
        *ngIf="catGroup.commands.length === 0"
        class="text-slate-600 text-xs italic py-4 col-span-full border-2 border-dashed border-slate-800 rounded-2xl flex justify-center w-full"
      >
        No hay comandos asignados.
      </div>

      <ng-container *ngFor="let c of catGroup.commands">
        <!-- VISTA DE TARJETAS -->
        <div
          *ngIf="viewMode === 'card'"
          class="bg-[#0f172a] border border-slate-800 hover:border-indigo-500/50 transition-all p-4 rounded-2xl flex flex-col group relative overflow-hidden shadow-sm animate-fade"
        >
          <div class="flex justify-between items-center mb-3">
            <div class="flex items-center w-[80%]">
              <div class="w-2 h-2 rounded-full shrink-0" [ngClass]="getDotColorClass(c.color)"></div>
              <h4
                class="font-bold text-white text-sm ml-2 truncate group-hover:text-indigo-400 transition-colors"
                [title]="c.label"
              >
                {{ c.label }}
              </h4>
              <i
                *ngIf="c.background"
                data-lucide="monitor-off"
                class="w-3.5 h-3.5 text-slate-500 ml-2"
                title="Segundo Plano"
              ></i>
            </div>
            <div class="flex gap-1 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-all">
              <button
                (click)="editCommand.emit(c.id)"
                class="text-slate-500 hover:text-indigo-400 transition-all p-1.5 hover:bg-indigo-500/10 rounded-lg"
                title="Editar"
              >
                <i data-lucide="pencil" class="w-4 h-4"></i>
              </button>
              <button
                (click)="deleteCommand.emit(c.id)"
                class="text-slate-500 hover:text-red-400 transition-all p-1.5 hover:bg-red-500/10 rounded-lg"
                title="Eliminar"
              >
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
          <div
            class="bg-[#020617] px-2 py-2 rounded-xl border border-white/5 mb-3 flex-1 flex flex-col gap-1 overflow-y-auto custom-scrollbar max-h-24"
          >
            <label
              *ngFor="let scr of getScripts(c); let idx = index"
              class="flex items-start gap-2 cursor-pointer group/radio p-1 rounded-lg transition-colors"
              [ngClass]="getScripts(c).length > 1 ? 'hover:bg-white/5' : ''"
            >
              <input
                *ngIf="getScripts(c).length > 1"
                [type]="c.multiSelect ? 'checkbox' : 'radio'"
                [name]="'cmd_' + c.id"
                [value]="idx"
                [checked]="isSelected(c.id, idx)"
                (change)="onToggleVariant(c, idx, $event)"
                (click)="$event.stopPropagation()"
                class="mt-1 sm:mt-0.5 shrink-0 accent-indigo-500 cursor-pointer"
              />
              <code class="text-[10px] text-slate-400 code-font line-clamp-2 w-full select-text" [title]="scr">{{
                scr
              }}</code>
            </label>
          </div>
          <button
            (click)="onRun(c)"
            class="w-full py-2.5 rounded-xl text-[10px] font-black tracking-widest uppercase flex items-center justify-center gap-2 transition-all active:scale-95"
            [ngClass]="getBtnColorClass(c.color)"
          >
            <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i> Ejecutar
          </button>
        </div>

        <!-- VISTA DE LISTA -->
        <div
          *ngIf="viewMode === 'list'"
          class="bg-[#0f172a] border border-slate-800 hover:border-indigo-500/50 transition-all p-3 rounded-xl flex flex-col sm:flex-row sm:items-center gap-3 md:gap-4 group relative overflow-hidden shadow-sm animate-fade"
        >
          <div class="flex items-center sm:min-w-[180px] sm:max-w-[220px]">
            <div class="w-2 h-2 rounded-full shrink-0" [ngClass]="getDotColorClass(c.color)"></div>
            <h4
              class="font-bold text-white text-sm ml-2 truncate group-hover:text-indigo-400 transition-colors"
              [title]="c.label"
            >
              {{ c.label }}
            </h4>
            <i
              *ngIf="c.background"
              data-lucide="monitor-off"
              class="w-3.5 h-3.5 text-slate-500 ml-2"
              title="Segundo Plano"
            ></i>
          </div>

          <div
            class="flex-1 bg-[#020617] px-3 py-2 rounded-lg border border-white/5 flex flex-col gap-1 overflow-y-auto custom-scrollbar max-h-24 sm:max-h-20 min-h-[40px] justify-center w-full sm:w-auto"
          >
            <label
              *ngFor="let scr of getScripts(c); let idx = index"
              class="flex items-start gap-2 cursor-pointer group/radio p-1 rounded-lg transition-colors"
              [ngClass]="getScripts(c).length > 1 ? 'hover:bg-white/5' : ''"
            >
              <input
                *ngIf="getScripts(c).length > 1"
                [type]="c.multiSelect ? 'checkbox' : 'radio'"
                [name]="'cmd_list_' + c.id"
                [value]="idx"
                [checked]="isSelected(c.id, idx)"
                (change)="onToggleVariant(c, idx, $event)"
                (click)="$event.stopPropagation()"
                class="mt-1 sm:mt-0.5 shrink-0 accent-indigo-500 cursor-pointer"
              />
              <code class="text-[10px] text-slate-400 code-font line-clamp-2 w-full select-text" [title]="scr">{{
                scr
              }}</code>
            </label>
          </div>

          <div class="flex items-center justify-between sm:justify-end gap-3 shrink-0">
            <div class="flex gap-1 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-all">
              <button
                (click)="editCommand.emit(c.id)"
                class="text-slate-500 hover:text-indigo-400 transition-all p-2 sm:p-1.5 hover:bg-indigo-500/10 rounded-lg"
                title="Editar"
              >
                <i data-lucide="pencil" class="w-4 h-4"></i>
              </button>
              <button
                (click)="deleteCommand.emit(c.id)"
                class="text-slate-500 hover:text-red-400 transition-all p-2 sm:p-1.5 hover:bg-red-500/10 rounded-lg"
                title="Eliminar"
              >
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
            <button
              (click)="onRun(c)"
              class="px-5 py-2.5 md:py-2 rounded-xl text-[10px] font-black tracking-widest uppercase flex items-center justify-center gap-2 transition-all active:scale-95"
              [ngClass]="getBtnColorClass(c.color)"
            >
              <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i> Ejecutar
            </button>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</div>
