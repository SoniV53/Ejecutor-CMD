<aside
  class="fixed md:static inset-y-0 left-0 z-30 w-72 sm:w-80 glass-sidebar flex flex-col shrink-0 overflow-hidden h-full border-r border-slate-900 bg-[#070d1e]/95 md:bg-[#070d1e]/90 backdrop-blur-md transition-all duration-300 ease-in-out shadow-2xl md:shadow-none"
  [ngClass]="isOpen ? 'translate-x-0' : '-translate-x-full md:!w-0 md:!p-0 md:!border-r-0 md:opacity-0'"
>
  <!-- 1. APARTADO DE CARPETA DE WINDOWS -->
  <div class="p-3 border-b border-slate-800/80 bg-slate-950/60 shrink-0">
    <div class="flex items-center justify-between mb-2">
      <div class="flex items-center gap-1.5 text-slate-400">
        <i data-lucide="hard-drive" class="w-3.5 h-3.5 text-indigo-400"></i>
        <span class="text-[10px] font-bold uppercase tracking-wider">Carpeta de Windows</span>
      </div>

      <div class="flex items-center gap-1.5">
        <span *ngIf="isCustomRoot" class="text-[9px] px-1.5 py-0.2 rounded font-mono font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
          Personalizada
        </span>
        <span *ngIf="!isCustomRoot" class="text-[9px] px-1.5 py-0.2 rounded font-mono font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
          App (api_docs)
        </span>

        <!-- Botón cerrar sidebar en móvil -->
        <button
          type="button"
          (click)="closeSidebar.emit()"
          class="md:hidden p-1 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition-colors ml-1"
          title="Cerrar panel lateral"
        >
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>

    <!-- Ruta actual de Windows -->
    <div class="p-1.5 px-2 rounded-xl bg-slate-900/80 border border-slate-800 flex items-center justify-between gap-2 mb-2 shadow-inner">
      <div class="flex items-center gap-2 min-w-0 flex-1">
        <i data-lucide="folder" class="w-3.5 h-3.5 text-amber-400 shrink-0"></i>
        <span class="text-[11px] font-mono text-slate-200 truncate select-all" [title]="displayRootPath">
          {{ displayRootPath }}
        </span>
      </div>
    </div>

    <!-- Botones de Gestión de Carpeta Windows -->
    <div class="flex items-center gap-1.5">
      <button
        type="button"
        (click)="selectRootDirectory.emit()"
        class="flex-1 flex items-center justify-center gap-1.5 py-1.5 px-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-[10px] font-bold border border-slate-700 transition-all active:scale-95 cursor-pointer"
        title="Seleccionar otra carpeta en tu computadora"
      >
        <i data-lucide="search" class="w-3 h-3 text-indigo-400"></i>
        <span>Cambiar Carpeta</span>
      </button>

      <button
        type="button"
        (click)="openInWindowsExplorer.emit()"
        class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 transition-all active:scale-95 cursor-pointer"
        title="Abrir esta carpeta en el Explorador de Windows"
      >
        <i data-lucide="folder-open" class="w-3.5 h-3.5 text-amber-400"></i>
      </button>

      <button
        *ngIf="isCustomRoot"
        type="button"
        (click)="resetRootDirectory.emit()"
        class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white rounded-lg border border-slate-700 transition-all active:scale-95 cursor-pointer"
        title="Volver a la carpeta de la app (api_docs)"
      >
        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
      </button>
    </div>
  </div>

  <!-- 2. CABECERA DEL EXPLORADOR (ESTILO ÁRBOL) -->
  <div class="p-2.5 px-3 border-b border-slate-800/80 flex justify-between items-center bg-[#070d1e] shrink-0">
    <span class="text-[10px] font-black uppercase text-slate-400 tracking-widest flex items-center gap-1.5">
      <i data-lucide="folder-tree" class="w-3.5 h-3.5 text-indigo-400"></i>
      Explorador
    </span>

    <div class="flex items-center gap-0.5">
      <!-- Nuevo Archivo en Raíz -->
      <button
        type="button"
        (click)="createFile.emit('')"
        class="p-1.5 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-white transition-colors cursor-pointer"
        title="Nuevo archivo en raíz"
      >
        <i data-lucide="file-plus" class="w-3.5 h-3.5"></i>
      </button>

      <!-- Nueva Carpeta en Raíz -->
      <button
        type="button"
        (click)="createFolder.emit('')"
        class="p-1.5 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-white transition-colors cursor-pointer"
        title="Nueva carpeta en raíz"
      >
        <i data-lucide="folder-plus" class="w-3.5 h-3.5"></i>
      </button>

      <!-- Separador vertical -->
      <div class="w-px h-3.5 bg-slate-800 mx-1"></div>

      <!-- Contraer todo -->
      <button
        type="button"
        (click)="collapseAll()"
        class="p-1.5 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-white transition-colors cursor-pointer"
        title="Contraer todas las carpetas"
      >
        <i data-lucide="fold-vertical" class="w-3.5 h-3.5"></i>
      </button>

      <!-- Expandir todo -->
      <button
        type="button"
        (click)="expandAll()"
        class="p-1.5 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-white transition-colors cursor-pointer"
        title="Expandir todas las carpetas"
      >
        <i data-lucide="unfold-vertical" class="w-3.5 h-3.5"></i>
      </button>

      <!-- Refrescar -->
      <button
        type="button"
        (click)="refresh.emit()"
        class="p-1.5 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-white transition-colors cursor-pointer"
        title="Refrescar árbol"
      >
        <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
      </button>
    </div>
  </div>

  <!-- 3. BARRA DE FILTRO / BÚSQUEDA RÁPIDA -->
  <div class="px-2.5 py-1.5 border-b border-slate-900 bg-slate-950/40 shrink-0">
    <div class="relative flex items-center">
      <i data-lucide="search" class="w-3 h-3 text-slate-500 absolute left-2 pointer-events-none"></i>
      <input
        type="text"
        [(ngModel)]="searchQuery"
        (ngModelChange)="onSearchChange()"
        placeholder="Filtrar archivos..."
        class="w-full bg-slate-900/60 border border-slate-800/80 rounded-lg pl-7 pr-6 py-1 text-[11px] text-slate-200 placeholder-slate-500 outline-none focus:border-indigo-500/50 transition-colors"
      />
      <button
        *ngIf="searchQuery"
        type="button"
        (click)="clearSearch()"
        class="absolute right-1.5 p-0.5 text-slate-500 hover:text-slate-200 cursor-pointer"
        title="Limpiar filtro"
      >
        <i data-lucide="x" class="w-3 h-3"></i>
      </button>
    </div>
  </div>

  <!-- 4. CONTENEDOR DEL ÁRBOL RECURSIVO -->
  <div class="flex-1 overflow-y-auto custom-scrollbar p-1.5 space-y-0.5 select-none">
    <!-- Estado vacío -->
    <div
      *ngIf="filteredItems.length === 0"
      class="text-[11px] text-slate-500 text-center py-12 flex flex-col items-center gap-2"
    >
      <i data-lucide="folder-open" class="w-8 h-8 text-slate-600"></i>
      <span>{{ searchQuery ? 'No se encontraron coincidencias' : 'La carpeta está vacía' }}</span>
      <button
        *ngIf="!searchQuery"
        type="button"
        (click)="createFile.emit('')"
        class="text-[10px] text-indigo-400 hover:underline mt-1 font-bold cursor-pointer"
      >
        + Crear primer archivo
      </button>
    </div>

    <!-- Template Recursivo para Nodos del Árbol -->
    <ng-template #treeNode let-nodes="nodes" let-level="level">
      <div *ngFor="let item of nodes; trackBy: trackByPath" class="tree-node-wrapper">

        <!-- FILA DE CARPETA -->
        <div
          *ngIf="item.isFolder"
          (click)="toggleFolder(item.path, $event)"
          class="tree-row group flex items-center justify-between py-1 px-1.5 rounded-lg cursor-pointer transition-colors hover:bg-slate-800/50"
          [style.paddingLeft.px]="level * 14 + 6"
        >
          <div class="flex items-center gap-1.5 min-w-0 flex-1 truncate">
            <!-- Chevron Expandir/Contraer -->
            <span class="w-4 h-4 flex items-center justify-center shrink-0 text-slate-400 group-hover:text-slate-200">
              <i
                [attr.data-lucide]="isExpanded(item.path) ? 'chevron-down' : 'chevron-right'"
                class="w-3.5 h-3.5 transition-transform"
              ></i>
            </span>

            <!-- Icono Carpeta Abierta/Cerrada -->
            <i
              [attr.data-lucide]="isExpanded(item.path) ? 'folder-open' : 'folder'"
              class="w-4 h-4 text-amber-400/90 shrink-0"
            ></i>

            <!-- Nombre de Carpeta -->
            <span class="text-xs font-semibold text-slate-200 truncate select-none group-hover:text-white">
              {{ item.name }}
            </span>
          </div>

          <!-- Acciones Rápidas en Carpeta (Hover) -->
          <div class="tree-actions flex opacity-70 group-hover:opacity-100 items-center gap-0.5 shrink-0 ml-1 transition-opacity">
            <!-- Crear archivo dentro -->
            <button
              type="button"
              (click)="onCreateFileIn(item.path, $event)"
              class="p-1 hover:bg-slate-700 text-slate-400 hover:text-white rounded transition-colors"
              title="Crear archivo dentro"
            >
              <i data-lucide="file-plus" class="w-3 h-3"></i>
            </button>

            <!-- Crear subcarpeta dentro -->
            <button
              type="button"
              (click)="onCreateFolderIn(item.path, $event)"
              class="p-1 hover:bg-slate-700 text-slate-400 hover:text-white rounded transition-colors"
              title="Crear subcarpeta dentro"
            >
              <i data-lucide="folder-plus" class="w-3 h-3"></i>
            </button>

            <!-- Renombrar carpeta -->
            <button
              type="button"
              (click)="onRename(item, $event)"
              class="p-1 hover:bg-slate-700 text-slate-400 hover:text-amber-400 rounded transition-colors"
              title="Renombrar carpeta"
            >
              <i data-lucide="pencil" class="w-3 h-3"></i>
            </button>

            <!-- Eliminar carpeta -->
            <button
              type="button"
              (click)="onDelete(item.path, $event)"
              class="p-1 hover:bg-slate-700 text-slate-400 hover:text-rose-400 rounded transition-colors"
              title="Eliminar carpeta"
            >
              <i data-lucide="trash-2" class="w-3 h-3"></i>
            </button>
          </div>
        </div>

        <!-- HIJOS DE LA CARPETA (RECURSIÓN) -->
        <div
          *ngIf="item.isFolder && isExpanded(item.path) && item.children && item.children.length > 0"
          class="tree-branch border-l border-slate-800/80 ml-3.5 my-0.5"
        >
          <ng-container
            *ngTemplateOutlet="treeNode; context: { nodes: item.children, level: level + 1 }"
          ></ng-container>
        </div>

        <!-- FILA DE ARCHIVO -->
        <div
          *ngIf="!item.isFolder"
          (click)="loadFile.emit(item.path)"
          [ngClass]="isActiveFile(item.path) ? 'bg-indigo-600/20 border-l-2 border-indigo-500' : ''"
          class="tree-row group flex items-center justify-between py-1 px-1.5 rounded-lg cursor-pointer transition-colors hover:bg-slate-800/50"
          [style.paddingLeft.px]="level * 14 + 18"
        >
          <div class="flex items-center gap-1.5 min-w-0 flex-1 truncate">
            <!-- Icono según tipo de archivo -->
            <span class="w-4 h-4 flex items-center justify-center shrink-0">
              <i
                *ngIf="item.extension === 'json'"
                data-lucide="braces"
                class="w-3.5 h-3.5 text-amber-400"
              ></i>
              <i
                *ngIf="item.extension === 'md'"
                data-lucide="hash"
                class="w-3.5 h-3.5 text-sky-400"
              ></i>
              <i
                *ngIf="item.extension !== 'json' && item.extension !== 'md'"
                data-lucide="file-text"
                class="w-3.5 h-3.5 text-slate-400 group-hover:text-slate-300"
              ></i>
            </span>

            <!-- Nombre de archivo -->
            <span
              [class.text-indigo-300]="isActiveFile(item.path)"
              [class.font-semibold]="isActiveFile(item.path)"
              class="text-xs text-slate-300 truncate select-none group-hover:text-white"
            >
              {{ item.name }}
            </span>
          </div>

          <!-- Acciones Rápidas en Archivo (Hover) -->
          <div class="tree-actions flex opacity-70 group-hover:opacity-100 items-center gap-0.5 shrink-0 ml-1 transition-opacity">
            <!-- Renombrar archivo -->
            <button
              type="button"
              (click)="onRename(item, $event)"
              class="p-1 hover:bg-slate-700 text-slate-400 hover:text-amber-400 rounded transition-colors"
              title="Renombrar archivo"
            >
              <i data-lucide="pencil" class="w-3 h-3"></i>
            </button>

            <!-- Eliminar archivo -->
            <button
              type="button"
              (click)="onDelete(item.path, $event)"
              class="p-1 hover:bg-slate-700 text-slate-400 hover:text-rose-400 rounded transition-colors"
              title="Eliminar archivo"
            >
              <i data-lucide="trash-2" class="w-3 h-3"></i>
            </button>
          </div>
        </div>

      </div>
    </ng-template>

    <!-- Invocación Inicial del Template Recursivo (Raíz: nivel 0) -->
    <ng-container
      *ngTemplateOutlet="treeNode; context: { nodes: filteredItems, level: 0 }"
    ></ng-container>
  </div>
</aside>
