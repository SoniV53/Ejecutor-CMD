<div class="flex flex-col lg:flex-row h-full w-full overflow-y-auto lg:overflow-hidden relative bg-slate-100 text-slate-800">
  <!-- INPUT OCULTO CARGA JSON -->
  <input
    #fileInput
    type="file"
    class="hidden"
    accept=".json"
    (change)="loadProject($event)"
  />

  <!-- BOTÓN FLOTANTE PARA CAMBIAR VISTA (VISIBLE SIEMPRE) -->
  <div class="absolute top-4 right-6 z-[100] flex gap-3">
    <button
      type="button"
      (click)="toggleEditor()"
      class="p-3 rounded-2xl shadow-2xl transition-all border-2"
      [ngClass]="
        showEditor
          ? 'bg-white text-slate-600 border-slate-100 hover:bg-slate-50'
          : 'bg-blue-600 text-white border-blue-500 hover:bg-blue-700'
      "
      [title]="showEditor ? 'Ver Hojas (Pantalla Completa)' : 'Volver al Editor'"
    >
      <span *ngIf="showEditor" class="inline-flex">
        <i data-lucide="expand" class="w-6 h-6"></i>
      </span>
      <span *ngIf="!showEditor" class="inline-flex">
        <i data-lucide="edit-3" class="w-6 h-6"></i>
      </span>
    </button>
  </div>

  <!-- MODAL IMPORTAR CÓDIGO -->
  <app-doc-import-modal
    *ngIf="showImportModal"
    (closeModal)="showImportModal = false"
    (importParameters)="onImportParameters($event)"
  ></app-doc-import-modal>

  <!-- EDITOR -->
  <app-doc-editor-panel
    *ngIf="showEditor"
    [formData]="formData"
    [isGenerating]="isGenerating"
    [hoveredVariantId]="hoveredVariantId"
    (openImportModal)="showImportModal = true"
    (openJson)="triggerOpenJson()"
    (saveJson)="saveProject()"
    (exportPdf)="generatePDF()"
    (hoveredVariantChange)="hoveredVariantId = $event"
    (imageSelected)="onImageSelected($event)"
  ></app-doc-editor-panel>

  <!-- LIVE PREVIEW (CENTRADAS COMO HOJAS PURAS) -->
  <app-doc-preview-paper
    [formData]="formData"
    [showEditor]="showEditor"
  ></app-doc-preview-paper>
</div>
