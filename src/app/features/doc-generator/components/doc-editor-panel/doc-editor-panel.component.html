<div
  class="w-full lg:w-1/2 p-4 md:p-8 overflow-y-auto h-screen custom-scrollbar bg-slate-50 border-r border-slate-200 animate-in slide-in-from-left duration-300"
>
  <header class="flex justify-between items-center mb-8 gap-4 text-slate-800">
    <div class="flex items-center gap-4">
      <a
        routerLink="/hub"
        class="p-2.5 bg-slate-200 text-slate-600 rounded-xl hover:bg-slate-300 transition-all shadow-sm"
        title="Volver al Hub"
      >
        <i data-lucide="home" class="w-5 h-5"></i>
      </a>
      <div class="bg-blue-600 p-3 rounded-2xl text-white shadow-lg">
        <i data-lucide="layers" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="text-xl font-black tracking-tight">Ionic Doc Maker</h1>
        <p class="text-[10px] text-slate-400 uppercase font-black tracking-widest italic">
          Modo Edición
        </p>
      </div>
    </div>
    <div class="flex gap-2">
      <button
        type="button"
        (click)="openJson.emit()"
        class="p-2.5 bg-slate-200 text-slate-600 rounded-xl hover:bg-slate-300 transition-all shadow-sm"
        title="Abrir Proyecto (.json)"
      >
        <i data-lucide="folder-open" class="w-5 h-5"></i>
      </button>
      <button
        type="button"
        (click)="saveJson.emit()"
        class="p-2.5 bg-slate-200 text-slate-600 rounded-xl hover:bg-slate-300 transition-all shadow-sm"
        title="Guardar Proyecto (.json)"
      >
        <i data-lucide="save" class="w-5 h-5"></i>
      </button>
      <button
        type="button"
        (click)="exportPdf.emit()"
        [disabled]="isGenerating"
        class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl font-bold shadow-lg transition-all flex items-center gap-2 text-sm active:scale-95 disabled:opacity-50 mr-12"
      >
        <span *ngIf="isGenerating" class="inline-flex">
          <i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>
        </span>
        <span *ngIf="!isGenerating" class="inline-flex">
          <i data-lucide="download" class="w-5 h-5"></i>
        </span>
        PDF
      </button>
    </div>
  </header>

  <div class="space-y-6 pb-20">
    <!-- General -->
    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
      <div
        class="flex items-center gap-2 mb-4 text-blue-600 font-bold uppercase text-[10px] tracking-widest"
      >
        <i data-lucide="info" class="w-4 h-4"></i><span>Información</span>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="md:col-span-2 space-y-3">
          <input
            name="name"
            [(ngModel)]="formData.name"
            placeholder="Nombre Principal"
            class="w-full p-2.5 bg-slate-50 rounded-xl font-bold text-lg outline-none focus:ring-2 focus:ring-blue-100 transition-all"
          />
          <input
            name="subtitle"
            [(ngModel)]="formData.subtitle"
            placeholder="Subtítulo técnico"
            class="w-full p-2.5 bg-slate-50 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-100"
          />
        </div>
        <select
          name="status"
          [(ngModel)]="formData.status"
          class="p-2.5 bg-slate-50 rounded-xl font-bold text-sm h-fit outline-none border border-transparent hover:border-slate-200 transition-all cursor-pointer"
        >
          <option *ngIf="formData.status === 'Estable'" value="Estable" hidden>🟢 Estable</option>
          <option value="🟢 Estable">🟢 Estable</option>
          <option value="🟡 Beta">🟡 Beta</option>
          <option value="🔴 Obsoleto">🔴 Obsoleto</option>
        </select>
        <textarea
          name="description"
          [(ngModel)]="formData.description"
          placeholder="Descripción global..."
          class="md:col-span-3 w-full p-3 bg-slate-50 rounded-xl outline-none text-sm min-h-[80px]"
        ></textarea>
      </div>
    </div>

    <!-- Parámetros -->
    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
      <div
        class="flex justify-between items-center mb-4 text-blue-600 uppercase text-[10px] font-bold tracking-widest"
      >
        <div class="flex items-center gap-2">
          <i data-lucide="settings" class="w-4 h-4"></i><span>API: Parámetros</span>
        </div>
        <div class="flex gap-2">
          <button
            type="button"
            (click)="openImportModal.emit()"
            class="px-3 py-1 bg-indigo-50 text-indigo-600 rounded-lg font-bold hover:bg-indigo-100 italic tracking-tighter text-[10px]"
          >
            &#64; Importar
          </button>
          <button
            type="button"
            (click)="addParameter()"
            class="p-1.5 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100"
          >
            <i data-lucide="plus" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
      <div class="space-y-2">
        <div
          *ngFor="let p of formData.globalParameters"
          class="flex gap-2 bg-slate-50 p-2 rounded-xl group transition-all border border-transparent hover:border-slate-200"
        >
          <input
            placeholder="Nombre"
            [(ngModel)]="p.name"
            class="flex-1 p-2 bg-white rounded-lg text-[11px] font-bold outline-none"
          />
          <input
            placeholder="Tipo"
            [(ngModel)]="p.type"
            class="w-20 p-2 bg-white rounded-lg text-[11px] outline-none italic"
          />
          <input
            placeholder="Descripción"
            [(ngModel)]="p.description"
            class="flex-[2] p-2 bg-white rounded-lg text-[11px] outline-none"
          />
          <button
            type="button"
            (click)="removeParameter(p.id)"
            class="text-slate-300 hover:text-red-500 px-1"
          >
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Métodos -->
    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
      <div
        class="flex justify-between items-center mb-4 text-amber-600 font-bold uppercase text-[10px] tracking-widest"
      >
        <div class="flex items-center gap-2">
          <i data-lucide="zap" class="w-4 h-4"></i><span>Lógica Interna</span>
        </div>
        <button
          type="button"
          (click)="addMethod()"
          class="p-1.5 bg-amber-50 text-amber-600 rounded-lg hover:bg-amber-100"
        >
          <i data-lucide="plus" class="w-4 h-4"></i>
        </button>
      </div>
      <div class="space-y-3">
        <div
          *ngFor="let m of formData.methods"
          class="bg-slate-50 p-3 rounded-2xl flex gap-3 items-start group border border-transparent hover:border-amber-200 transition-all"
        >
          <div class="flex-1 space-y-2">
            <div class="flex gap-2">
              <input
                placeholder="Metodo()"
                [(ngModel)]="m.name"
                class="flex-1 p-2 bg-white rounded-lg text-[11px] font-bold outline-none text-amber-700"
              />
              <input
                placeholder="void"
                [(ngModel)]="m.details"
                class="w-24 p-2 bg-white rounded-lg text-[11px] italic outline-none"
              />
            </div>
            <textarea
              placeholder="Descripción lógica..."
              [(ngModel)]="m.description"
              class="w-full p-2 bg-white rounded-lg text-[11px] outline-none h-12"
            ></textarea>
          </div>
          <button
            type="button"
            (click)="removeMethod(m.id)"
            class="text-slate-300 hover:text-red-500 p-1"
          >
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Variantes -->
    <div class="space-y-4">
      <div
        class="flex justify-between px-4 font-bold text-[10px] text-slate-400 uppercase tracking-widest"
      >
        <div class="flex items-center gap-2">
          <i data-lucide="image" class="w-3.5 h-3.5"></i><span>Variantes Visuales</span>
        </div>
        <button type="button" (click)="addVariant()" class="text-blue-600 hover:underline">
          + Variante
        </button>
      </div>

      <div
        *ngFor="let v of formData.variants"
        (mouseenter)="hoveredVariantChange.emit(v.id)"
        (mouseleave)="hoveredVariantChange.emit(null)"
        class="bg-white rounded-[2rem] border transition-all p-5 shadow-sm border-slate-200"
        [ngClass]="{ 'ring-2 ring-blue-500': hoveredVariantId === v.id }"
      >
        <div class="flex justify-between mb-4">
          <input
            [(ngModel)]="v.name"
            class="font-bold text-slate-700 bg-transparent outline-none flex-1 text-sm"
            placeholder="Nombre Variante..."
          />
          <button
            type="button"
            (click)="removeVariant(v.id)"
            class="text-slate-300 hover:text-red-500"
          >
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="space-y-3">
            <div
              (dragover)="onDragOver($event, v.id)"
              (dragleave)="onDragLeave()"
              (drop)="onDrop($event, v.id)"
              class="relative aspect-video rounded-2xl border-2 border-dashed flex items-center justify-center transition-all overflow-hidden"
              [ngClass]="
                activeDragId === v.id
                  ? 'bg-blue-50 border-blue-400'
                  : 'bg-slate-50 border-slate-200 hover:bg-slate-100'
              "
            >
              <div *ngIf="v.image; else uploadPromptTpl" class="relative group w-full h-full">
                <img [src]="v.image" class="w-full h-full object-contain p-2" alt="Variante" />
                <label
                  class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 flex flex-col items-center justify-center transition-opacity cursor-pointer text-white"
                >
                  <i data-lucide="upload" class="w-4 h-4 mb-1"></i>
                  <span class="font-bold text-[10px] uppercase tracking-widest">Cambiar</span>
                  <input
                    type="file"
                    class="hidden"
                    accept="image/*"
                    (change)="onFileInput($event, v.id)"
                  />
                </label>
              </div>
              <ng-template #uploadPromptTpl>
                <label
                  class="flex flex-col items-center cursor-pointer p-4 w-full h-full justify-center text-slate-400"
                >
                  <i data-lucide="clipboard-paste" class="w-6 h-6 mb-2"></i>
                  <span class="text-[9px] uppercase font-bold text-center italic tracking-wider">
                    Ctrl+V o Arrastrar
                  </span>
                  <input
                    type="file"
                    class="hidden"
                    accept="image/*"
                    (change)="onFileInput($event, v.id)"
                  />
                </label>
              </ng-template>
            </div>
            <textarea
              [(ngModel)]="v.description"
              class="w-full bg-slate-50 rounded-xl p-2.5 text-[11px] text-slate-500 min-h-[50px] outline-none italic border border-transparent focus:border-slate-200"
              placeholder="Comentarios..."
            ></textarea>
          </div>
          <div class="space-y-3">
            <div
              class="flex justify-between items-center text-[9px] font-black text-slate-400 uppercase tracking-tight"
            >
              <span>Atributos</span>
              <button
                type="button"
                (click)="addVariantProperty(v)"
                class="text-blue-500 bg-blue-50 p-1 rounded-md hover:bg-blue-100 transition-all"
              >
                <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              </button>
            </div>
            <div class="space-y-2 max-h-[140px] overflow-y-auto pr-1 custom-scrollbar">
              <div
                *ngFor="let sp of v.selectedProperties; let idx = index"
                class="flex gap-1.5 items-center bg-slate-50 p-1.5 rounded-xl border border-transparent shadow-sm"
              >
                <select
                  [(ngModel)]="sp.parameterId"
                  class="flex-1 p-1 bg-white rounded-lg text-[9px] font-bold outline-none border-none"
                >
                  <option value="">Param...</option>
                  <option *ngFor="let gp of formData.globalParameters" [value]="gp.id">
                    {{ gp.name || '(Sin nombre)' }}
                  </option>
                </select>
                <input
                  [(ngModel)]="sp.value"
                  placeholder="Valor"
                  class="flex-1 p-1 bg-white rounded-lg text-[9px] outline-none font-mono"
                />
                <button
                  type="button"
                  (click)="removeVariantProperty(v, idx)"
                  class="text-slate-300 hover:text-red-500 transition-colors"
                >
                  <i data-lucide="trash-2" class="w-3 h-3"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Git -->
    <div class="bg-slate-900 p-6 rounded-[2.5rem] shadow-xl border border-white/5 mb-10 text-white">
      <div
        class="flex justify-between items-center mb-4 text-blue-400 font-bold uppercase text-[10px] tracking-widest"
      >
        <div class="flex items-center gap-2">
          <i data-lucide="history" class="w-4 h-4"></i><span>Trazabilidad Git</span>
        </div>
        <button
          type="button"
          (click)="addCommit()"
          class="px-3 py-1.5 bg-white/10 hover:bg-white/20 rounded-xl transition-all font-black text-[10px]"
        >
          + COMMIT
        </button>
      </div>
      <div class="space-y-3">
        <div
          *ngFor="let c of formData.historyCommits"
          class="flex gap-3 bg-white/5 p-3 rounded-2xl border border-white/5 group transition-all hover:bg-white/10"
        >
          <input
            [(ngModel)]="c.title"
            class="flex-1 bg-white/5 rounded-xl p-2 text-xs text-white outline-none border-none focus:ring-1 focus:ring-blue-500/50"
            placeholder="Mensaje..."
          />
          <input
            [(ngModel)]="c.hash"
            class="w-24 bg-white/5 rounded-xl p-2 text-xs font-mono text-blue-300 outline-none border-none uppercase tracking-tighter"
            placeholder="Hash"
          />
          <button
            type="button"
            (click)="removeCommit(c.id)"
            class="text-slate-600 hover:text-red-400 p-1"
          >
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
