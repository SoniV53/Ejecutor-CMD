<a [routerLink]="tool.route"
   [ngClass]="hoverShadowClass"
   class="cursor-pointer bg-[#0f172a] border border-slate-800 p-6 rounded-3xl hover:bg-slate-800/50 transition-all hover:-translate-y-1 hover:shadow-2xl block h-full">
  <div [ngClass]="iconBoxClass"
       class="w-14 h-14 rounded-2xl flex items-center justify-center mb-6 border">
    <i [attr.data-lucide]="tool.icon" class="w-7 h-7"></i>
  </div>
  <h3 class="text-xl font-bold text-white mb-2">{{ tool.title }}</h3>
  <p class="text-slate-400 text-sm">{{ tool.description }}</p>
</a>
