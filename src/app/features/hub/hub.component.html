<div id="hub-view" class="absolute inset-0 overflow-y-auto p-10 hub-bg">
  <header class="mb-12">
    <h1 class="text-4xl font-bold text-white mb-2 tracking-tight">Workspace Hub</h1>
    <p class="text-slate-400 text-lg">
      Selecciona una herramienta. Tu progreso se guardará al cambiar entre ellas.
    </p>
  </header>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    <app-tool-card *ngFor="let tool of tools" [tool]="tool"></app-tool-card>
  </div>
</div>
