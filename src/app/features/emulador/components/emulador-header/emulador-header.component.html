<header
  id="mainHeader"
  [class.header-hidden]="!isMenuVisible"
  class="w-full border-b border-slate-900 bg-[#020617]/95 backdrop-blur-2xl z-50 shrink-0"
>
  <div class="px-4 md:px-6 py-3 flex flex-col gap-3">
    <div class="flex items-center justify-between gap-4">
      <div class="flex items-center gap-2 md:gap-4 shrink-0">
        <button
          type="button"
          (click)="toggleMenu.emit()"
          class="p-2 rounded-xl transition-all hover:bg-slate-800 text-slate-400 hover:text-white"
          title="Ocultar Menú"
        >
          <i data-lucide="chevrons-up" class="w-5 h-5"></i>
        </button>
        <button
          type="button"
          (click)="goHome()"
          routerLink="/hub"
          class="p-2 rounded-xl transition-all hover:bg-slate-800 text-slate-400 hover:text-white"
          title="Volver al Hub"
        >
          <i data-lucide="home" class="text-white w-5 h-5"></i>
        </button>
      </div>

      <div
        id="emu-searchbar-container"
        class="w-full max-w-2xl mx-auto flex items-center justify-center relative z-20"
      >
        <div class="flex-1 w-full flex items-center gap-2 relative">
          <div class="relative w-full">
            <input
              type="text"
              id="urlInput"
              [ngModel]="url"
              (ngModelChange)="onUrlInputChange($event)"
              placeholder="http://localhost:8100"
              class="w-full bg-[#0f172a] border border-slate-800 rounded-xl pl-4 pr-10 py-2 text-sm code-font focus:outline-none focus:border-indigo-500 transition-all text-white shadow-inner"
              (keydown.enter)="onEnterKey()"
              (focus)="onInputFocus()"
              (blur)="onInputBlur()"
            />

            <button
              type="button"
              (click)="toggleHistory.emit(!isHistoryOpen)"
              class="absolute right-2 top-1/2 -translate-y-1/2 p-1 text-slate-400 hover:text-white cursor-pointer"
            >
              <i data-lucide="chevron-down" class="w-4 h-4"></i>
            </button>

            <div
              id="historyDropdown"
              class="absolute top-full left-0 right-0 mt-2 bg-[#0f172a] border border-slate-800 rounded-xl shadow-2xl z-50 transition-all duration-200 overflow-hidden"
              [ngClass]="isHistoryOpen ? 'dropdown-open' : 'dropdown-closed'"
            >
              <div
                class="px-3 py-2 border-b border-slate-800 flex justify-between items-center bg-slate-900/50"
              >
                <span class="text-xs font-semibold text-slate-400">Historial Reciente</span>
                <button
                  type="button"
                  (mousedown)="onClearHistory($event)"
                  class="text-xs text-red-400 hover:text-red-300 cursor-pointer"
                >
                  Limpiar
                </button>
              </div>
              <ul id="historyList" class="max-h-48 overflow-y-auto">
                <li
                  *ngIf="history.length === 0"
                  class="px-4 py-3 text-sm text-slate-500 italic text-center"
                >
                  No hay búsquedas recientes
                </li>
                <li
                  *ngFor="let item of history"
                  (mousedown)="selectHistoryUrl(item)"
                  class="px-4 py-2.5 text-sm text-slate-300 hover:bg-indigo-600/20 hover:text-white cursor-pointer border-b border-slate-800/50 last:border-0 truncate flex items-center justify-between gap-2 transition-colors group"
                >
                  <span class="flex items-center gap-2 truncate">
                    <i data-lucide="globe" class="w-3.5 h-3.5 opacity-50 shrink-0"></i>
                    <span class="truncate">{{ item }}</span>
                  </span>
                  <button
                    type="button"
                    (mousedown)="onDeleteHistoryItem($event, item)"
                    class="text-slate-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity p-1"
                    title="Eliminar del historial"
                  >
                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                  </button>
                </li>
              </ul>
            </div>
          </div>

          <button
            type="button"
            (click)="navigate.emit(url)"
            class="bg-indigo-600 hover:bg-indigo-500 text-white p-2 rounded-xl transition-colors shadow-lg shrink-0 cursor-pointer"
          >
            <i data-lucide="arrow-right" class="w-5 h-5"></i>
          </button>
          <button
            type="button"
            (click)="refresh.emit()"
            class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2 rounded-xl transition-colors border border-slate-700 shrink-0 cursor-pointer"
          >
            <i data-lucide="rotate-cw" class="w-5 h-5"></i>
          </button>
        </div>
      </div>
    </div>

    <div class="flex flex-wrap items-center justify-between gap-2 pb-1">
      <div class="flex flex-wrap items-center gap-2 shrink-0">
        <!-- ZOOM DEL DISPOSITIVO (TAMAÑO FÍSICO) -->
        <div
          class="flex items-center gap-1.5 bg-[#0f172a] px-2 py-1 rounded-xl border border-slate-800 shrink-0"
          title="Graduar tamaño del dispositivo en pantalla (Se guarda automáticamente)"
        >
          <span class="text-[9px] font-black uppercase tracking-wider text-slate-500 px-1">
            Dispositivo
          </span>
          <button
            type="button"
            (click)="updateZoom.emit(-0.05)"
            class="p-1 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition-colors cursor-pointer"
            title="Alejar dispositivo (-5%)"
          >
            <i data-lucide="zoom-out" class="w-3.5 h-3.5"></i>
          </button>
          <input
            type="range"
            min="30"
            max="150"
            step="1"
            [value]="zoomSliderValue"
            (input)="onZoomSliderInput($event)"
            [disabled]="currentDeviceKey === 'responsive'"
            class="w-20 md:w-24 h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500"
          />
          <span id="zoomLabel" class="text-[10px] font-bold text-indigo-400 w-9 text-center">
            {{ zoomPercentage }}
          </span>
          <button
            type="button"
            (click)="updateZoom.emit(0.05)"
            class="p-1 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition-colors cursor-pointer"
            title="Acercar dispositivo (+5%)"
          >
            <i data-lucide="zoom-in" class="w-3.5 h-3.5"></i>
          </button>
          <div class="w-px h-4 bg-slate-700 mx-0.5"></div>
          <button
            type="button"
            (click)="autoFit.emit()"
            class="px-1.5 py-1 text-[9px] font-bold text-slate-400 hover:text-indigo-400 rounded-lg hover:bg-slate-800 transition-colors cursor-pointer uppercase"
            title="Auto-Ajustar dispositivo a la ventana"
          >
            Auto
          </button>
          <button
            type="button"
            (click)="resetZoom.emit()"
            class="px-1.5 py-1 text-[9px] font-bold text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition-colors cursor-pointer"
            title="Tamaño Físico 100%"
          >
            100%
          </button>
        </div>

        <!-- ESCALA INTERNA DE LA APP (ZOOM DEL CONTENIDO WEB) -->
        <div
          class="flex items-center gap-1.5 bg-[#0f172a] px-2 py-1 rounded-xl border border-slate-800 shrink-0"
          title="Graduar el zoom interno de la aplicación dentro del teléfono (Se guarda automáticamente)"
        >
          <span class="text-[9px] font-black uppercase tracking-wider text-slate-500 px-1">
            Zoom App
          </span>
          <button
            type="button"
            (click)="updateAppZoom.emit(-0.05)"
            class="p-1 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition-colors cursor-pointer"
            title="Reducir zoom interno de la app (-5%)"
          >
            <i data-lucide="minus" class="w-3.5 h-3.5"></i>
          </button>
          <input
            type="range"
            min="50"
            max="150"
            step="1"
            [value]="appZoomSliderValue"
            (input)="onAppZoomSliderInput($event)"
            class="w-16 md:w-20 h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-emerald-500"
          />
          <span class="text-[10px] font-bold text-emerald-400 w-9 text-center">
            {{ appZoomPercentage }}
          </span>
          <button
            type="button"
            (click)="updateAppZoom.emit(0.05)"
            class="p-1 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition-colors cursor-pointer"
            title="Aumentar zoom interno de la app (+5%)"
          >
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
          </button>
          <button
            type="button"
            (click)="resetAppZoom.emit()"
            class="px-1.5 py-1 text-[9px] font-bold text-slate-400 hover:text-emerald-400 rounded-lg hover:bg-slate-800 transition-colors cursor-pointer"
            title="Restablecer zoom interno de la app a 100%"
          >
            100%
          </button>
        </div>
      </div>

      <div class="flex items-center gap-2 shrink-0 bg-[#0f172a] p-1 rounded-xl border border-slate-800">
        <button
          type="button"
          (click)="toggleDeviceMode.emit()"
          class="p-1.5 text-slate-400 hover:text-white"
          title="Alternar Modo"
        >
          <i data-lucide="smartphone-charging" class="w-4 h-4"></i>
        </button>
        <div class="w-px h-4 bg-slate-700"></div>
        <select
          id="deviceSelector"
          [ngModel]="currentDeviceKey"
          (ngModelChange)="onDeviceSelectChange($event)"
          class="bg-transparent text-[10px] font-bold text-slate-300 outline-none px-2 py-1 cursor-pointer"
        >
          <option value="iphone14" class="bg-[#0f172a] text-slate-200">iPhone 14 Pro</option>
          <option value="pixel7" class="bg-[#0f172a] text-slate-200">Pixel 7</option>
          <option value="ipad" class="bg-[#0f172a] text-slate-200">iPad Mini</option>
          <option value="responsive" class="bg-[#0f172a] text-slate-200">Responsive</option>
        </select>
        <div class="w-px h-4 bg-slate-700"></div>
        <button
          type="button"
          (click)="toggleRotation.emit()"
          id="btnRotate"
          class="p-1.5 text-slate-400 hover:text-white rounded-lg transition-all"
        >
          <span
            id="rotateIcon"
            class="inline-flex transition-transform duration-300"
            [style.transform]="isLandscape ? 'rotate(90deg)' : 'rotate(0deg)'"
            [class.opacity-30]="currentDeviceKey === 'responsive'"
          >
            <i data-lucide="smartphone" class="w-4 h-4"></i>
          </span>
        </button>
      </div>

      <div class="flex items-center gap-2 shrink-0">
        <button
          type="button"
          (click)="toggleTouch.emit()"
          id="btnToggleTouch"
          class="flex items-center gap-2 px-3 md:px-4 py-2 rounded-xl text-[10px] font-black uppercase transition-all border border-slate-700 hover:bg-slate-800 hover:text-white whitespace-nowrap shrink-0"
          [ngClass]="
            isTouchEnabled
              ? 'bg-indigo-600/20 text-indigo-400'
              : 'bg-slate-800 text-slate-300'
          "
        >
          <span *ngIf="isTouchEnabled" class="inline-flex items-center gap-2">
            <i data-lucide="hand" class="w-4 h-4 shrink-0"></i>
            <span id="touchLabel" class="hidden sm:inline">Touch: ON</span>
          </span>
          <span *ngIf="!isTouchEnabled" class="inline-flex items-center gap-2">
            <i data-lucide="mouse-pointer-2" class="w-4 h-4 shrink-0"></i>
            <span id="touchLabel" class="hidden sm:inline">Touch: OFF</span>
          </span>
        </button>

        <button
          type="button"
          (click)="toggleConsole.emit()"
          id="btnHeaderConsole"
          class="flex items-center gap-2 bg-slate-800 hover:bg-indigo-600/20 text-slate-300 hover:text-indigo-400 px-3 md:px-4 py-2 rounded-xl text-[10px] font-black uppercase transition-all border border-slate-700 whitespace-nowrap shrink-0"
          [ngClass]="{ 'bg-indigo-600/20 text-indigo-400': isConsoleOpen }"
        >
          <i data-lucide="terminal" class="w-4 h-4 shrink-0"></i>
          <span id="devToolsLabel" class="hidden sm:inline">DevTools Nativo</span>
        </button>
      </div>
    </div>
  </div>
</header>
