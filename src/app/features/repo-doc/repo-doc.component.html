<div class="bg-slate-50 h-full w-full flex overflow-hidden text-slate-800 font-sans">
  <app-repo-sidebar-tree
    [state]="state"
    [currentBranchId]="currentBranchId"
    [currentFolderId]="currentFolderId"
    [showAnalysisView]="showAnalysisView"
    [expandedFolders]="expandedFolders"
    [fileStatusText]="fileStatusText"
    [fileSynced]="fileSynced"
    (openAnalysisView)="openAnalysisPanel()"
    (openNewFolderModal)="openNewFolderModal($event)"
    (openNewBranchModal)="openNewBranchModal($event)"
    (toggleFolder)="toggleFolder($event)"
    (selectFolder)="showFolderDetails($event)"
    (selectBranch)="showBranchDetails($event)"
    (moveBranchToFolder)="onMoveBranchFolder($event)"
    (createNewFile)="crearNuevoArchivo()"
    (openFileModal)="abrirArchivo()"
    (saveFileForced)="guardarArchivoForzado()"
    (saveFileAs)="guardarArchivoComo()"
  ></app-repo-sidebar-tree>

  <app-repo-branch-detail
    [state]="state"
    [currentFolder]="currentFolder"
    [currentBranch]="currentBranch"
    [parentBranchName]="parentBranchName"
    [commits]="state.commits"
    [showAnalysisView]="showAnalysisView"
    [cmdProjects]="cmdProjects"
    [isAnalyzingGit]="isAnalyzingGit"
    [analysisError]="analysisError"
    [scannedBranches]="scannedBranches"
    [gitCurrentBranch]="gitCurrentBranch"
    (closeAnalysisView)="showAnalysisView = false"
    (runGitAnalysis)="onRunGitAnalysis($event)"
    (importMissingBranches)="onImportMissingBranches($event)"
    (editFolder)="editCurrentFolder()"
    (deleteFolder)="deleteCurrentFolder()"
    (selectFolder)="showFolderDetails($event)"
    (openNewSubfolder)="openNewFolderModal($event)"
    (openNewBranchInFolder)="openNewBranchModal({ folderId: $event, parentId: null, isMain: false })"
    (moveFolderParent)="onMoveFolderParent($event)"
    (editBranch)="editCurrentBranch()"
    (deleteBranch)="deleteCurrentBranch()"
    (selectBranch)="showBranchDetails($event)"
    (toggleMainBranch)="onToggleMainBranch($event)"
    (moveBranchFolder)="onMoveBranchFolder($event)"
    (changeBranchParent)="onChangeBranchParent($event)"
    (openNewChildBranch)="openNewChildBranchModal($event)"
    (openCommitModal)="showCommitModal = true"
    (deleteCommit)="deleteCommit($event)"
    (importBranchCommits)="onImportBranchCommits($event)"
    (updateRepoPath)="onUpdateRepoPath($event)"
    (openNewNoteModal)="openNewNoteModal($event)"
    (editNote)="openEditNoteModal($event)"
    (togglePinNote)="onTogglePinNote($event)"
    (deleteNote)="onDeleteNote($event)"
  ></app-repo-branch-detail>

  <app-repo-modals
    [showBranchModal]="showBranchModal"
    [editingBranch]="editingBranch"
    [defaultBranchFolderId]="defaultBranchFolderId"
    [defaultBranchParentId]="defaultBranchParentId"
    [defaultBranchIsMain]="defaultBranchIsMain"
    [showFolderModal]="showFolderModal"
    [editingFolder]="editingFolder"
    [defaultFolderParentId]="defaultFolderParentId"
    [showCommitModal]="showCommitModal"
    [showNoteModal]="showNoteModal"
    [editingNote]="editingNote"
    [noteTargetLabel]="noteTargetLabel"
    [showFilenameModal]="showFilenameModal"
    [filenameModalTitle]="filenameModalTitle"
    [filenamePlaceholder]="filenamePlaceholder"
    [showOpenModal]="showOpenModal"
    [jsonFiles]="jsonFiles"
    [activeFileName]="activeFileName"
    [folders]="state.folders"
    [branches]="state.branches"
    (closeBranchModal)="showBranchModal = false; editingBranch = null"
    (saveBranch)="onSaveBranch($event)"
    (closeFolderModal)="showFolderModal = false; editingFolder = null"
    (saveFolder)="onSaveFolder($event)"
    (closeCommitModal)="showCommitModal = false"
    (saveCommit)="onSaveCommit($event)"
    (closeNoteModal)="showNoteModal = false; editingNote = null"
    (saveNote)="onSaveNote($event)"
    (closeFilenameModal)="showFilenameModal = false"
    (confirmFilename)="onConfirmFilename($event)"
    (closeOpenModal)="showOpenModal = false"
    (selectFileToOpen)="selectFileToOpen($event)"
  ></app-repo-modals>
</div>
