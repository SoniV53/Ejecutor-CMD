<aside class="w-80 bg-white border-r border-slate-200 flex flex-col shadow-sm z-10 shrink-0 h-full">
  <div class="p-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
    <h2 class="text-lg font-bold flex items-center gap-2 text-slate-700">
      <a routerLink="/hub" class="p-1 hover:bg-slate-200 rounded-lg text-slate-500 transition cursor-pointer">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </a>
      <i data-lucide="git-branch" class="text-indigo-600"></i> Ramas
    </h2>
    <div class="flex gap-1">
      <button
        type="button"
        (click)="openNewFolderModal.emit()"
        class="bg-slate-200 hover:bg-slate-700 hover:text-white text-slate-600 p-1.5 rounded-md transition"
        title="Nueva Carpeta"
      >
        <i data-lucide="folder-plus" class="w-4 h-4"></i>
      </button>
      <button
        type="button"
        (click)="openNewBranchModal.emit()"
        class="bg-indigo-600 hover:bg-indigo-700 text-white p-1.5 rounded-md transition"
        title="Nueva Rama"
      >
        <i data-lucide="plus" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <div class="flex-1 overflow-y-auto p-4 pl-2">
    <!-- Recursive Folder Template -->
    <ng-template #folderTpl let-folder="folder" let-level="level">
      <div [style.paddingLeft.px]="level * 16">
        <div
          class="flex items-center gap-2 py-1.5 px-2 rounded-md cursor-pointer group"
          [ngClass]="
            currentFolderId === folder.id
              ? 'bg-slate-200 text-slate-900 font-medium'
              : 'text-slate-600 hover:bg-slate-100'
          "
          (click)="selectFolder.emit(folder.id)"
        >
          <button
            type="button"
            (click)="onToggleFolder(folder.id, $event)"
            class="p-0.5 text-slate-400 hover:text-slate-600"
          >
            <i
              [attr.data-lucide]="isExpanded(folder.id) ? 'chevron-down' : 'chevron-right'"
              class="w-4 h-4"
            ></i>
          </button>
          <i
            data-lucide="folder"
            class="w-4 h-4 text-slate-400 group-hover:text-amber-500 transition-colors"
            [ngClass]="currentFolderId === folder.id ? 'text-amber-500' : ''"
          ></i>
          <span class="truncate text-sm">{{ folder.name }}</span>
        </div>
      </div>

      <div *ngIf="isExpanded(folder.id)">
        <ng-container *ngFor="let sf of getSubFolders(folder.id)">
          <ng-container
            *ngTemplateOutlet="folderTpl; context: { folder: sf, level: level + 1 }"
          ></ng-container>
        </ng-container>

        <div *ngIf="getFolderBranches(folder.id).length > 0" class="root-branch">
          <ng-container *ngFor="let b of getFolderBranches(folder.id)">
            <ng-container
              *ngTemplateOutlet="branchTpl; context: { branch: b, level: level + 1 }"
            ></ng-container>
          </ng-container>
        </div>
      </div>
    </ng-template>

    <!-- Recursive Branch Template -->
    <ng-template #branchTpl let-branch="branch" let-level="level">
      <div class="branch-item" [style.paddingLeft.px]="level > 0 ? 24 : 8">
        <div
          class="flex items-center gap-2 py-1.5 px-2 rounded-md cursor-pointer group mb-1"
          [ngClass]="
            currentBranchId === branch.id
              ? 'bg-indigo-50 text-indigo-700 font-medium border border-indigo-100'
              : 'text-slate-600 hover:bg-slate-100 border border-transparent'
          "
          (click)="selectBranch.emit(branch.id)"
        >
          <i
            data-lucide="git-commit"
            class="w-4 h-4 shrink-0"
            [ngClass]="currentBranchId === branch.id ? 'text-indigo-600' : 'text-slate-400'"
          ></i>
          <span class="truncate text-sm">{{ branch.name }}</span>
        </div>
      </div>

      <div *ngIf="getChildBranches(branch.id).length > 0">
        <ng-container *ngFor="let cb of getChildBranches(branch.id)">
          <ng-container
            *ngTemplateOutlet="branchTpl; context: { branch: cb, level: level + 1 }"
          ></ng-container>
        </ng-container>
      </div>
    </ng-template>

    <!-- Render Root Folders -->
    <ng-container *ngFor="let rf of rootFolders">
      <ng-container *ngTemplateOutlet="folderTpl; context: { folder: rf, level: 0 }"></ng-container>
    </ng-container>

    <!-- Render Root Branches -->
    <div class="root-branch mt-2">
      <ng-container *ngFor="let rb of rootBranches">
        <ng-container *ngTemplateOutlet="branchTpl; context: { branch: rb, level: 0 }"></ng-container>
      </ng-container>
    </div>
  </div>

  <div class="p-4 border-t border-slate-200 bg-slate-50 flex flex-col gap-2">
    <div class="text-xs text-slate-500 mb-1 flex items-center justify-between">
      <span>Archivo Activo:</span>
      <div class="flex items-center gap-1.5">
        <span
          class="font-medium truncate max-w-[140px]"
          [ngClass]="fileSynced ? 'text-emerald-600' : 'text-amber-500'"
          [title]="fileStatusText + (fileSynced ? ' (Guardado)' : ' (Guardando...)')"
        >
          {{ fileStatusText }}
        </span>
        <button
          type="button"
          (click)="createNewFile.emit()"
          class="text-slate-400 hover:text-emerald-600 transition p-1"
          title="Nuevo Proyecto (En Blanco)"
        >
          <i data-lucide="file-plus" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>

    <button
      type="button"
      (click)="openFileModal.emit()"
      class="w-full flex items-center justify-center gap-2 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 py-2 px-4 rounded-md transition text-sm font-medium"
    >
      <i data-lucide="folder-open" class="w-4 h-4"></i> Abrir Proyecto...
    </button>

    <div class="flex gap-2">
      <button
        type="button"
        (click)="saveFileForced.emit()"
        class="flex-1 flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded-md transition text-sm font-medium"
        title="Forzar guardado"
      >
        <i data-lucide="save" class="w-4 h-4"></i> Guardar
      </button>
      <button
        type="button"
        (click)="saveFileAs.emit()"
        class="flex-1 flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-900 text-white py-2 px-4 rounded-md transition text-sm font-medium"
        title="Guardar una copia nueva"
      >
        <i data-lucide="copy" class="w-4 h-4"></i> Como...
      </button>
    </div>
  </div>
</aside>
