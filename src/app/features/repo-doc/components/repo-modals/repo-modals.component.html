<!-- BRANCH MODAL -->
<div
  *ngIf="showBranchModal"
  class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50"
>
  <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden transform transition-all">
    <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
      <h3 class="text-lg font-bold text-slate-800">{{ editingBranch ? 'Editar Rama' : 'Nueva Rama' }}</h3>
      <button type="button" (click)="closeBranchModal.emit()" class="text-slate-400 hover:text-slate-600">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
    <form (submit)="onSubmitBranch($event)" class="p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nombre de la Rama</label>
        <input
          type="text"
          [(ngModel)]="branchName"
          name="branchName"
          placeholder="ej. main, develop, feat/login"
          required
          class="w-full border border-slate-300 rounded-lg px-4 py-2 outline-none font-mono text-sm focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <!-- Enmarcar como Rama Principal -->
      <label
        class="flex items-start gap-3 p-3 rounded-xl border cursor-pointer transition-all"
        [ngClass]="
          branchIsMain
            ? 'border-amber-400 bg-amber-50/80 text-amber-900 shadow-sm'
            : 'border-slate-200 bg-slate-50/60 hover:bg-slate-100 text-slate-700'
        "
      >
        <input
          type="checkbox"
          [(ngModel)]="branchIsMain"
          name="branchIsMain"
          class="mt-1 h-4 w-4 rounded border-slate-300 text-amber-600 focus:ring-amber-500"
        />
        <div class="flex-1 min-w-0">
          <div class="text-sm font-bold flex items-center gap-1.5">
            <i data-lucide="crown" class="w-4 h-4 text-amber-500"></i>
            Enmarcar como Rama Principal
          </div>
          <p class="text-xs opacity-80 mt-0.5">
            Destaca visualmente esta rama como base del proyecto o módulo de la cual parten las ramas de desarrollo.
          </p>
        </div>
      </label>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Carpeta / Subcarpeta</label>
          <select
            [(ngModel)]="branchFolderId"
            name="branchFolderId"
            class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none text-sm bg-white"
          >
            <option value="">Raíz (Sin carpeta)</option>
            <option *ngFor="let f of folders" [value]="f.id">
              {{ getFolderPathLabel(f) }}{{ f.isDefault ? ' (Default)' : '' }}
            </option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Rama Padre (Origen)</label>
          <select
            [(ngModel)]="branchParentId"
            name="branchParentId"
            class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none text-sm bg-white"
          >
            <option value="">Ninguna (Raíz)</option>
            <option *ngFor="let b of availableParentBranches" [value]="b.id">
              {{ b.isMain ? '★ ' : '' }}{{ b.name }}
            </option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Propósito / Descripción</label>
        <textarea
          [(ngModel)]="branchDesc"
          name="branchDesc"
          rows="3"
          placeholder="Describe el objetivo de esta rama..."
          class="w-full border border-slate-300 rounded-lg px-4 py-2 outline-none text-sm resize-none focus:ring-2 focus:ring-indigo-500"
        ></textarea>
      </div>
      <div class="pt-2 flex justify-end gap-2">
        <button
          type="button"
          (click)="closeBranchModal.emit()"
          class="px-4 py-2 text-sm font-medium bg-slate-100 hover:bg-slate-200 rounded-lg"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg"
        >
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>

<!-- FOLDER MODAL -->
<div
  *ngIf="showFolderModal"
  class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50"
>
  <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden transform transition-all">
    <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
      <h3 class="text-lg font-bold text-slate-800">{{ editingFolder ? 'Editar Carpeta' : 'Nueva Carpeta / Subcarpeta' }}</h3>
      <button type="button" (click)="closeFolderModal.emit()" class="text-slate-400 hover:text-slate-600">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
    <form (submit)="onSubmitFolder($event)" class="p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nombre de la Carpeta</label>
        <input
          type="text"
          [(ngModel)]="folderName"
          name="folderName"
          placeholder="ej. Sprint 4, Módulo Pagos, Archivadas..."
          required
          class="w-full border border-slate-300 rounded-lg px-4 py-2 outline-none text-sm focus:ring-2 focus:ring-indigo-500"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Ubicación (Carpeta Padre)</label>
        <select
          [(ngModel)]="folderParentId"
          name="folderParentId"
          class="w-full border border-slate-300 rounded-lg px-4 py-2 outline-none text-sm bg-white"
        >
          <option value="">Carpeta Raíz (Nivel principal)</option>
          <option *ngFor="let f of availableParentFolders" [value]="f.id">
            {{ getFolderPathLabel(f) }}
          </option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Descripción (Opcional)</label>
        <textarea
          [(ngModel)]="folderDesc"
          name="folderDesc"
          rows="2"
          placeholder="Describe qué ramas agrupa esta carpeta..."
          class="w-full border border-slate-300 rounded-lg px-4 py-2 outline-none text-sm resize-none focus:ring-2 focus:ring-indigo-500"
        ></textarea>
      </div>
      <div class="pt-2 flex justify-end gap-2">
        <button
          type="button"
          (click)="closeFolderModal.emit()"
          class="px-4 py-2 text-sm font-medium bg-slate-100 hover:bg-slate-200 rounded-lg"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg"
        >
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>

<!-- COMMIT MODAL -->
<div
  *ngIf="showCommitModal"
  class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50"
>
  <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden transform transition-all">
    <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
      <h3 class="text-lg font-bold text-slate-800">Registrar Commit</h3>
      <button type="button" (click)="closeCommitModal.emit()" class="text-slate-400 hover:text-slate-600">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
    <form (submit)="onSubmitCommit($event)" class="p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Hash / ID (Opcional)</label>
        <input
          type="text"
          [(ngModel)]="commitHash"
          name="commitHash"
          class="w-full border border-slate-300 rounded-lg px-4 py-2 outline-none font-mono text-sm focus:ring-2 focus:ring-emerald-500"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Mensaje</label>
        <textarea
          [(ngModel)]="commitMsg"
          name="commitMsg"
          required
          rows="3"
          class="w-full border border-slate-300 rounded-lg px-4 py-2 outline-none text-sm resize-none focus:ring-2 focus:ring-emerald-500"
        ></textarea>
      </div>
      <div class="pt-2 flex justify-end gap-2">
        <button
          type="button"
          (click)="closeCommitModal.emit()"
          class="px-4 py-2 text-sm font-medium bg-slate-100 hover:bg-slate-200 rounded-lg"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="px-4 py-2 text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg"
        >
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>

<!-- NOTE MODAL (FOR BRANCH OR FOLDER) -->
<div
  *ngIf="showNoteModal"
  class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50"
>
  <div class="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden transform transition-all">
    <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
      <div>
        <h3 class="text-lg font-bold text-slate-800">{{ editingNote ? 'Editar Nota' : 'Nueva Nota' }}</h3>
        <p *ngIf="noteTargetLabel" class="text-xs text-slate-500 mt-0.5">En: <span class="font-semibold text-slate-700">{{ noteTargetLabel }}</span></p>
      </div>
      <button type="button" (click)="closeNoteModal.emit()" class="text-slate-400 hover:text-slate-600">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
    <form (submit)="onSubmitNote($event)" class="p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Título de la Nota</label>
        <input
          type="text"
          [(ngModel)]="noteTitle"
          name="noteTitle"
          placeholder="ej. Pendiente de pruebas QA, Configuración .env, Bloqueo..."
          required
          class="w-full border border-slate-300 rounded-lg px-4 py-2 outline-none text-sm focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Contenido / Detalles</label>
        <textarea
          [(ngModel)]="noteContent"
          name="noteContent"
          rows="4"
          placeholder="Escribe tus apuntes, comandos relacionados, decisiones o pendientes..."
          class="w-full border border-slate-300 rounded-lg px-4 py-2 outline-none text-sm resize-y focus:ring-2 focus:ring-indigo-500"
        ></textarea>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-4 pt-1">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Color de tarjeta</label>
          <div class="flex items-center gap-2">
            <button
              *ngFor="let c of noteColors"
              type="button"
              (click)="noteColor = c.value"
              class="px-2.5 py-1 rounded-full text-xs font-medium flex items-center gap-1.5 border transition"
              [ngClass]="
                noteColor === c.value
                  ? 'ring-2 ' + c.ringClass + ' border-transparent font-semibold'
                  : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50'
              "
            >
              <span class="w-2.5 h-2.5 rounded-full" [ngClass]="c.dotClass"></span>
              {{ c.label }}
            </button>
          </div>
        </div>

        <label class="flex items-center gap-2 cursor-pointer select-none pt-4">
          <input
            type="checkbox"
            [(ngModel)]="notePinned"
            name="notePinned"
            class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"
          />
          <span class="text-sm font-medium text-slate-700">Fijar arriba</span>
        </label>
      </div>

      <div class="pt-3 flex justify-end gap-2 border-t border-slate-100">
        <button
          type="button"
          (click)="closeNoteModal.emit()"
          class="px-4 py-2 text-sm font-medium bg-slate-100 hover:bg-slate-200 rounded-lg"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg"
        >
          Guardar Nota
        </button>
      </div>
    </form>
  </div>
</div>

<!-- FILENAME MODAL -->
<div
  *ngIf="showFilenameModal"
  class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-[60]"
>
  <div class="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden transform transition-all">
    <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
      <h3 class="text-lg font-bold text-slate-800">{{ filenameModalTitle }}</h3>
      <button type="button" (click)="closeFilenameModal.emit()" class="text-slate-400 hover:text-slate-600">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
    <div class="p-6">
      <input
        type="text"
        [(ngModel)]="inputFilename"
        [placeholder]="filenamePlaceholder"
        (keydown.enter)="onConfirmFilename()"
        class="w-full border border-slate-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none text-sm mb-6"
      />
      <div class="flex justify-end gap-2">
        <button
          type="button"
          (click)="closeFilenameModal.emit()"
          class="flex-1 px-4 py-2 text-sm font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition"
        >
          Cancelar
        </button>
        <button
          type="button"
          (click)="onConfirmFilename()"
          class="flex-1 px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition"
        >
          Aceptar
        </button>
      </div>
    </div>
  </div>
</div>

<!-- OPEN MODAL -->
<div
  *ngIf="showOpenModal"
  class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-[60]"
>
  <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden transform transition-all">
    <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
      <h3 class="text-lg font-bold text-slate-800">Archivos en json/rama</h3>
      <button type="button" (click)="closeOpenModal.emit()" class="text-slate-400 hover:text-slate-600">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
    <div class="p-4 bg-slate-50">
      <div class="space-y-2 max-h-72 overflow-y-auto pr-2 custom-scrollbar">
        <p *ngIf="jsonFiles.length === 0" class="text-sm text-slate-500 text-center py-4">No hay archivos.</p>
        <button
          *ngFor="let f of jsonFiles"
          type="button"
          (click)="selectFileToOpen.emit(f.name)"
          class="w-full flex items-center justify-between px-4 py-3 rounded-xl border shadow-sm transition-all mb-2"
          [ngClass]="
            f.name === activeFileName
              ? 'border-indigo-500 bg-indigo-50 text-indigo-700'
              : 'border-slate-200 hover:bg-white text-slate-700'
          "
        >
          <div class="flex items-center gap-3">
            <i
              data-lucide="file-json"
              class="w-4 h-4"
              [ngClass]="f.name === activeFileName ? 'text-indigo-600' : 'text-slate-400'"
            ></i>
            <span class="text-sm font-medium">{{ f.name }}</span>
          </div>
          <span
            *ngIf="f.name === activeFileName"
            class="text-[10px] font-bold uppercase tracking-wider bg-indigo-100 text-indigo-600 px-2 py-1 rounded-full"
          >
            Abierto
          </span>
        </button>
      </div>
    </div>
  </div>
</div>
