<!-- BRANCH MODAL -->
<div
  *ngIf="showBranchModal"
  class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50"
>
  <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden transform transition-all">
    <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
      <h3 class="text-lg font-bold text-slate-800">Crear/Editar Rama</h3>
      <button type="button" (click)="closeBranchModal.emit()" class="text-slate-400 hover:text-slate-600">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
    <form (submit)="onSubmitBranch($event)" class="p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nombre</label>
        <input
          type="text"
          [(ngModel)]="branchName"
          name="branchName"
          required
          class="w-full border border-slate-300 rounded-lg px-4 py-2 outline-none font-mono text-sm focus:ring-2 focus:ring-indigo-500"
        />
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Carpeta</label>
          <select
            [(ngModel)]="branchFolderId"
            name="branchFolderId"
            class="w-full border border-slate-300 rounded-lg px-4 py-2 outline-none text-sm"
          >
            <option value="">Carpeta Raíz</option>
            <option *ngFor="let f of folders" [value]="f.id">{{ f.name }}</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Rama Padre</label>
          <select
            [(ngModel)]="branchParentId"
            name="branchParentId"
            class="w-full border border-slate-300 rounded-lg px-4 py-2 outline-none text-sm"
          >
            <option value="">Ninguna (Raíz)</option>
            <option *ngFor="let b of availableParentBranches" [value]="b.id">{{ b.name }}</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Descripción</label>
        <textarea
          [(ngModel)]="branchDesc"
          name="branchDesc"
          rows="3"
          class="w-full border border-slate-300 rounded-lg px-4 py-2 outline-none text-sm resize-none"
        ></textarea>
      </div>
      <div class="pt-2 flex justify-end gap-2">
        <button
          type="button"
          (click)="closeBranchModal.emit()"
          class="px-4 py-2 text-sm font-medium bg-slate-100 hover:bg-slate-200 rounded-lg"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg"
        >
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>

<!-- FOLDER MODAL -->
<div
  *ngIf="showFolderModal"
  class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50"
>
  <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden transform transition-all">
    <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
      <h3 class="text-lg font-bold text-slate-800">Crear/Editar Carpeta</h3>
      <button type="button" (click)="closeFolderModal.emit()" class="text-slate-400 hover:text-slate-600">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
    <form (submit)="onSubmitFolder($event)" class="p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nombre</label>
        <input
          type="text"
          [(ngModel)]="folderName"
          name="folderName"
          required
          class="w-full border border-slate-300 rounded-lg px-4 py-2 outline-none text-sm focus:ring-2 focus:ring-indigo-500"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Carpeta Padre</label>
        <select
          [(ngModel)]="folderParentId"
          name="folderParentId"
          class="w-full border border-slate-300 rounded-lg px-4 py-2 outline-none text-sm"
        >
          <option value="">Carpeta Raíz</option>
          <option *ngFor="let f of availableParentFolders" [value]="f.id">{{ f.name }}</option>
        </select>
      </div>
      <div class="pt-2 flex justify-end gap-2">
        <button
          type="button"
          (click)="closeFolderModal.emit()"
          class="px-4 py-2 text-sm font-medium bg-slate-100 hover:bg-slate-200 rounded-lg"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg"
        >
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>

<!-- COMMIT MODAL -->
<div
  *ngIf="showCommitModal"
  class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50"
>
  <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden transform transition-all">
    <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
      <h3 class="text-lg font-bold text-slate-800">Registrar Commit</h3>
      <button type="button" (click)="closeCommitModal.emit()" class="text-slate-400 hover:text-slate-600">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
    <form (submit)="onSubmitCommit($event)" class="p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Hash / ID (Opcional)</label>
        <input
          type="text"
          [(ngModel)]="commitHash"
          name="commitHash"
          class="w-full border border-slate-300 rounded-lg px-4 py-2 outline-none font-mono text-sm focus:ring-2 focus:ring-emerald-500"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Mensaje</label>
        <textarea
          [(ngModel)]="commitMsg"
          name="commitMsg"
          required
          rows="3"
          class="w-full border border-slate-300 rounded-lg px-4 py-2 outline-none text-sm resize-none focus:ring-2 focus:ring-emerald-500"
        ></textarea>
      </div>
      <div class="pt-2 flex justify-end gap-2">
        <button
          type="button"
          (click)="closeCommitModal.emit()"
          class="px-4 py-2 text-sm font-medium bg-slate-100 hover:bg-slate-200 rounded-lg"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="px-4 py-2 text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg"
        >
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>

<!-- FILENAME MODAL -->
<div
  *ngIf="showFilenameModal"
  class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-[60]"
>
  <div class="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden transform transition-all">
    <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
      <h3 class="text-lg font-bold text-slate-800">{{ filenameModalTitle }}</h3>
      <button type="button" (click)="closeFilenameModal.emit()" class="text-slate-400 hover:text-slate-600">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
    <div class="p-6">
      <input
        type="text"
        [(ngModel)]="inputFilename"
        [placeholder]="filenamePlaceholder"
        (keydown.enter)="onConfirmFilename()"
        class="w-full border border-slate-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none text-sm mb-6"
      />
      <div class="flex justify-end gap-2">
        <button
          type="button"
          (click)="closeFilenameModal.emit()"
          class="flex-1 px-4 py-2 text-sm font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition"
        >
          Cancelar
        </button>
        <button
          type="button"
          (click)="onConfirmFilename()"
          class="flex-1 px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition"
        >
          Aceptar
        </button>
      </div>
    </div>
  </div>
</div>

<!-- OPEN MODAL -->
<div
  *ngIf="showOpenModal"
  class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-[60]"
>
  <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden transform transition-all">
    <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
      <h3 class="text-lg font-bold text-slate-800">Archivos en json/rama</h3>
      <button type="button" (click)="closeOpenModal.emit()" class="text-slate-400 hover:text-slate-600">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
    <div class="p-4 bg-slate-50">
      <div class="space-y-2 max-h-72 overflow-y-auto pr-2 custom-scrollbar">
        <p *ngIf="jsonFiles.length === 0" class="text-sm text-slate-500 text-center py-4">No hay archivos.</p>
        <button
          *ngFor="let f of jsonFiles"
          type="button"
          (click)="selectFileToOpen.emit(f.name)"
          class="w-full flex items-center justify-between px-4 py-3 rounded-xl border shadow-sm transition-all mb-2"
          [ngClass]="
            f.name === activeFileName
              ? 'border-indigo-500 bg-indigo-50 text-indigo-700'
              : 'border-slate-200 hover:bg-white text-slate-700'
          "
        >
          <div class="flex items-center gap-3">
            <i
              data-lucide="file-json"
              class="w-4 h-4"
              [ngClass]="f.name === activeFileName ? 'text-indigo-600' : 'text-slate-400'"
            ></i>
            <span class="text-sm font-medium">{{ f.name }}</span>
          </div>
          <span
            *ngIf="f.name === activeFileName"
            class="text-[10px] font-bold uppercase tracking-wider bg-indigo-100 text-indigo-600 px-2 py-1 rounded-full"
          >
            Abierto
          </span>
        </button>
      </div>
    </div>
  </div>
</div>
